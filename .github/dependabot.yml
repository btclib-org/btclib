---
# what is left out, and why:
# - the pre-commit hook revs: dependabot has a pre-commit ecosystem, and
#   the maintainer decided to keep pre-commit.ci for them instead
#   (btclib-org/.github#1391), its weekly autoupdate -- the ci: block of
#   .pre-commit-config.yaml -- already rewriting rev: for every repo: but
#   local and meta, so a second bot on the same pin would only compete
#   with it
# - .clusterfuzzlite/requirements.txt, which is uv.lock exported and which
#   the uv-export hook of .pre-commit-config.yaml rewrites from the lock:
#   a pip entry moving it would be moving it away from the lock. A uv pull
#   request below that moves a package the file names fails that hook
#   until the hook's own output is committed to it
#
# every pull request here runs the whole test matrix, so each ecosystem
# groups its updates into a single pull request. None declares a
# target-branch: without one dependabot opens against the default branch,
# which is the only branch a change lands on -- and a target-branch naming
# a branch that is not there is not an error anywhere, it is a repository
# where nothing is ever proposed.
#
# Weekly: the latest workflow upgrades everything uv resolves and runs
# the suite, the lint gate and the packaging checks against it, on a
# schedule, off the critical path, so each pull request is a diff whose
# result is already known, and a smaller one is easier to read and to
# revert. Monthly would be defensible only if nothing exercised the
# drift beforehand -- a month of it arriving in one diff is harder on
# both counts. The github-actions ecosystem gets the same interval for
# symmetry rather than for evidence: nothing pre-validates an action bump,
# but actions move rarely, and a week where none did produces no pull
# request at all.
#
# The seven day cooldown is what the interval is really
# trading against: a compromised release is usually yanked within days.
# Weekly plus cooldown still means nothing is ever offered before it has
# been public a week -- it means the offer comes at most a week after
# that, rather than at most a month. No ecosystem here tracks anything
# security-critical, so nothing here wants to be faster than that. The
# docker entry at the bottom declares it too, and says why it holds
# nothing back there
version: 2
updates:
  # every action is pinned to a commit SHA, which nothing but this
  # moves: without it a pin is frozen forever, and a fix (or a security
  # advisory) upstream would never reach this repository
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      # thursday, where the latest workflow runs wednesday: the sentinel
      # has just reported when the pull requests are opened. It buys the
      # actions ecosystem nothing, which the sentinel does not cover, but
      # two schedules a day apart are one thing to remember instead of two
      day: thursday
    groups:
      actions:
        patterns: ["*"]
    cooldown:
      default-days: 7

  # uv.lock is committed and the workflows install from it with --locked,
  # while the dependency groups declare a floor and no ceiling: the whole
  # drift of ruff, mypy, pytest and sphinx above it lives in the lock
  # file, and this is the only thing that moves it. The uv-lock pre-commit
  # hook only re-locks what pyproject.toml changed, it does not upgrade,
  # and the latest workflow tests an upgrade it deliberately never commits
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: thursday
    groups:
      dev-tooling:
        patterns: ["*"]
    cooldown:
      default-days: 7

  # .clusterfuzzlite/Dockerfile's base image is pinned by digest, and the
  # tag beside the digest is what this follows: a pull request here is
  # that tag's newer digest.
  #
  # The cooldown is every other ecosystem's seven days: one rule for all.
  # dependabot-core applies it only to a tag it can date, and it dates
  # only Docker Hub's (registry_tag_release_date, in its
  # docker/lib/dependabot/docker/update_checker.rb): on any other registry
  # -- gcr.io, which this image is on -- it logs that it has no publication
  # date and proposes the digest with no cooldown applied. Declared, it
  # costs nothing here, and it holds with no edit to this file once
  # dependabot-core has a date to read
  - package-ecosystem: docker
    directory: /.clusterfuzzlite
    schedule:
      interval: weekly
      day: thursday
    groups:
      base-image:
        patterns: ["*"]
    cooldown:
      default-days: 7
