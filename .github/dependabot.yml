# two of the four ecosystems this repo has, deliberately:
# - the Gemfile is left out: GitHub builds the pages site on its own
#   side, so github-pages is only ever resolved for a local preview
# - the pre-commit hook revs are left out because dependabot has no
#   pre-commit ecosystem; pre-commit.ci updates them instead, weekly and
#   onto dev, as configured in the ci: block of .pre-commit-config.yaml
#
# every pull request here runs the whole test matrix, so both ecosystems
# group their updates into a single pull request and ask monthly rather
# than weekly: nothing either of them tracks is security-critical.
# Both target dev: master only receives merges from it
version: 2
updates:
  # every action is now pinned to a commit SHA, which nothing but this
  # moves: without it a pin is frozen forever, and a fix (or a security
  # advisory) upstream would never reach this repository
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: dev
    groups:
      actions:
        patterns: ["*"]

  # uv.lock is committed and the workflows install from it with --frozen,
  # while the dependency groups declare no version at all: the whole
  # drift of ruff, mypy, pytest and sphinx lives in the lock file, and
  # nothing moves it today. The uv-lock pre-commit hook only re-locks
  # what pyproject.toml changed, it does not upgrade
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    target-branch: dev
    groups:
      dev-tooling:
        patterns: ["*"]
