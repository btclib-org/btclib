# The key parsers, mutated. `key.py` decides whether octets are a SEC
# public key or a private scalar. It refuses input from a party btclib has
# no reason to trust, and 100% statement coverage says only that each
# refusal ran once, not that a wrong prefix or size is refused (issue
# #2443).

[cosmic-ray]
module-path = [
    "src/btclib/key.py",
]

# the module's own tests, for the reasons parsers.toml gives for -n0 and
# -p no:randomly
test-command = """python -m pytest -x -q -n0 -p no:randomly \
  tests/key_test.py tests/key_io_test.py"""

timeout = 300

excluded-modules = []

# No operator is excluded. parsers.toml excludes `BitOr` for the
# annotations it holds, and
#
#   grep -n ' | ' src/btclib/key.py
#
# finds none here.

# one mutant at a time, in this working tree: see sig_hash.toml
[cosmic-ray.distributor]
name = "local"
