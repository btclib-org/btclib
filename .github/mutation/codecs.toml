# The address encodings, mutated: b58 and b32, the bitcoin semantics on
# top of the Base58Check and bech32 codecs that base58_bech32 holds and
# mutates in its own tree. A checksum is exactly the boundary mutation
# testing is for -- a single flipped bit has to be refused, and 100%
# statement coverage says only that the refusal's line ran on the vectors
# already in hand, not that every wrong checksum is caught.

[cosmic-ray]
module-path = [
    "src/btclib/b58.py",
    "src/btclib/b32.py",
]

# each module's own test file
test-command = """python -m pytest -x -q -n0 -p no:randomly \
  tests/b58_test.py tests/b32_test.py"""

timeout = 300

excluded-modules = []

# A sample, run to its budget in 1800 s and read off the
# `codecs-survivors.txt` the workflow uploads, at run 34833390559. Most
# of what it found equivalent is the deferred-annotation class
# parsers.toml documents, or an `is` CPython's small-int cache makes
# indistinguishable from `==`.
#
# A second pass on this same sample closed every other real candidate:
#
# - `b32.witness_from_address`'s `isinstance(b32addr, str)` weakened to
#   `not isinstance` was never told an address padded with the
#   whitespace only the `str` branch strips.
# - `b32.p2tr` hardcodes witness version 1, and nothing checked which
#   version the address it built decoded back as.

[cosmic-ray.distributor]
name = "local"
