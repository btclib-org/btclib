---
name: py arm authority

# tests/py_arm_authority_test.py's `_AUTHORITY` says, per Python arm,
# which third-party-vector-driven test module reaches it -- issue #993's
# answer, landed by #1000. Its own tests check the table's shape
# against the source and against itself, and none of them re-runs the
# coverage that produced its values, because that measurement is minutes
# and not seconds: every module `_THIRD_PARTY_VECTORS` names, each under
# coverage, each in an environment with no bindings installed. Issue
# #1003 is this workflow --
# a pull request should not pay what a schedule can pay once a week.
#
# This reimplements the no-bindings environment test.yml's own
# `no-bindings` job builds, rather than depending on issue #1002's
# coverage-artifact plumbing: that issue is a separate, unmerged pull
# request, and until it lands -- if it lands -- there is no artifact here
# to consume. Once it does, the two assert-and-sync steps below could
# become a download instead, which is the simplification #1003 itself
# names as the reason it "depends on #1002, or at least on the same
# plumbing".
#
# `.github/scripts/check_py_arm_authority.py` does the comparing: it
# imports `_AUTHORITY` straight from the test module rather than parsing
# a second copy of it, runs each `_THIRD_PARTY_VECTORS` module under
# coverage on its own, and diffs what it measures against
# what the table claims, in every direction issue #1003 names -- an
# entry citing a module whose run no longer reaches the arm, a module
# reaching an arm its entry does not name, and something newly reaching
# an arm `_WITHOUT_AN_AUTHORITY` says nothing reaches. It exits non-zero
# on any of the three, which is what makes this job red.
#
# `issues: write` on the job below, the same choice `vendored-vectors.yml`
# makes and by the test its own header states: a link is noticed the next
# time somebody follows it, where a vendored vector is trusted without
# anybody looking at it again. `_AUTHORITY` is on that second
# side. `tests/py_arm_authority_test.py` checks the table's shape and
# never its values, so an entry claiming a module whose run no longer
# reaches the arm passes every other check in the tree, and a run of
# this workflow is the only thing that reads what the entry says.
#
# The issue is beside the red run rather than instead of it: the script
# still exits non-zero on any disagreement, which is what makes this job
# red, and reports before it returns. What the issue adds is that it
# stays open, where a failed run notifies the last person to have
# touched the cron and then sits in the Actions tab.
#
# Which pull request can invalidate the table is not a path list. An arm
# is any function calling `_libsecp256k1_serves`, and what reaches one
# changes above it: `bip32/bip32_test.py` reaches
# `curves.sec_point._sec_from_octets` through `to_pub_key`, which holds
# no arm of its own. That is the push trigger's reasoning below, where a
# filter naming this surface honestly "would be `every merge`".

on:
  # a merge creates a commit no pull request measured, and this census is
  # the one gate here with nothing on that commit: issue #1219 removed an
  # arm and the entry that named `script/taproot_test.py` with it, both
  # correctly, and the same change made that module reach
  # `bytes_from_prv_key_int` instead. Its own run was green two hours
  # before it landed, on a tree that stopped being the tree, and main
  # carried the disagreement until the next pull request to touch a path
  # below happened to run this.
  # No `paths` filter here, where the pull_request trigger has one: the
  # surface a run reads is every module `_THIRD_PARTY_VECTORS` names plus
  # every arm's own module -- most of the package and most of the suite --
  # so a filter that named it honestly would be "every merge", spelled at
  # length and wrong the next time a module moves
  push:
    branches: [main]
  schedule:
    # A census of the tree rather than a question about a dependency, and
    # it gates nothing; codeql.yml is the other sentinel of that shape.
    # The time is section 10's grid in btclib-org/.github and not this
    # file's to restate.
    # Only the default branch schedules workflows, so on any other branch
    # this is reachable through the dispatch below alone
    - cron: "4 4 * * 4"
  workflow_dispatch:
  pull_request:
    # ready_for_review, so a pull request marked ready gets the run the
    # draft condition below withheld while it was a draft: the default
    # types do not include it, and without it a readied pull request
    # would wait for its next push to be checked at all.
    # closed too, though the job below declines the real work on it: a
    # merge or a close is neither a push nor a synchronize, so a run this
    # PR's own concurrency group is still holding survives either unless
    # the closed event lands in that same group -- which this type is
    # what makes it do, cancel-in-progress above turning the landing
    # into the cancellation. The group below keys on github.head_ref
    # rather than plain github.ref for exactly this event: a merged pull
    # request's closed event sets github.ref to the base branch, not the
    # merge ref, which would land it in the scheduled run's own group
    # and race it for cancellation (PR 1023's bug, PR 1026's fix) instead
    # of the PR's own group as intended
    types: [opened, reopened, synchronize, ready_for_review, closed]
    paths:
      - .github/workflows/py-arm-authority.yml
      - .github/scripts/check_py_arm_authority.py
      - tests/py_arm_authority_test.py

permissions:
  contents: read

# head_ref falls back to ref rather than being used bare: it is set only
# for pull_request events, to the PR's head branch, so a scheduled or
# dispatched run (ref refs/heads/main) still gets its own group -- and a
# pull_request event always groups by the PR's branch, closed and
# merged ones included, so it never collides with that group the way
# bare ref did
concurrency:
  group: py-arm-authority-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  authority:
    name: Re-derive the py-arm authority table
    # a draft pull request is work in progress and spends no runner
    # here either: a draft is work its author is not asking anyone to
    # review yet, and its runs are what the required checks already
    # read. The same condition test.yml's no-bindings job carries, and
    # ready_for_review is a trigger type above for the same reason.
    # A closed pull request spends none either -- the trigger above takes
    # the closed event only to supersede a run this ref's group is still
    # holding
    if: ${{ !github.event.pull_request.draft && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # the elevation, on the job that needs it and nowhere else: the
    # workflow-level contents: read above stays as it is, so a job added
    # here later starts read-only rather than inheriting this.
    # issues: write is what the script's gh issue create/edit/close calls
    # take, on the tracking issue this run opens, updates or closes
    permissions:
      contents: read
      issues: write # gh issue create/edit/close, in the last step below
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.14"

      # test.yml's own no-bindings job, verbatim: asked before the
      # measurement and of the interpreter rather than of the resolver,
      # so a job that silently kept the bindings would report every arm
      # reached by the bindings-serving path and not the Python one --
      # exactly the failure this step exists to make impossible
      - name: Assert the bindings are absent
        run: >
          uv run --locked --no-default-groups --group harness
          python -c "from btclib._libsecp256k1 import INSTALLED;
          assert not INSTALLED, 'btclib_secp256k1 is installed';
          from btclib.curves import is_libsecp256k1_serving;
          assert not is_libsecp256k1_serving()"

      # --dry-run on the pull_request trigger only: a fork's read-only
      # token could not write the issue anyway, and a same-repository
      # pull request testing a change to one of the three paths that
      # trigger it -- this file, the script, the table -- should not edit
      # or close whatever tracking issue is open at the time as a side
      # effect of that test.
      # The flag reaches the shell through the environment rather than
      # through a `${{ }}` inside the script, which would be text pasted
      # into it: the value is this file's own, and the habit is what
      # zizmor's template-injection rule is asking for. The array built
      # from it, rather than an unquoted expansion, is release.yml's own
      # shape for an optional flag (its "Check the public API against the
      # previous release" step).
      # The title is written here rather than in the script, so what this
      # run files is named beside the trigger and the permission that let
      # it -- the same argument `vendored-vectors.yml` passes its own
      # script, for a reason of its own
      - name: Re-derive the authority table against a fresh measurement
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'pull_request' && '--dry-run' || '' }}
        run: |
          args=()
          if [ -n "$DRY_RUN" ]; then
            args=(--dry-run)
          fi
          uv run --locked --no-default-groups --group harness \
            python .github/scripts/check_py_arm_authority.py \
            "Python arm authority table disagrees with a fresh measurement" \
            "${args[@]}"
