---
name: changelog-entry

# Asks a pull request that changes what a user gets for its entry under
# changelog/next/. The job is btclib-org/.github's
# reusable-changelog-entry.yml, whose script says what counts as the
# package and what the label no-user-change exempts; what is this
# tree's is the trigger. Section 9 of the organization's standard is the
# rule, and section 10 has this workflow. It is no required check.
#
# No push trigger and no workflow_dispatch, departures section 10 states
# for every workflow that reads what neither event carries: what the job
# reads is a pull request's diff and its labels.

on:
  pull_request:
    # labeled and unlabeled, so that adding or removing no-user-change
    # runs it again; no closed, a merged pull request asking nothing of it
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]

# least privilege for the GITHUB_TOKEN, which a called workflow cannot
# widen: the job reads the tree and writes nothing
permissions:
  contents: read

concurrency:
  # keyed on the pull request, as it has no push run to key: a new head
  # or label replaces the run in flight
  group: changelog-entry-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # the job itself is btclib-org/.github's, called at a tagged commit
  # (section 10 of the organization's standard); what stays here is the
  # trigger
  changelog-entry:
    uses: btclib-org/.github/.github/workflows/reusable-changelog-entry.yml@a96ab77e0b59880c6412f62da26d3f62dfc31e0c # v2026.11.20
