---
name: links

# a real check, and no per-link suppression directives: disable/enable
# comment pairs guard the links somebody once worried about, while the
# ones that actually rot -- tools.ietf.org redirecting, an http:// badge
# -- land outside every pair.
#
# Not a pull request gate, and that is the whole design. A link rots
# without anybody touching the repository, so testing it per commit reports
# the internet's weather on somebody else's branch; and a third party
# returning 502 or throttling a runner would turn a red merge into a thing
# to re-run rather than a thing to fix. Weekly, on demand, and red in the
# Actions tab is where this belongs.
# It therefore does not appear in main's required checks, and must not:
# that rule lives outside the repository and names its checks as literal
# strings

on:
  schedule:
    # Project health: this asks whether what the tree points at over the
    # internet still resolves, where vendored-vectors.yml asks the same of
    # a pinned blob -- one question over two distances.
    # The time is section 10's grid in btclib-org/.github and not this
    # file's to restate.
    # Only the default branch schedules workflows, so on any other branch
    # this is reachable through the dispatch below, and through the
    # pull_request trigger further down.
    - cron: "4 4 * * 6"
  # the escape hatch, and the way to check a branch before merging a
  # documentation change that adds links
  workflow_dispatch:
  # so a change to this file, or to the ignore list beside it, is checked
  # by the thing it configures.
  # This runs more often than the paths list suggests, and the difference is
  # worth knowing: the filter is evaluated against the pull request's whole
  # diff against its base, not against the push that triggered the run, so
  # once a pull request touches either file every later push to that branch
  # runs this too. Harmless -- it is a couple of hundred requests and gates
  # nothing -- but it does mean a transient failure shows up on pushes that
  # changed no link at all
  pull_request:
    # ready_for_review, so a pull request marked ready gets the run the
    # draft condition in reusable-links.yml withheld while it was a draft:
    # the default types do not include it, and without it a readied pull
    # request would wait for its next push to be checked at all.
    # closed too, though the job below declines the real work on it: a
    # merge or a close is neither a push nor a synchronize, so a run this
    # PR's own concurrency group is still holding survives either unless
    # the closed event lands in that same group -- which this type is
    # what makes it do, cancel-in-progress above now false for a landing,
    # so the arriving run queues behind the one already in flight instead
    # of cancelling it; a bare close still cancels, unchanged. The group
    # below keys on
    # github.event.pull_request.number rather than plain github.ref for
    # exactly this event: a merged pull request's closed event sets
    # github.ref to the base branch, not the merge ref, which used to
    # land it in main's own group -- racing the weekly schedule run for
    # cancellation (PR 1023's bug) instead of the PR's own group as
    # intended
    types: [opened, reopened, synchronize, ready_for_review, closed]
    paths:
      - .github/workflows/links.yml
      - .lycheeignore

# least privilege for the GITHUB_TOKEN. lychee is given it for github.com
# links only, where an unauthenticated runner is rate limited hard enough
# to look like rot; contents: read is all that needs.
# Deliberately not issues: write: an automatic "link rot" issue is the
# usual next step here, and it carries nothing past the failed run's own
# notification -- a link is noticed the next time somebody follows it.
# vendored-vectors.yml's header states the other side of that test, a
# vendored vector being trusted without anybody looking at it again, and
# py-arm-authority.yml's is answered against it
permissions:
  contents: read

# cancel superseded runs. Named literally rather than through
# github.workflow, as everywhere else here: in a called workflow that
# expression is the caller's name.
# github.event.pull_request.number, not github.head_ref, is the key: it
# is set only for pull_request events, to the PR's own number, so a
# scheduled or dispatched run (ref refs/heads/main) still gets its own
# group -- and a pull_request event always groups by the PR's own
# number, closed and merged ones included, so it never collides with
# that group the way bare ref did, and it also survives two forks whose
# head branches share a name, which head_ref does not (issue #2101)
concurrency:
  group: links-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !(github.event.action == 'closed' && github.event.pull_request.merged) }}

jobs:
  # the job itself is btclib-org/.github's, called at @main so a fix there
  # reaches this tree in one landing (section 10 of its README.md); what
  # stays here is the trigger, the schedule and which files are this
  # tree's documentation
  links:
    uses: btclib-org/.github/.github/workflows/reusable-links.yml@main
    with:
      targets: '"**/*.md" ".github/**/*.md" ".claude/**/*.md" "docs/**/*.rst"'
