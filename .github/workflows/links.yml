---
name: links

# a real check, and no per-link suppression directives: disable/enable
# comment pairs guard the links somebody once worried about, while the
# ones that actually rot -- tools.ietf.org redirecting, an http:// badge
# -- land outside every pair.
#
# Not a pull request gate, and that is the whole design. A link rots
# without anybody touching the repository, so testing it per commit reports
# the internet's weather on somebody else's branch; and a third party
# returning 502 or throttling a runner would turn a red merge into a thing
# to re-run rather than a thing to fix. Weekly, on demand, and red in the
# Actions tab is where this belongs.
# It therefore does not appear in main's required checks, and must not:
# that rule lives outside the repository and names its checks as literal
# strings

on:
  schedule:
    # Mondays, 04:17 UTC. Not on the hour: GitHub queues scheduled
    # workflows across every repository that asked for the same minute, and
    # the run can be dropped outright when the queue is long.
    # First among the weekday sentinels: whether an external page still
    # resolves is the least volatile of the questions this week asks --
    # latest.yml (Wednesday) and Dependabot (Thursday) each ask something
    # that changes more often than the last. published.yml asks the
    # quietest of them all and asks it monthly, its subject being an
    # artifact already released and therefore fixed
    - cron: "17 4 * * 1"
  # the escape hatch, and the way to check a branch before merging a
  # documentation change that adds links
  workflow_dispatch:
  # so a change to this file, or to the ignore list beside it, is checked
  # by the thing it configures.
  # This runs more often than the paths list suggests, and the difference is
  # worth knowing: the filter is evaluated against the pull request's whole
  # diff against its base, not against the push that triggered the run, so
  # once a pull request touches either file every later push to that branch
  # runs this too. Harmless -- it is a couple of hundred requests and gates
  # nothing -- but it does mean a transient failure shows up on pushes that
  # changed no link at all
  pull_request:
    # ready_for_review, so a pull request marked ready gets the run the
    # draft condition below withheld while it was a draft: the default
    # types do not include it, and without it a readied pull request
    # would wait for its next push to be checked at all.
    # closed too, though the job below declines the real work on it: a
    # merge or a close is neither a push nor a synchronize, so a run this
    # PR's own concurrency group is still holding survives either unless
    # the closed event lands in that same group -- which this type is
    # what makes it do, cancel-in-progress above turning the landing
    # into the cancellation. The group below keys on github.head_ref
    # rather than plain github.ref for exactly this event: a merged pull
    # request's closed event sets github.ref to the base branch, not the
    # merge ref, which used to land it in main's own group -- racing the
    # weekly schedule run for cancellation (PR 1023's bug) instead of
    # the PR's own group as intended
    types: [opened, reopened, synchronize, ready_for_review, closed]
    paths:
      - .github/workflows/links.yml
      - .lycheeignore

# least privilege for the GITHUB_TOKEN. lychee is given it for github.com
# links only, where an unauthenticated runner is rate limited hard enough
# to look like rot; contents: read is all that needs.
# Deliberately not issues: write: an automatic "link rot" issue is the
# usual next step here, and it would be the only workflow in this
# repository that can write anything, to save a maintainer from reading a
# failure notification they already get
permissions:
  contents: read

# cancel superseded runs. Named literally rather than through
# github.workflow, as everywhere else here: in a called workflow that
# expression is the caller's name.
# head_ref falls back to ref rather than being used bare: it is set only
# for pull_request events, to the PR's head branch, so a scheduled or
# dispatched run (ref refs/heads/main) still gets its own group -- and a
# pull_request event always groups by the PR's branch, closed and
# merged ones included, so it never collides with that group the way
# bare ref did
concurrency:
  group: links-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  links:
    name: Check the documentation links
    # a draft pull request is work in progress and spends no runner
    # here either: a draft is work its author is not asking anyone to
    # read yet. The same condition lint.yml and test.yml carry, and
    # ready_for_review is a trigger type above for the same reason.
    # A closed pull request spends none either -- the trigger above takes
    # the closed event only to supersede a run this ref's group is still
    # holding
    if: ${{ !github.event.pull_request.draft && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    # a few hundred requests with retries; a job past this is hung on one
    timeout-minutes: 15
    steps:
      # every action pinned to a commit SHA with the tag in the comment: a
      # tag, let alone a branch, is a name its owner can move
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # see the checkout of the suite job in test.yml
          persist-credentials: false
      - name: Check the links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # the prose, not the code: the source files cite papers and RFCs
          # in comments and docstrings by the hundred, and a citation is a
          # reference rather than a link a reader clicks. What is checked
          # is what a user is invited to follow -- the README, which is
          # also the btclib.org homepage and the PyPI long description,
          # the other root markdown files, the documentation sources, and
          # the markdown kept under tests/, next to what it documents
          # rather than at the root: README.md is how the suite is run and
          # profiled, _data/README.md pins every vendored vector to a
          # commit, and both are prose for a reader rather than a citation
          # in a comment.
          # --no-progress because the log is not a terminal; the retries,
          # the timeout and the cache are what keep a slow or throttling
          # host from being reported as a dead one.
          # --timeout 45, against lychee's default of 20, is not a guess:
          # www.esat.kuleuven.be timed out three times in one run -- 20
          # seconds each, so the retries did happen -- while answering in
          # 0.6 s from a developer machine, and the three runs before and
          # after that one reached it with no timeout at all. A live host
          # unreachable for one minute is the failure mode this workflow was
          # built not to gate on, and 45 seconds is the cheapest way to stop
          # reporting it. If a URL times out run after run it belongs in
          # .lycheeignore with that measurement, as the iacr.org entries do,
          # and not here
          args: >-
            --no-progress
            --max-retries 3
            --retry-wait-time 10
            --timeout 45
            --cache
            --max-cache-age 1d
            --accept 200,206,429
            "*.md" "docs/**/*.rst" "docs/**/*.md" "tests/**/*.md"
          # fail the job, rather than only summarizing: a green run that
          # found dead links is the state this workflow exists to end
          fail: true
        env:
          # for github.com links only, per the permissions comment above
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
