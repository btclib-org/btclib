---
name: os-macos

# the macOS third of the platform sweep, and os-ubuntu.yml's header is the
# argument for all three: what one cell gates, what a sentinel then owes,
# and what a matrix buys on a library whose bindings are compiled.
#
# macOS is where the queueing is worst, which is the measurement that
# keeps these cells off the gate. One pull request run of a six-image
# gate: 45 jobs, 93 minutes of work and 399 minutes of queueing, the
# macOS cells waiting 29.4 and 23.2 minutes on average for a runner --
# one of them 42.2 -- against 0.5 to 1.6 for ubuntu and windows. What a
# run of this workflow costs is the same query, asked of this workflow:
#
#     id=$(gh run list --workflow=os-macos.yml --limit 1 \
#         --json databaseId --jq '.[0].databaseId')
#     gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100"
#
# What these cells buy is narrower than the count suggests: there is no
# platform-conditional branch in this library, which is the property the
# coverage job in test.yml records from the other side -- no sys.platform
# and no sys.version_info anywhere, so every cell walks the same lines. What
# runs here is the standard library under it, and the bindings wheel for the
# one architecture pair this repository does not otherwise install on.
#
# A workflow of its own rather than a row in deps-latest.yml, and that is the
# whole design: this one holds the dependencies at the lock and moves the
# platform, deps-latest.yml moves the dependencies over the platforms it
# samples. A red macOS cell in deps-latest.yml with this workflow green is an
# upgrade; red in both is macOS. One variable each, and the pair reads as
# a difference.
#
# It gates no commit and no merge -- a macOS regression sits on main for at
# most a week -- but release.yml calls it, so one cannot be published

on:
  schedule:
    # A platform sentinel, with os-ubuntu.yml and os-windows.yml: macOS
    # and Windows are the platforms whose runners are the slowest to come,
    # which is why no two of the three share an hour. Red in both is the
    # tree; red in one is that platform, which is the whole of what
    # running them apart buys.
    # The time is section 10's grid in btclib-org/.github and not this
    # file's to restate.
    # Only the default branch schedules workflows, so on any other branch
    # this is reachable through the dispatch below, and through the
    # workflow_call trigger above it.
    - cron: "4 5 * * 4"
  # lets release.yml gate a publication on this platform too, which is what
  # keeps a weekly sentinel from being the only thing that ever asks
  workflow_call:
    inputs:
      concurrency-suffix:
        description: >
          Appended to the concurrency group, and the release workflow is
          the only caller that passes one. See the group below.
        type: string
        default: ""
  # the escape hatch: the platform on demand, for a branch that touches
  # anything a path or a home directory reaches
  workflow_dispatch:

# least privilege for the GITHUB_TOKEN: everything running in a job
# (actions, dependencies) can read the token, so it must not be able to
# write to the repository
permissions:
  contents: read

# cancel superseded runs: the subject here is the commit, which a newer one
# supersedes. Named literally rather than with github.workflow, which in a
# called workflow is the caller's name -- release.yml calls this one
# alongside test.yml, and with that expression the two would share a group
# and cancel each other. The suffix is the second half of the same
# problem, github.ref inside a called workflow being the caller's
# ref: see lint.yml
concurrency:
  group: os-macos-${{ github.ref }}${{ inputs.concurrency-suffix }}
  cancel-in-progress: true

jobs:
  suite-macos:
    uses: btclib-org/.github/.github/workflows/reusable-os-suite.yml@main
    with:
      runners: '["macos-26-intel", "macos-latest"]'
      python-versions: '["3.11", "3.12", "3.13", "3.14", "3.14t", "pypy3.11"]'
      fetch-tags: true
