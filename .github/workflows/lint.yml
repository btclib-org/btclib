name: lint

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev
  # lets the release workflow gate publication on these same checks
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Check linted md
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          command: config
          globs: |
            .markdownlint.jsonc
            **/*.md
      - name: Setup uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Check ruff lint rules
        run: uv run --frozen --no-default-groups --group lint ruff check
      - name: Check ruff formatting
        run: uv run --frozen --no-default-groups --group lint ruff format --check
      # pre-commit.ci runs mypy too, but from the rev pinned in its own
      # config: this runs the version the project itself pins, and keeps
      # the check from resting on a third party alone
      - name: Check mypy types
        run: uv run --frozen --no-default-groups --group lint mypy btclib tests
