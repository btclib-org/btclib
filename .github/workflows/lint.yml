name: lint

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev
  # lets the release workflow gate publication on these same checks
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Check linted md
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          command: config
          globs: |
            .markdownlint.jsonc
            **/*.md
      - name: Setup uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Check ruff lint rules
        run: uv run --frozen --no-default-groups --group lint ruff check
      - name: Check ruff formatting
        run: uv run --frozen --no-default-groups --group lint ruff format --check
      # pre-commit.ci runs mypy too, but from the rev pinned in its own
      # config, and through a hook that defaults to
      # --ignore-missing-imports: this runs the version the project itself
      # pins, and against the real pytest, which the test group is here to
      # provide. Without it every "import pytest" under tests/ is an
      # import-not-found
      - name: Check mypy types
        run: >
          uv run --frozen --no-default-groups --group lint --group test
          mypy btclib tests
