---
name: lint

# the fast gate, kept apart from the test workflow: a style error is not
# worth discovering at the end of a matrix, and two workflows mean two
# badges and two lines in the checks list, so a lint failure does not
# read as "the build is red".
# What runs here is .pre-commit-config.yaml itself rather than a second
# list of the same tools: CI therefore enforces exactly what a commit
# enforces, every hook included, and no hook is gated by pre-commit.ci
# alone

on:
  push:
    # main only: a push to a branch that has an open pull request would
    # run this workflow twice, once per event, and the two runs land in
    # different concurrency groups (refs/heads/<branch> against
    # refs/pull/N/merge) so neither cancels the other. The pull_request
    # run is the one worth keeping, because it lints the merge commit and
    # is the only run a fork's pull request produces at all.
    # main keeps a trigger of its own because a merge creates a commit
    # that is not the one the pull request linted, and nothing else would
    # ever lint it. Tag pushes are covered by the release workflow
    branches: [main]
  pull_request:
    # ready_for_review, so a pull request marked ready gets the run the
    # draft condition below withheld while it was a draft: the default
    # types do not include it, and without it a readied pull request
    # would wait for its next push to be checked at all.
    # closed too, though the job below declines the real work on it: a
    # merge or a close is neither a push nor a synchronize, so a run this
    # PR's own concurrency group is still holding survives either unless
    # the closed event lands in that same group -- which this type is
    # what makes it do, cancel-in-progress above turning the landing
    # into the cancellation. A closed pull request has nothing left to
    # ask this workflow, the merge commit being main's own push
    # trigger's question. The group below keys on the pull request's own
    # number rather than plain github.ref for exactly this event: a
    # merged pull request's closed event sets github.ref to the base
    # branch, not the merge ref, which used to land it in main's own
    # push group and race the merge commit's run for cancellation
    # (PR 1023's bug) instead of the PR's own group as intended
    types: [opened, reopened, synchronize, ready_for_review, closed]
  # lets the release workflow gate publication on these same checks
  workflow_call:
    inputs:
      concurrency-suffix:
        description: >
          Appended to the concurrency group, and the release workflow is
          the only caller that passes one. See the group below.
        type: string
        default: ""
  # the escape hatch: a run on demand for a branch whose pull request is
  # not open yet
  workflow_dispatch:

# least privilege for the GITHUB_TOKEN: everything running in a job
# (actions, dependencies, hooks) can read the token, so it must not be
# able to write to the repository
permissions:
  contents: read

# cancel superseded runs on the same branch/PR.
# The group is named literally rather than with github.workflow, which in
# a called workflow is the caller's name: the release workflow calls both
# this and test.yml, and with that expression the two would share a group
# and cancel each other.
# github.ref has the same shape of problem one level down, and it is why
# the suffix is there. Inside a called workflow that context is the
# caller's ref, so a rehearsal -- a workflow_dispatch of release.yml on a
# branch, which is what RELEASING.md prescribes -- computes
# lint-refs/heads/<branch>, the very group a push to that branch or a
# direct dispatch of this workflow computes. One then kills the other:
# either the rehearsal dies mid-build, or it cancels the run of the push.
# A tag run is unaffected, refs/tags/v* being a ref nothing else uses.
# release.yml passes a suffix of its own, which keeps the release path
# out of the branch groups while still letting a second rehearsal of the
# same branch supersede the first.
# github.event.pull_request.number, not github.ref alone, is a third
# problem with the same shape: for a closed, merged pull request's run,
# github.ref resolves to the base branch's ref rather than
# refs/pull/N/merge, colliding with the push trigger's own group --
# PR 1023's bug, recorded in the pull_request trigger's own comment
# above. A pull_request run of any action, closed included, now groups
# by the pull request's own number instead, which a push never carries
# and so still groups by github.ref, unchanged
concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}${{ inputs.concurrency-suffix }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type-check
    # a draft pull request is work in progress: every push to one runs
    # these checks on a tree its author is not asking anyone to review
    # yet. A run on the merge result still happens the moment the pull
    # request is marked ready, which is why ready_for_review is a
    # trigger type above.
    # The exception is by base branch, and it is the release pull
    # A closed pull request spends no runner either, for the reason the
    # trigger above gives: closed is taken only to supersede a run this
    # ref's group is still holding
    if: ${{ !github.event.pull_request.draft && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    # nothing here takes minutes; a job that does is hung
    timeout-minutes: 20
    steps:
      # every action is pinned to a commit SHA, the tag in the comment: a
      # tag, let alone a branch, is a name its owner can move, and these
      # run in a job that can read the workflow token
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # see the checkout of the suite job in test.yml
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # the wheels of the lint group, pre-commit itself among them, and
          # the project environment the mypy hook type checks against
          enable-cache: true
      # what the cache key has to distinguish, and why a step computes it.
      # ImageOS is set by the runner image ("ubuntu24"), not by this
      # workflow, and the env context holds only what a workflow, job or
      # step declares -- so "${{ env.ImageOS }}" in the key below would
      # interpolate to the empty string and the comment claiming otherwise
      # would be the only thing distinguishing the images. Read here, in a
      # shell, where it is an ordinary environment variable.
      # ImageOS and not ImageVersion: the version moves every week or two
      # for patches no hook environment depends on, and putting it in the
      # key would mean rebuilding all of them that often
      - name: Identify the runner image
        id: image
        run: echo "os=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"
      # the hook environments are the slow part, node for markdownlint
      # above all; they only change when the revisions pinned in
      # .pre-commit-config.yaml change.
      # The key carries the runner image and the interpreter as well as that
      # file, because what is cached is virtualenvs: a hook environment is
      # built against whatever Python pre-commit runs under, which here is
      # the one .python-version pins, and against the runner's node and go.
      # The config hash alone would survive an ubuntu-latest rotation --
      # 22.04 to 24.04, and the next one -- and restore environments built
      # on the previous image under the same key.
      # restore-keys then makes a revision bump cheap rather than a cold
      # start: pre-commit rebuilds the hooks whose rev moved and reuses the
      # rest, and it health-checks each restored environment against the
      # interpreter it finds, so a stale one is rebuilt rather than run --
      # which is what makes a partial restore safe to want
      - name: Cache the pre-commit hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: >-
            pre-commit-${{ runner.os }}-${{ steps.image.outputs.os }}-${{
            hashFiles('.pre-commit-config.yaml', '.python-version') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-${{ steps.image.outputs.os }}-
      # pre-commit from the lint group of pyproject.toml, pinned by uv.lock,
      # rather than from uvx, which fetches whatever the index holds that
      # morning. This is the gate, and a developer runs the locked version,
      # so uvx is the one place where the two could differ -- the tool
      # deciding what "clean" means being the only one not pinned, while
      # every hook it runs is.
      # --only-group omits the project, so this installs no bindings; the
      # mypy hook installs what it needs itself
      - name: Run the pre-commit hooks
        run: >
          uv run --locked --only-group lint
          pre-commit run --all-files --show-diff-on-failure
