---
name: docs

# the third gate, and a question of its own: does the documentation build.
# It was the second job of lint.yml, and the two answer different things --
# a failed sphinx build and a failed hook are different verdicts, and one
# badge and one line in the checks list each is what says so. It installs a
# different dependency group and needs no pre-commit cache, so the two share
# nothing but the checkout

on:
  push:
    # main only, for the reason lint.yml gives at the same key: a push to a
    # branch with an open pull request would run this twice, in two
    # concurrency groups that do not cancel each other, and the
    # pull_request run is the one worth keeping. The run on main is also
    # what writes a cache the pull requests can read
    branches: [main]
  pull_request:
    # ready_for_review, so a pull request marked ready gets the run the
    # draft condition in reusable-docs.yml withheld while it was a draft.
    # closed too, though the job below declines the real work on it: a
    # merge or a close is neither a push nor a synchronize, so a run this
    # PR's own concurrency group is still holding survives either unless
    # the closed event lands in that same group -- which this type is
    # what makes it do, cancel-in-progress above turning the landing
    # into the cancellation. A closed pull request has nothing left to
    # ask this workflow, the merge commit being main's own push
    # trigger's question. The group below keys on the pull request's own
    # number rather than plain github.ref for exactly this event: a
    # merged pull request's closed event sets github.ref to the base
    # branch, not the merge ref, which used to land it in main's own
    # push group and race the merge commit's run for cancellation
    # (PR 1023's bug) instead of the PR's own group as intended
    types: [opened, reopened, synchronize, ready_for_review, closed]
  # lets the release workflow gate publication on this check too
  workflow_call:
    inputs:
      concurrency-suffix:
        description: >
          Appended to the concurrency group, and the release workflow is
          the only caller that passes one. See the group below.
        type: string
        default: ""
  # the escape hatch: a run on demand for a branch whose pull request is
  # not open yet
  workflow_dispatch:

# least privilege for the GITHUB_TOKEN: everything running in a job
# (actions, dependencies) can read the token, so it must not be able to
# write to the repository
permissions:
  contents: read

# cancel superseded runs on the same branch/PR.
# The group is named literally rather than with github.workflow, which in a
# called workflow is the caller's name: the release workflow calls this one
# alongside test.yml and lint.yml, and with that expression they would share
# a group and cancel each other.
# github.ref has the same shape of problem one level down, and it is why
# the suffix is there. Inside a called workflow that context is the
# caller's ref, so a rehearsal -- a workflow_dispatch of release.yml on a
# branch -- computes docs-refs/heads/<branch>, the very group a push to
# that branch or a direct dispatch of this workflow computes. One then
# kills the other. release.yml passes a suffix of its own, which keeps
# the release path out of the branch groups (issue btclib-org/.github#1083).
# github.event.pull_request.number, not github.head_ref, is the key: a
# pull_request event always groups by the PR's own number, closed and
# merged ones included, so it never collides with a push's group the way
# bare ref did, and it also survives two forks whose head branches share a
# name -- head_ref does not, being the branch's name rather than the pull
# request's own number (issue #1158)
concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}${{ inputs.concurrency-suffix }}
  cancel-in-progress: true

jobs:
  # the checkout, the uv setup, the build and the unresolved-link check are
  # btclib-org/.github's: reusable-docs.yml, called at @main so a fix there
  # reaches this tree in one landing (section 10 of its README.md). What
  # stays here is the trigger, the concurrency group and the workflow-level
  # permissions; the draft and closed declines are the called workflow's
  # own, reading github.event.pull_request.draft and github.event.action off
  # this caller's trigger (btclib-org/.github#35).
  #
  # This tree has no git submodule for the build to check out, so
  # `submodules` is left at its default; and no script of its own to run
  # against the built pages, so `post-build-script` is too.
  #
  # The reusable workflow's own unresolved-link grep matches only
  # href="#./", not href="#../" the way this tree's own step used to:
  # `.pre-commit-config.yaml`'s local-link-prefix hook here accepts a
  # `../`-prefixed destination as well as a `./`-prefixed one (unlike
  # three other repositories of the organization), so becoming a caller
  # drops the artifact-level backstop for a broken `../` link that #1575
  # added. A broken one still fails `sphinx-build -n -W` on its own,
  # through myst's own unresolved-reference warning (issue #1562) -- the
  # same primary defense the reusable workflow's own comment leans on for
  # "#./" -- so nothing catches that case at the artifact level if that
  # defense is ever weakened. Reported rather than compensated for
  # locally, per btclib-org/.github#35.
  docs:
    uses: btclib-org/.github/.github/workflows/reusable-docs.yml@main
