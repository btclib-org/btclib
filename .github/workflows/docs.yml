---
name: docs

# the third gate, and a question of its own: does the documentation build.
# It was the second job of lint.yml, and the two answer different things --
# a failed sphinx build and a failed hook are different verdicts, and one
# badge and one line in the checks list each is what says so. It installs a
# different dependency group and needs no pre-commit cache, so the two share
# nothing but the checkout

on:
  push:
    # main only, for the reason lint.yml gives at the same key: a push to a
    # branch with an open pull request would run this twice, in two
    # concurrency groups that do not cancel each other, and the
    # pull_request run is the one worth keeping. The run on main is also
    # what writes a cache the pull requests can read
    branches: [main]
  pull_request:
    # ready_for_review, so a pull request marked ready gets the run the
    # draft condition below withheld while it was a draft.
    # closed too, though the job below declines the real work on it: a
    # merge or a close is neither a push nor a synchronize, so a run this
    # PR's own concurrency group is still holding survives either unless
    # the closed event lands in that same group -- which this type is
    # what makes it do, cancel-in-progress above turning the landing
    # into the cancellation. A closed pull request has nothing left to
    # ask this workflow, the merge commit being main's own push
    # trigger's question. The group below keys on github.head_ref rather
    # than plain github.ref for exactly this event: a merged pull
    # request's closed event sets github.ref to the base branch, not the
    # merge ref, which used to land it in main's own push group and race
    # the merge commit's run for cancellation (PR 1023's bug) instead of
    # the PR's own group as intended
    types: [opened, reopened, synchronize, ready_for_review, closed]
  # lets the release workflow gate publication on this check too
  workflow_call:
  # the escape hatch: a run on demand for a branch whose pull request is
  # not open yet
  workflow_dispatch:

# least privilege for the GITHUB_TOKEN: everything running in a job
# (actions, dependencies) can read the token, so it must not be able to
# write to the repository
permissions:
  contents: read

# cancel superseded runs on the same branch/PR.
# The group is named literally rather than with github.workflow, which in a
# called workflow is the caller's name: the release workflow calls this one
# alongside test.yml and lint.yml, and with that expression they would share
# a group and cancel each other.
# head_ref falls back to ref rather than being used bare: it is set only
# for pull_request events, to the PR's head branch, so a push run (ref
# refs/heads/main) still gets its own group -- and a pull_request event
# always groups by the PR's branch, closed and merged ones included, so
# it never collides with a push's group the way bare ref did
concurrency:
  group: docs-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Without this workflow nothing in CI builds the documentation, only read the
  # docs does, with -W, so invalid reStructuredText in a docstring fails
  # after the merge, on a service whose failure is not a check on the pull
  # request -- a docstring naming bip340_nonce_, whose trailing underscore
  # rst reads as a link reference, or a title underline left too short by
  # a rename (issues 148, 151, 174).
  #
  # No hook can take this over: markdownlint does not read .rst, and ruff's
  # pydocstyle rules check the form of a docstring rather than whether its
  # body is valid rst.
  #
  docs:
    # the name is the required check on main, and it did not change when
    # this job moved out of lint.yml: branch protection matches a context by
    # name and not by the workflow that reported it, which is what let the
    # move happen without touching the rule
    name: Build the documentation
    # a draft pull request is work in progress and spends no runner here
    # either: a draft is work its author is not asking anyone to read
    # yet. A closed pull request spends none either -- the trigger above
    # takes the closed event only to supersede a run this ref's group is
    # still holding
    if: ${{ !github.event.pull_request.draft && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    # about ten seconds of sphinx; a job that takes minutes is hung
    timeout-minutes: 20
    steps:
      # every action is pinned to a commit SHA, the tag in the comment
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # see the checkout of the coverage job in test.yml
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      # the same command .readthedocs.yaml runs and CONTRIBUTING.md
      # documents, so what CI checks is what gets published.
      # Not --only-group docs: autodoc imports every module of the package,
      # so btclib and its bindings have to be installed -- which is the
      # defect issue 151 was opened for, read the docs having installed
      # sphinx alone and rendered 70 empty module headings.
      # -W makes a failed import a failed build, and --keep-going reports
      # every problem in one run instead of one per push. -n turns an
      # unresolved cross-reference into a warning for -W to fail on --
      # without it a renamed class or a moved function in a :class: role
      # builds green and links nowhere. conf.py's intersphinx_mapping and
      # nitpick_ignore are what -n is checked against
      - name: Build the docs
        run: >
          uv run --locked --no-default-groups --group docs
          sphinx-build -n -W --keep-going -b html docs/source docs/build/html
      # a second defense against issue 195, not the only one: measured,
      # sphinx-build -n -W already fails on its own on every link myst
      # cannot resolve, in the currently pinned toolchain (myst-parser
      # 5.1.0, sphinx 9.1.0) -- myst_refs.py's MystReferenceResolver logs a
      # warning unconditionally, independent of -n, before falling back to
      # the anchor-only node the html then carries (issue #1574). What this
      # step still answers for is a regression the build's own warning would
      # stop catching without it: conf.py's suppress_warnings staying empty
      # is a configuration this grep does not depend on, and a myst-parser
      # upgrade could in principle stop warning unconditionally the way
      # 5.1.0 does. Either way the artifact would then carry exactly the
      # anchor to an id nothing has that conf.py's own comment describes,
      # and this grep is what would still catch it.
      #
      # One grep, widened to two spellings rather than one. myst's
      # fallback renders the destination verbatim, so what this can
      # match is decided upstream of here, in how the link was written
      # -- and the local-link-prefix hook in .pre-commit-config.yaml
      # refuses a local destination that does not begin "./" or "../",
      # in the commit that writes it (issue #1562). Every destination
      # the included root files carry therefore renders
      # href="#./<destination>" or href="#../<destination>" when it
      # breaks, anchor, extension and nested path alike (issue
      # btclib-org/.github#20; the hook's own comment has the
      # measurement behind that).
      #
      # Not a second grep for a bare destination beside it. It would be
      # unreachable with the hook in place, and it is no superset of
      # this one even without: a character class of name characters
      # stops at the "#" of an anchor, so href="#README.md#build" is a
      # shape both patterns pass over. That is the argument for the hook
      # rather than for a third pattern -- a check downstream of the
      # rendering has to anticipate every way a link can be written, and
      # a rule upstream of it permits one.
      #
      # Not lychee: links.yml reads the sources, where "./CONTRIBUTING.md"
      # is a correct path, and pointing it at docs/build/html would mean
      # building the documentation inside a workflow that gates nothing
      # and re-requesting every external url these pages carry.
      # Not the local-link-prefix hook in place of this step either, for
      # all that it is what settles the spelling: it reads the markdown, and
      # the claim made here is about the built artifact -- that no page
      # sphinx wrote carries an anchor to an id nothing has, whatever
      # emitted it and whatever conf.py is configured to warn about.
      #
      # Not narrowed to myst's own class="xref myst" either. The defect is
      # an href to an id no page has, whoever emitted it, and the prose
      # that could be mistaken for one cannot reach the attribute: the
      # CHANGELOG entry for issue 195 quotes href="#./FILE.md" in so many
      # words and lands in the page as href=&quot;#./, escaped, measured
      # on the built html
      - name: Check the built pages for unresolved links
        run: |
          if grep -rnE 'href="#\.\.?/' docs/build/html --include='*.html'; then
            echo "::error::the links above resolve to no page (unresolved relative path)"
            exit 1
          fi
