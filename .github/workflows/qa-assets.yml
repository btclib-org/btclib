---
name: qa-assets

# The fuzz corpora of Bitcoin Core and rust-bitcoin, replayed through the
# btclib parsers that read the same bytes. Both qa-assets repositories
# grow as their fuzzers run, so a parser that handled last week's inputs
# may not handle this week's: a clock asks, because the corpora change
# with no commit here.
# tests/integration/qa_assets_test.py is the replay and holds the table
# from a corpus directory to its parser; a failure there is an exception
# other than BTClibException, named with the input that raised it.
#
# Informational: no aggregate job, a finding being an issue against a
# parser and not a block on an unrelated merge. The pull request trigger
# is filtered to this file and to the replay, so a pull request that
# changes either runs it. The replay adds seconds to the wait on the
# gates, so section 10's clock rule keeps the trigger. Only the default
# branch schedules workflows.
#
# The checkouts are sparse and blobless: Core's qa-assets is large, and
# the replay reads only the directories listed below.
# A row added to the table needs its directory added here; the test
# fails on a directory the checkout lacks.
on:
  schedule:
    # The time is section 10's grid in btclib-org/.github and not this
    # file's to restate.
    - cron: "4 3 * * 2"
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, closed]
    paths:
      - .github/workflows/qa-assets.yml
      - tests/integration/qa_assets_test.py

permissions:
  contents: read

# named literally rather than through github.workflow, as section 10
# asks, and keyed on the pull request's own number. No push trigger, so
# the run in flight is the only reading a merge gets: a closed, merged
# event queues behind it
concurrency:
  group: qa-assets-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !(github.event.action == 'closed' && github.event.pull_request.merged) }}

jobs:
  replay:
    name: Replay the fuzz corpora
    if: ${{ !github.event.pull_request.draft && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout qa-assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bitcoin-core/qa-assets
          path: qa-assets
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            fuzz_corpora/block
            fuzz_corpora/block_deserialize
            fuzz_corpora/block_filter_deserialize
            fuzz_corpora/block_header_and_short_txids_deserialize
            fuzz_corpora/blockheader_deserialize
            fuzz_corpora/blockmerkleroot
            fuzz_corpora/blocktransactions_deserialize
            fuzz_corpora/blocktransactionsrequest_deserialize
            fuzz_corpora/coins_deserialize
            fuzz_corpora/decode_tx
            fuzz_corpora/inv_deserialize
            fuzz_corpora/merkle_block_deserialize
            fuzz_corpora/out_point_deserialize
            fuzz_corpora/partial_merkle_tree_deserialize
            fuzz_corpora/prefilled_transaction_deserialize
            fuzz_corpora/script_deserialize
            fuzz_corpora/transaction
            fuzz_corpora/tx_in
            fuzz_corpora/tx_in_deserialize
            fuzz_corpora/tx_out
            fuzz_corpora/txoutcompressor_deserialize
      - name: Checkout rust-bitcoin's qa-assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rust-bitcoin/qa-assets
          path: rust-bitcoin-qa-assets
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            fuzz_corpora/bip158_parse_filter
            fuzz_corpora/bitcoin_0_32_deser_net_msg
            fuzz_corpora/bitcoin_deserialize_block
            fuzz_corpora/bitcoin_deserialize_prefilled_transaction
            fuzz_corpora/bitcoin_deserialize_script
            fuzz_corpora/bitcoin_deserialize_transaction
            fuzz_corpora/bitcoin_deserialize_witness
            fuzz_corpora/bitcoin_encoding_roundtrip_block
            fuzz_corpora/bitcoin_encoding_roundtrip_block_header
            fuzz_corpora/bitcoin_encoding_roundtrip_out_point
            fuzz_corpora/bitcoin_encoding_roundtrip_p2p_address_addr_v1_message
            fuzz_corpora/bitcoin_encoding_roundtrip_p2p_address_addr_v2_message
            fuzz_corpora/bitcoin_encoding_roundtrip_p2p_address_address
            fuzz_corpora/bitcoin_encoding_roundtrip_p2p_bip152_block_transactions
            fuzz_corpora/bitcoin_encoding_roundtrip_p2p_bip152_block_transactions_request
            fuzz_corpora/bitcoin_encoding_roundtrip_p2p_bip152_header_and_short_ids
            fuzz_corpora/bitcoin_encoding_roundtrip_p2p_bip152_prefilled_transaction
            fuzz_corpora/bitcoin_encoding_roundtrip_p2p_bip434_feature
            fuzz_corpora/bitcoin_encoding_roundtrip_p2p_bip434_feature_data
            fuzz_corpora/bitcoin_encoding_roundtrip_p2p_bip434_feature_id
            fuzz_corpora/bitcoin_encoding_roundtrip_p2p_merkle_tree_merkle_block
            fuzz_corpora/bitcoin_encoding_roundtrip_p2p_merkle_tree_partial_merkle_tree
            fuzz_corpora/bitcoin_encoding_roundtrip_p2p_message_addr_payload
            fuzz_corpora/bitcoin_encoding_roundtrip_p2p_message_addr_v2_payload
            fuzz_corpora/bitcoin_encoding_roundtrip_p2p_message_blockdata_get_blocks_message
            fuzz_corpora/bitcoin_encoding_roundtrip_p2p_message_blockdata_get_headers_message
            fuzz_corpora/bitcoin_encoding_roundtrip_p2p_message_blockdata_inventory
            fuzz_corpora/bitcoin_encoding_roundtrip_p2p_message_compact_blocks_send_cmpct
            fuzz_corpora/bitcoin_encoding_roundtrip_p2p_message_erlay_send_tx_rcn_cl
            fuzz_corpora/bitcoin_encoding_roundtrip_p2p_message_fee_filter
            fuzz_corpora/bitcoin_encoding_roundtrip_p2p_message_filter_c_f_checkpt
            fuzz_corpora/bitcoin_encoding_roundtrip_p2p_message_filter_c_f_headers
            fuzz_corpora/bitcoin_encoding_roundtrip_p2p_message_filter_c_filter
            fuzz_corpora/bitcoin_encoding_roundtrip_p2p_message_filter_get_c_f_checkpt
            fuzz_corpora/bitcoin_encoding_roundtrip_p2p_message_filter_get_c_f_headers
            fuzz_corpora/bitcoin_encoding_roundtrip_p2p_message_filter_get_c_filters
            fuzz_corpora/bitcoin_encoding_roundtrip_p2p_message_inventory_payload
            fuzz_corpora/bitcoin_encoding_roundtrip_p2p_message_network_user_agent
            fuzz_corpora/bitcoin_encoding_roundtrip_p2p_message_ping
            fuzz_corpora/bitcoin_encoding_roundtrip_p2p_message_pong
            fuzz_corpora/bitcoin_encoding_roundtrip_p2p_message_v1_network_message
            fuzz_corpora/bitcoin_encoding_roundtrip_redeem_script_buf
            fuzz_corpora/bitcoin_encoding_roundtrip_script_pub_key_buf
            fuzz_corpora/bitcoin_encoding_roundtrip_script_sig_buf
            fuzz_corpora/bitcoin_encoding_roundtrip_tap_script_buf
            fuzz_corpora/bitcoin_encoding_roundtrip_transaction
            fuzz_corpora/bitcoin_encoding_roundtrip_tx_in
            fuzz_corpora/bitcoin_encoding_roundtrip_tx_out
            fuzz_corpora/bitcoin_encoding_roundtrip_witness
            fuzz_corpora/bitcoin_encoding_roundtrip_witness_script_buf
            fuzz_corpora/bitcoin_script_bytes_to_asm_fmt
            fuzz_corpora/consensus_encoding_decode_byte_vec
            fuzz_corpora/consensus_encoding_decode_compact_size
            fuzz_corpora/p2p_deserialize_raw_net_msg
      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Name the corpora read
        run: |
          git -C qa-assets log -1 --format='bitcoin-core/qa-assets %H %cI'
          git -C rust-bitcoin-qa-assets log -1 --format='rust-bitcoin/qa-assets %H %cI'
      - name: Replay
        env:
          BTCLIB_QA_ASSETS: ${{ github.workspace }}/qa-assets
          BTCLIB_RUST_BITCOIN_QA_ASSETS: ${{ github.workspace }}/rust-bitcoin-qa-assets
        # no coverage: the floor is a claim about the ordinary run
        run: >-
          uv run --locked --no-default-groups --group test
          pytest tests/integration/qa_assets_test.py -n 0 --no-cov
