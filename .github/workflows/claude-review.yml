---
name: claude-review

# The job below calls btclib-org/.github's reusable-claude-review.yml
# (issue btclib-org/.github#35), which now holds the checkout, the
# credential guard, the prompt, the action pin and the verdict check for
# both of its own jobs, `review` and `mention`. A `uses:` job invokes the
# whole called workflow, so this one calling job already reaches both of
# them, and each declines the events that are not its own -- `review` on
# anything but a pull request, `mention` on anything but a comment
# carrying @claude. This file keeps only what a calling job may carry:
# the trigger, the workflow-level permissions and concurrency, and, on
# the job, `secrets` and `permissions` -- `runs-on`, `steps`, `env` and
# `timeout-minutes` are the callee's now, and so is the `if:` that used
# to separate the two jobs here.
#
# Not a required check, and it must not become one -- REPOSITORY.md's
# rule is that `main`'s required contexts are named outside the
# repository, and a review that gates a merge would make a model's
# judgement a branch rule. The required checks stay what they are, and
# which ones those are is REPOSITORY.md's to record and the endpoint's
# to answer.
#
# CLAUDE_REVIEW_ENABLED is the switch, an *organization* variable read
# inside the callee's own jobs; section 11's *Review* is where what it
# does is stated rather than here a second time.
#
# It is one more job on every pull request, which is not free: the
# concurrency ceiling belongs to the organization, shared across every
# repository in it, and REPOSITORY.md measures what a commit at that
# ceiling costs in wall clock. It earns the slot by being short -- it
# reads a diff, it does not build a matrix -- and by skipping a draft,
# the callee's own condition now, as test.yml's own jobs do on their
# own account.

on:
  pull_request:
    # ready_for_review so a pull request marked ready gets the review the
    # callee's draft condition withheld while it was a draft: the default
    # types do not include it, and without it a readied pull request would
    # wait for its next push to be reviewed at all. The same reasoning
    # links.yml carries for the same type.
    # closed too: the group below is at the workflow level, so a closed
    # run enters it when the run is created, before any job's own if: is
    # read, and can cancel a review still holding the group -- what
    # declines the actual review on a closed pull request is the callee's
    # own job-level if:, not this file's
    types: [opened, reopened, synchronize, ready_for_review, closed]
  # the on-demand half: somebody writes @claude in a comment on a pull
  # request, or on a line of its diff, and asks for something the automatic
  # pass did not answer
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# least privilege for the GITHUB_TOKEN, elevated on the job below and
# nowhere else
permissions:
  contents: read

# named literally rather than through github.workflow, as everywhere else
# here, and at the workflow level rather than on the job below: with one
# calling job that carries no `if:` of its own, the two placements claim
# the same slot at the same moment, so this is not the fix -- moving the
# key itself is. `github.event.pull_request.number` alone is empty on an
# issue_comment event, which is the mention's, so every mention in the
# repository would land in one bare "claude-review-" group and cancel
# each other; and a pull_request_review_comment event carries
# github.event.pull_request.number too, so the number alone would also
# put a mention answer in the review's own group, letting either cancel
# the other. github.event_name tells the two apart -- true only for a
# pull_request event, which keeps the review's own group (a push
# cancels a superseded review). Every other event falls back to
# github.run_id, unique to that run: no two runs can ever share it,
# which is what a job with no concurrency block at all gives every
# run, so cancel-in-progress below is inert for the mention and one
# @claude answer still runs to completion alongside another rather than
# cancelling it. `btclib-secp256k1` already carries this key, decided at
# btclib-org/btclib-secp256k1#593
concurrency:
  group: >-
    claude-review-${{ github.event_name == 'pull_request'
    && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  claude-review:
    # restated here because a called workflow's own `permissions:` can
    # only downgrade what the caller granted, never restore an omitted
    # scope -- btclib-org/.github#912 is where that is measured, and
    # the callee's own header states the triple its two jobs need:
    # `pull-requests: write` for posting the review or the reply,
    # `id-token: write` for the OIDC token the action mints during its
    # own startup
    permissions:
      contents: read
      pull-requests: write # posting the review, and the reply to a mention
      id-token: write # the OIDC token the action mints at its own startup
    uses: btclib-org/.github/.github/workflows/reusable-claude-review.yml@main
    # this tree's prompt carries no paragraph of its own between the
    # verdict paragraph and the callee's "Do not run the gates", and its
    # `claude_args` names no tool beyond the callee's own list -- so
    # neither extra-prompt nor extra-allowed-tools is passed. Both reach
    # only the callee's review job, never its mention job, which is why
    # passing them on this one calling job loses nothing
    #
    # named rather than `secrets: inherit`: the callee declares only
    # CLAUDE_CODE_OAUTH_TOKEN as required, and passing every secret this
    # repository holds to reach that one is a wider blast radius than the
    # call needs -- zizmor's secrets-inherit audit is what flags the
    # blanket form
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
