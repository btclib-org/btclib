---
name: test

on:
  push:
    # master only: a push to a branch that has an open pull request would
    # run this workflow twice, once per event, and the two runs land in
    # different concurrency groups (refs/heads/dev against
    # refs/pull/N/merge) so neither cancels the other. The pull_request
    # run is the one worth keeping, because it tests the merge commit and
    # is the only run a fork's pull request produces at all.
    # master keeps a trigger of its own because a merge creates a commit
    # that is not the one the pull request tested, and nothing else would
    # ever test it. Tag pushes are covered by the release workflow
    branches: [master]
    # GitHub Pages serves btclib.org from master's root, so a
    # website-only commit lands here and would otherwise run the whole
    # matrix.
    # None of these files is imported by the library or read by a test --
    # README.md is the homepage, not a doctest source; CONTRIBUTING.md is
    # checked by markdownlint, which is the lint workflow's business.
    # Only on push: the same list on pull_request would be wrong, because
    # tests-passed is a required check on master and a required check that
    # produces no run at all blocks the merge instead of passing it
    paths-ignore:
      - _config.yml
      - _layouts/**
      - assets/**
      - CNAME
      - Gemfile
      - "*.md"
  pull_request:
    # ready_for_review, so a pull request marked ready gets the run the
    # draft condition below withheld while it was a draft: the default
    # types do not include it, and without it a readied pull request
    # would wait for its next push to be checked at all
    types: [opened, reopened, synchronize, ready_for_review]
  # allows the release workflow to reuse the whole build/test pipeline
  workflow_call:
  # the escape hatch: the matrix on demand for a branch whose pull
  # request is not open yet
  workflow_dispatch:

# least privilege for the GITHUB_TOKEN: everything running in a job
# (actions, dependencies, build scripts) can read the token, so it must
# not be able to write to the repository
permissions:
  contents: read

# cancel superseded runs on the same branch/PR.
# The group is named literally rather than with github.workflow, which in
# a called workflow is the caller's name: the release workflow calls both
# this and lint.yml, and with that expression the two would share a group
# and cancel each other
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # what the matrix buys: every (os, architecture, interpreter) triple
  # selects a different published wheel of btclib_libsecp256k1, each with
  # its own compiled libsecp256k1 inside, and the pure Python code meets a
  # distinct hashlib and OpenSSL.
  # windows-11-arm needs no special handling, and that is worth a word:
  # which architecture the interpreter targets there is up to the runner
  # image, native arm64 for the versions it caches and emulated x86-64
  # for the ones uv has to download, and the wheel is selected for the
  # interpreter rather than for the host, so either one links
  test-py:
    # a draft pull request is work in progress: every push to one spends
    # the whole matrix on a tree its author is not asking anyone to
    # review yet. The gate below carries the same condition, so a draft
    # skips uniformly and the gate does not read that skip as a job that
    # should have run.
    # The exception is by base branch, and it is the release pull
    # request: dev -> master stays a draft from one release to the
    # next, and nothing here triggers on a push to dev, so without it
    # a commit merged into dev would be tested by nothing at all
    if: >-
      ${{ !github.event.pull_request.draft
      || github.base_ref == 'master' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-26-intel
          - macos-latest
          - windows-latest
          - windows-11-arm
        # 3.14t is the free-threaded interpreter, and it is in the matrix
        # for what it installs as much as for what it runs: the bindings
        # ship a py3-none dynamic wheel for it, and nothing else here
        # exercises a build without the GIL. python-build-standalone has a
        # freethreaded build for all six platforms below, so it needs no
        # exclusion.
        # no pypy3.10, and PyPy is still tested: hypothesis ships
        # compiled wheels from 6.160 on and publishes none for pypy3.10, so
        # uv falls back to its sdist, whose maturin build needs a PyO3 that
        # requires PyPy 3.11 or newer. Pinning hypothesis below 6.160
        # behind an implementation marker buys a suite generating its
        # inputs with a version nobody else runs, on the older of the two
        # PyPy releases; pypy3.11 covers the implementation
        python:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.14t"
          - "pypy3.11"
    # far above what a run of the suite needs: what it bounds is a hung
    # job holding a runner for six hours
    timeout-minutes: 30
    steps:
      # every action is pinned to a commit SHA, the tag in the comment: a
      # tag, let alone a branch, is a name its owner can move, and these
      # run in a job that can read the workflow token
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # checkout leaves the token in .git/config by default, where
          # anything running afterwards can read it and any step archiving
          # the workspace would carry it out of the job. No job in any of
          # these workflows performs an authenticated git operation -- the
          # release is created by gh, from GH_TOKEN in its environment --
          # so nothing needs it to stay
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # the cache holds the wheels uv.lock resolves, this matrix
          # fetching the same ones on every run of every commit
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: Run pytest
        run: uv run --locked --no-default-groups --group test pytest

  # coverage is measured once, not once per matrix job: the code base has
  # no platform- or version-conditional branch (no sys.platform, no
  # sys.version_info) and no conditional skip, so every job walks the very
  # same lines. The one fallback, btclib.__version__ when no metadata is
  # installed, is not conditional on the job: every one of them installs
  # the package, and a test reaches the other branch by making the lookup
  # raise, which is why it needs no "pragma: no cover" either. Per-job
  # measurement would buy only the instrumentation overhead, one
  # coveralls.io upload per job, and the parallel/--finish handshake to
  # stitch the uploads back together.
  # The number is a gate rather than a report: fail_under, in
  # tool.coverage.report, fails this job on a regression. It needs no
  # secret and no third party, and it applies to every run, where a
  # coveralls.io upload happens only on pull requests targeting master
  coverage-py:
    if: >-
      ${{ !github.event.pull_request.draft
      || github.base_ref == 'master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          # 3.14, i.e. what .python-version pins and what a bare `uv run`
          # gives a maintainer locally: the number this job gates on is a
          # ratio of statements, and the statement count moves between
          # interpreters, so a threshold checked on one version is not the
          # one another measures. Pinned rather than inherited from
          # .python-version even so, because the coupling belongs where
          # the gate runs:
          # the fail_under comment in pyproject.toml names this version,
          # and the two have to move together
          python-version: "3.14"
      # `--cov` and nothing after it: what is measured is tool.coverage.run's
      # source and how it is reported is tool.coverage.report, so naming
      # either here would be a second copy of a list that already exists --
      # and the copy a contributor cannot run, this file not being what
      # anyone types locally. One command, one scope, one report
      - name: Run pytest under coverage
        run: >
          uv run --locked --no-default-groups --group test
          pytest --cov

  # the packaging metadata is checked on every pull request, not only on
  # the tag that ships it: a release is the one place where finding a
  # problem is too late, a version being consumed by the upload that
  # carries it, and then only yankable. The release workflow calls this
  # one, so it runs these checks too, and its build job builds only what
  # it publishes.
  # Installing the wheel is the last of them (issue #131), and it is a
  # gate here rather than in the release workflow alone because the
  # bindings it resolves are published: while they were not, the step
  # could only be red, for a reason nobody could fix from a branch
  dist-py:
    if: >-
      ${{ !github.event.pull_request.draft
      || github.base_ref == 'master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      # uv build builds the sdist first and then the wheel from it, not
      # both from the source tree, so what is checked below is what a user
      # installing from source would get. That the sdist is complete in the
      # first place is check-manifest's job, a pre-commit hook, gated by
      # the lint workflow
      - name: Build the distribution files
        run: uv build
      # the same validation PyPI applies on upload: broken metadata, or a
      # README that does not render, cannot be fixed by reuploading
      - name: Check the metadata and the long description
        run: uv run --locked --only-group build twine check --strict dist/*
      # what twine does not look at: where the files land once installed,
      # a test package shipped by accident, a stray top-level module
      - name: Check the wheel contents
        run: uv run --locked --only-group build check-wheel-contents dist/*.whl
      # and what twine cannot see either: metadata that is valid but poor,
      # a missing classifier or url, a version PyPI would sort in a way
      # nobody meant. The pyroma pre-commit hook rates the source tree, for
      # an answer before pushing; this rates the sdist, i.e. the metadata
      # that would actually be shipped. --min 10 is a ratchet, the score
      # being 10 today
      - name: Rate the packaging metadata
        run: uv run --locked --only-group build pyroma --min 10 dist/*.tar.gz
      # what none of the three above does: install the wheel, and install
      # it alone, from an empty directory. The wheel is the only thing
      # asked for, so what pulls btclib_libsecp256k1 in is the
      # `Requires-Dist` the wheel itself carries, resolved from the index
      # -- which is the question, metadata being what the three checks
      # above only read.
      # The lock arrives as constraints and not as requirements: a
      # requirements file installs the bindings whether or not the wheel
      # asks for them, so a wheel declaring nothing would pass. A
      # constraint binds a version and requests no package, which leaves
      # the wheel's metadata doing the work while pinning the outcome to
      # what uv.lock resolved -- and pinning it is what keeps a required
      # check deterministic, since with `>=0.7.1` alone uv takes the
      # newest release and a btclib_libsecp256k1 published this morning
      # would redden every open pull request, none of which caused it.
      # Whether the newest bindings still work is asked on a schedule by
      # latest.yml, and again by the release workflow before it publishes.
      # The assertions are three, because each catches what the others
      # miss: the version is asserted and not merely printed, since
      # btclib.__version__ falls back to "unknown" with no metadata
      # installed (issue #150), so a wheel shipping none would print that
      # and pass; `btclib.ecc.dsa` is imported because `import btclib`
      # runs only __init__.py, which reads that metadata and touches no
      # binding, so the bindings could be missing entirely; and a
      # signature is verified because an installable release of them with
      # an incompatible API imports fine and answers wrongly
      - name: Smoke-test the wheel, with its dependencies from PyPI
        run: |
          uv export --locked --no-dev --no-emit-project --no-hashes \
            -o "$RUNNER_TEMP"/constraints.txt
          cd "$RUNNER_TEMP"
          uv venv
          uv pip install --constraints constraints.txt \
            "$GITHUB_WORKSPACE"/dist/*.whl
          .venv/bin/python -c "import btclib; \
            from btclib.ecc import dsa; \
            from btclib.to_pub_key import pub_keyinfo_from_prv_key; \
            print(btclib.__version__); \
            assert btclib.__version__ != 'unknown'; \
            assert dsa.verify(b'btclib', pub_keyinfo_from_prv_key(1)[0], \
              dsa.sign(b'btclib', 1))"

  # the single check master's branch protection requires from this
  # workflow, and it exists because that rule names its checks as literal
  # strings, stored outside the repository. The matrix above produces one
  # per (runner label, interpreter) pair, 42 of them today -- a count that
  # moves whenever the matrix does: naming those directly means every
  # matrix edit has to be mirrored in a setting no pull request can
  # review, and a name that stops being produced -- macos-latest moving
  # on, 3.10 aging out in its turn -- becomes a required check that never
  # reports, which blocks every merge until someone remembers where the
  # rule lives.
  # This job depends on the others instead, so the rule names one thing
  # that never changes and adding a job here is enough to gate on it
  tests-passed:
    needs: [test-py, coverage-py, dist-py]
    # not success(): a job whose dependencies failed is skipped, and a
    # skipped check reports "skipped", which branch protection counts as
    # satisfied. The gate has to run to be able to fail
    # and the draft condition every job above carries, so a draft
    # skips uniformly rather than tripping the skip check below
    if: >-
      ${{ always() && (!github.event.pull_request.draft
      || github.base_ref == 'master') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # the condition reads the whole needs context rather than testing
      # each job by name, so a job added to needs above is covered
      # without touching this. "skipped" is a failure here too: nothing
      # in this workflow is conditional, so a skip means something
      # upstream did not run
      - name: Fail unless every job above succeeded
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: |
          echo "::error::a job this gate depends on did not succeed"
          exit 1
