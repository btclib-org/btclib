name: test

on:
  push:
    # master only: a push to a branch that has an open pull request would
    # run this workflow twice, once per event, and the two runs land in
    # different concurrency groups (refs/heads/dev against
    # refs/pull/N/merge) so neither cancels the other. The pull_request
    # run is the one worth keeping, because it tests the merge commit and
    # is the only run a fork's pull request produces at all.
    # master keeps a trigger of its own because a merge creates a commit
    # that is not the one the pull request tested, and nothing else would
    # ever test it. Tag pushes are covered by the release workflow
    branches: [master]
  pull_request:
  # allows the release workflow to reuse the whole build/test pipeline
  workflow_call:
  # the escape hatch: the matrix on demand for a branch whose pull
  # request is not open yet
  workflow_dispatch:

# cancel superseded runs on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # what the matrix buys: btclib_libsecp256k1 is built from source (see
  # tool.uv.sources), so every (os, architecture, interpreter) triple is a
  # distinct C toolchain, and the pure python code meets a distinct
  # hashlib and OpenSSL. windows-11-arm is a job of its own, below
  test-py:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          [
            ubuntu-latest,
            ubuntu-24.04-arm,
            macos-26-intel,
            macos-latest,
            windows-latest,
          ]
        python:
          ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "pypy3.10", "pypy3.11"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          # the bindings are built from source: the cache keeps that to
          # once per commit of the bindings
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: Run pytest
        run: uv run --frozen --no-default-groups --group test pytest

  # windows on arm64 cannot join the matrix above, on two counts.
  # A bare "3.13" request gets an emulated x86-64 interpreter, because uv
  # still considers the native aarch64 distribution immature; cmake then
  # builds libsecp256k1 with the native arm64 cl.exe, and linking the
  # arm64 static library into an x86-64 extension leaves every secp256k1
  # symbol unresolved (LNK2001). Asking for the native interpreter
  # explicitly makes both sides arm64, and the suite passes.
  # That interpreter only exists from 3.11 on, and not at all for pypy
  test-py-windows-arm64:
    runs-on: windows-11-arm
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: cpython-${{ matrix.python }}-windows-aarch64
      - name: Run pytest
        run: uv run --frozen --no-default-groups --group test pytest

  # coverage is measured once, not once per matrix job: the code base has
  # no platform- or version-conditional branch (no sys.platform, no
  # sys.version_info, no import fallback that is not "pragma: no cover")
  # and no conditional skip, so every job walks the very same lines. The
  # per-job measurement only bought the instrumentation overhead, one
  # coveralls.io upload per job, and the parallel/--finish handshake that
  # stitched the uploads back together.
  # The number is now a gate rather than a report: fail_under, in
  # tool.coverage.report, fails this job on a regression. It needs no
  # secret and no third party, and it applies to every run, where the
  # upload only ever happened on pull requests targeting master
  coverage-py:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Run pytest under coverage
        run: >
          uv run --frozen --no-default-groups --group test
          pytest --cov-report term-missing:skip-covered --cov=btclib --cov=tests
