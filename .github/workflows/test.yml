---
name: test

on:
  push:
    # main only: a push to a branch that has an open pull request would
    # run this workflow twice, once per event, and the two runs land in
    # different concurrency groups (refs/heads/<branch> against
    # refs/pull/N/merge) so neither cancels the other. The pull_request
    # run is the one worth keeping, because it tests the merge commit and
    # is the only run a fork's pull request produces at all.
    # main keeps a trigger of its own because a merge creates a commit
    # that is not the one the pull request tested, and nothing else would
    # ever test it -- and because a cache is readable only from the branch
    # that wrote it and from the default branch, so without a run here
    # every pull request starts cold. Tag pushes are covered by the release
    # workflow
    branches: [main]
    # GitHub Pages serves btclib.org from main's root, so a
    # website-only commit lands here and would otherwise run the whole
    # matrix.
    # None of these files is imported by the library or read by a test --
    # README.md is the homepage, not a doctest source; CONTRIBUTING.md is
    # checked by markdownlint, which is the lint workflow's business.
    # Only on push: the same list on pull_request would be wrong, because
    # the aggregate below is a required check on main, and a required check
    # that produces no run at all blocks the merge instead of passing it
    paths-ignore:
      - _config.yml
      - _layouts/**
      - assets/**
      - CNAME
      - Gemfile
      - "*.md"
  pull_request:
    # ready_for_review, so a pull request marked ready gets the run the
    # draft condition below withheld while it was a draft: the default
    # types do not include it, and without it a readied pull request
    # would wait for its next push to be checked at all.
    # closed too, though every job below declines the real work on it: a
    # merge or a close is neither a push nor a synchronize, so a run this
    # PR's own concurrency group is still holding survives either unless
    # the closed event lands in that same group -- which this type is
    # what makes it do, cancel-in-progress above turning the landing
    # into the cancellation. A closed pull request has nothing left to
    # ask this workflow, the merge commit being main's own push
    # trigger's question. The group below keys on the pull request's own
    # number rather than plain github.ref for exactly this event: a
    # merged pull request's closed event sets github.ref to the base
    # branch, not the merge ref, which used to land it in main's own
    # push group and race the merge commit's run for cancellation
    # (PR 1023's bug) instead of the PR's own group as intended
    types: [opened, reopened, synchronize, ready_for_review, closed]
  # allows the release workflow to reuse the whole build/test pipeline
  workflow_call:
    inputs:
      concurrency-suffix:
        description: >
          Appended to the concurrency group, and the release workflow is
          the only caller that passes one. See the group below.
        type: string
        default: ""
  # the escape hatch: the matrix on demand for a branch whose pull
  # request is not open yet
  workflow_dispatch:

# least privilege for the GITHUB_TOKEN: everything running in a job
# (actions, dependencies, build scripts) can read the token, so it must
# not be able to write to the repository
permissions:
  contents: read

# cancel superseded runs on the same branch/PR.
# The group is named literally rather than with github.workflow, which in
# a called workflow is the caller's name: the release workflow calls both
# this and lint.yml, and with that expression the two would share a group
# and cancel each other.
# github.ref has the same shape of problem one level down, and it is why
# the suffix is there. Inside a called workflow that context is the
# caller's ref, so a rehearsal -- a workflow_dispatch of release.yml on a
# branch, which is what RELEASING.md prescribes -- computes
# test-refs/heads/<branch>, the very group a push to that branch or a
# direct dispatch of this workflow computes. One then kills the other:
# either the rehearsal dies mid-build, or it cancels the run of the push.
# A tag run is unaffected, refs/tags/v* being a ref nothing else uses.
# release.yml passes a suffix of its own, which keeps the release path
# out of the branch groups while still letting a second rehearsal of the
# same branch supersede the first.
# github.event.pull_request.number, not github.ref alone, is a third
# problem with the same shape: for a closed, merged pull request's run,
# github.ref resolves to the base branch's ref rather than
# refs/pull/N/merge, colliding with the push trigger's own group --
# PR 1023's bug, recorded in the pull_request trigger's own comment
# above. A pull_request run of any action, closed included, now groups
# by the pull request's own number instead, which a push never carries
# and so still groups by github.ref, unchanged
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}${{ inputs.concurrency-suffix }}
  cancel-in-progress: true

jobs:
  # the cheapest job in the workflow, and the one that decides whether the
  # rest of it runs at all: a pull request that edits only prose changes
  # nothing the five jobs below build or test, and running the whole
  # matrix to prove it was the cost. Each of `suite`, `coverage`,
  # `no-bindings` and `dist` takes this job as a `needs` and reads its
  # output in its own `if`; `coverage-union` does too, rather than
  # relying on `coverage` and `no-bindings` skipping under it, because a
  # job's own `if` here replaces the implicit "needs succeeded" check
  # rather than adding to it, and its two `needs` would otherwise be
  # skipped, not failed, leaving it to try downloading artifacts neither
  # produced
  #
  # Three things this must not get wrong:
  #
  # - it runs on every trigger, and answers `true` on all but
  #   `pull_request`: a push to main, the release workflow's call, and a
  #   manual dispatch have no base to diff against, and a `changes` that
  #   skipped itself there would leave every dependent reading an empty
  #   output, not 'true', and the whole workflow -- the release path
  #   included -- would skip
  # - README.md is not prose for this purpose: pyproject.toml reads it as
  #   the package's long description, which the `dist` job's twine and
  #   pyroma checks actually render and rate. Nor is anything under
  #   docs/, which the sdist carries (MANIFEST.in) and which
  #   tests/docs_test.py and tests/docs_examples_test.py read directly.
  #   Nor are CHANGELOG.md or RELEASE_NOTES.md: tests/release_notes_test.py
  #   parses and validates their format, in the very suite this job would
  #   otherwise skip
  # - test-passed takes this job as a `needs` too, so a failure here
  #   fails the gate instead of skipping every job below and being read
  #   as a pass. So does every job that reads its output, `coverage-union`
  #   included, for the same reason: `needs.changes.outputs.code` is
  #   undefined in an expression unless the job is named in its own
  #   `needs`
  changes:
    name: Decide whether the matrix has anything to check
    if: ${{ !github.event.pull_request.draft && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # the file list of a pull request, which contents: read does not carry
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.decide.outputs.code }}

    steps:
      - name: Ask which files the pull request touches
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # a push to main, a release call and a dispatch build
          # everything: only a pull request has a base to be a diff
          # against
          if [ "$EVENT" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "$EVENT is not a pull request: everything runs"
            exit 0
          fi
          gh api "repos/$REPO/pulls/$NUMBER/files" --paginate \
            --jq '.[].filename' > files.txt
          echo "files changed:"
          cat files.txt
          # the allowlist is what nothing built or tested reads: the
          # prose files of the root and of .github, none of README.md,
          # CHANGELOG.md or RELEASE_NOTES.md among them. An empty list is not
          # a documentation change, it is a question this could not
          # answer, so the count is checked before the pattern
          prose='^(AUTHORS|CLAUDE|CODE_OF_CONDUCT|CONTRIBUTING|RELEASING|REPOSITORY|REVIEWING|SECURITY)\.md$|^\.github/[^/]*\.md$'
          if [ ! -s files.txt ] || grep -qvE "$prose" files.txt; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "something the matrix reads changed: everything runs"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "prose only: the matrix has nothing to check"
          fi

  # what the matrix buys: every (os, architecture, interpreter) triple
  # selects a different published wheel of btclib_secp256k1, each with
  # its own compiled libsecp256k1 inside, and the pure Python code meets a
  # distinct hashlib and OpenSSL
  suite:
    name: Run the suite on ${{ matrix.python }}, ${{ matrix.os }}
    # a draft pull request is work in progress: every push to one spends
    # the whole matrix on a tree its author is not asking anyone to
    # review yet. The gate below carries the same condition, so a draft
    # skips uniformly and the gate does not read that skip as a job that
    # should have run.
    # A closed pull request spends none either: the trigger above takes
    # the closed event only to supersede a run this ref's group is still
    # holding, and every job here carries the same skip for the reason
    # the draft one already does
    if: >-
      ${{ !github.event.pull_request.draft
          && github.event.action != 'closed'
          && needs.changes.outputs.code == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # two, and macos.yml and windows.yml carry the other four, each with
        # its measurement in its own header: what a platform row costs a
        # pull request is the wait for a runner, and what it buys is a
        # standard library under code this library writes no
        # platform-conditional branch in. The two cheapest and fastest rows
        # stay, because something has to run the suite before a merge; the
        # rest answer weekly and before a release
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
        # 3.14t is the free-threaded interpreter, and it is in the matrix
        # for what it installs as much as for what it runs: the bindings
        # ship a py3-none dynamic wheel for it, and nothing else here
        # exercises a build without the GIL. python-build-standalone has a
        # freethreaded build for every platform this repository runs, the
        # two here and the four of macos.yml and windows.yml, so it needs no
        # exclusion of its own.
        # no pypy3.10, and PyPy is still tested: hypothesis ships
        # compiled wheels from 6.160 on and publishes none for pypy3.10, so
        # uv falls back to its sdist, whose maturin build needs a PyO3 that
        # requires PyPy 3.11 or newer. Pinning hypothesis below 6.160
        # behind an implementation marker buys a suite generating its
        # inputs with a version nobody else runs, on the older of the two
        # PyPy releases; pypy3.11 covers the implementation
        python:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.14t"
          - "pypy3.11"
        # the one cell the coverage job below already is: same runner image,
        # same interpreter, the same suite, and the only difference is the
        # instrumentation. Running both asks one question twice and holds two
        # of the twenty concurrent jobs GitHub Free gives an organization,
        # which is what a pull request's wall clock is made of here. Nothing
        # else in the matrix is excluded: that job is pinned to this pair,
        # for the reason its own comment gives, so this is the only overlap
        # there can be
        exclude:
          - os: ubuntu-latest
            python: "3.14"
    # far above what a run of the suite needs: what it bounds is a hung
    # job holding a runner for six hours
    timeout-minutes: 30
    needs: changes
    steps:
      # every action is pinned to a commit SHA, the tag in the comment: a
      # tag, let alone a branch, is a name its owner can move, and these
      # run in a job that can read the workflow token
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # checkout leaves the token in .git/config by default, where
          # anything running afterwards can read it and any step archiving
          # the workspace would carry it out of the job. No job in any of
          # these workflows performs an authenticated git operation -- the
          # release is created by gh, from GH_TOKEN in its environment --
          # so nothing needs it to stay
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # the cache holds the wheels uv.lock resolves, this matrix
          # fetching the same ones on every run of every commit
          enable-cache: true
          python-version: ${{ matrix.python }}
      # --no-cov, against the --cov that pyproject.toml's addopts carries:
      # what this matrix asks is whether every (os, architecture,
      # interpreter) triple passes, and the job below is where coverage is
      # measured and gated. Instrumenting these cells measures the same
      # lines over again -- that job's comment is why they are the same
      # lines -- and on the PyPy cells it costs enough wall clock to reach
      # the timeout above with every test passed, coverage.py collecting
      # there through a trace hook the JIT cannot compile through. It also
      # keeps `fail_under` where pyproject.toml's comment argues it
      # belongs, on the one interpreter the statement count was checked
      # against, rather than enforced on every cell of the matrix
      - name: Run pytest
        run: uv run --locked --no-default-groups --group test pytest --no-cov

  # coverage is measured once, not once per matrix job: the code base has
  # no platform- or version-conditional branch (no sys.platform, no
  # sys.version_info) and no conditional skip, so every job walks the very
  # same lines. The one fallback, btclib.__version__ when no metadata is
  # installed, is not conditional on the job: every one of them installs
  # the package, and a test reaches the other branch by making the lookup
  # raise, which is why it needs no "pragma: no cover" either. Per-job
  # measurement would buy only the instrumentation overhead, one
  # coveralls.io upload per job, and the parallel/--finish handshake to
  # stitch the uploads back together.
  # The number is a gate rather than a report: fail_under, in
  # tool.coverage.report, fails this job on a regression. It needs no
  # secret and no third party, and it applies to every run, where a
  # coveralls.io upload happens only on a pull request.
  # It is also the (3.14, ubuntu-latest) cell of the matrix above, which is
  # why that pair is excluded there: a suite that passes is what this job
  # reports before it reads a number, so the pair needs no job of its own
  coverage:
    name: Measure coverage, gated at 100%
    if: >-
      ${{ !github.event.pull_request.draft
          && github.event.action != 'closed'
          && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          # 3.14, i.e. what .python-version pins and what a bare `uv run`
          # gives a maintainer locally: the number this job gates on is a
          # ratio of statements, and the statement count moves between
          # interpreters, so a threshold checked on one version is not the
          # one another measures. Pinned rather than inherited from
          # .python-version even so, because the coupling belongs where
          # the gate runs:
          # the fail_under comment in pyproject.toml names this version,
          # and the two have to move together
          python-version: "3.14"
      # `--cov` and nothing after it: what is measured is tool.coverage.run's
      # source and how it is reported is tool.coverage.report, so naming
      # either here would be a second copy of a list that already exists --
      # and the copy a contributor cannot run, this file not being what
      # anyone types locally. One command, one scope, one report
      - name: Run pytest under coverage
        run: >
          uv run --locked --no-default-groups --group test
          pytest --cov
        env:
          # not the default `.coverage`: the `coverage-union` job downloads
          # this artifact beside the `no-bindings` job's, and two files
          # named alike would overwrite each other on the runner that
          # combines them. `COVERAGE_FILE` is `--data-file`'s environment
          # variable, coverage's own, so `pytest --cov` writes here without
          # a second flag naming what the report step above already reads
          # from tool.coverage.run
          COVERAGE_FILE: coverage-data-bindings
      # issue #1002: this run already fails at 100% on its own, unchanged
      # above, and this is the second, weaker thing the same data buys --
      # the union `coverage-union` gates below. Uploaded rather than kept
      # only as the percentage this job already reported, because a
      # percentage cannot be combined with another job's and a line
      # reachable only from the `no-bindings` run is invisible to it
      - name: Upload coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-data-bindings
          path: coverage-data-bindings
          # a coverage data file with nothing collected would mean this
          # job did not run pytest at all, which the run above failing
          # already reports -- the default here would hide that
          if-no-files-found: error

  # the configuration issue #966 exists for, and the one thing that keeps
  # its guard from being a claim nobody checks: btclib installed without
  # btclib_secp256k1, answering on its own Python arithmetic. The suite
  # reaches those arms locally by clearing the seam, which is not the same
  # configuration -- an unguarded import would fail before a seam could be
  # cleared, and every arm gated on availability alone is chosen here by
  # the absence rather than by a monkeypatch.
  # `--group harness` and not `--group test`: `test` includes `bindings`,
  # and uv's `--no-group` suppresses a group that was selected, not one
  # another group includes. So the split in pyproject.toml is what this
  # job is, and there is no second lock file.
  # `--cov --cov-fail-under=0`, not `--no-cov`, since issue #1002: the
  # delegated arms are still unreachable here by construction, and a
  # report of this run *alone* would still fail the 100% gate for the one
  # reason the run exists to create -- `--cov-fail-under=0` is what keeps
  # this job from being that report, collecting the data without gating
  # this run on it. The data goes into `coverage-union` below, which
  # gates the union of this run and the `coverage` job's at 100% as well,
  # answering the question this job's own comment used to leave open: a
  # test marked `needs_bindings` too broadly, or a Python arm no test
  # here reaches, now shows up as a line neither run covers rather than
  # as nothing. What it costs is this job's wall clock, now instrumented
  # like the `coverage` job's rather than the `suite` matrix's
  # The tests that hold both implementations and compare them are marked
  # `bindings` and skip themselves; everything else runs, which is what
  # makes this a suite and not a smoke test
  no-bindings:
    name: Run the suite with no bindings installed
    if: >-
      ${{ !github.event.pull_request.draft
          && github.event.action != 'closed'
          && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.14"
      # asked before the suite, and asked of the interpreter rather than
      # of the resolver: a job that silently kept the bindings would pass
      # every test below while checking nothing, which is exactly the
      # failure this job exists to make impossible
      - name: Assert the bindings are absent
        run: >
          uv run --locked --no-default-groups --group harness
          python -c "from btclib._libsecp256k1 import INSTALLED;
          assert not INSTALLED, 'btclib_secp256k1 is installed';
          from btclib.curves import is_libsecp256k1_serving;
          assert not is_libsecp256k1_serving()"
      - name: Run pytest
        run: >
          uv run --locked --no-default-groups --group harness
          pytest --cov --cov-fail-under=0
        env:
          # the `coverage` job's comment on its own `COVERAGE_FILE` is why
          # this is not `.coverage` either: the two artifacts land beside
          # each other in `coverage-union` below
          COVERAGE_FILE: coverage-data-no-bindings
      - name: Upload coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-data-no-bindings
          path: coverage-data-no-bindings
          if-no-files-found: error

  # the union `coverage` and `no-bindings` together answer for, and the
  # gate is added to what `coverage` already is rather than instead of
  # it. A line reachable only from this job's run is a line the delegated
  # configuration -- the one an ordinary `pip install btclib[secp256k1]`
  # gets -- never executes, and the `coverage` job's own 100% already
  # says so by going red. Combining the two runs into one report and
  # gating only that report would let such a line pass in silence, which
  # is not the question issue #1002 asks: the question is what line no
  # test anywhere reaches, not which configuration reaches which.
  # This is why no `# pragma: no cover` in the tree became removable the
  # day this job was added, despite what #995 and #1002 both hoped:
  # `btclib/_libsecp256k1.py`'s `except ImportError:` and
  # `tests/conftest.py`'s `_skip_what_needs_the_bindings` are reached by
  # this job's own run and would make the union 100% without their
  # pragma, and are unreachable in the `coverage` job's single run by
  # construction all the same -- so removing either pragma fails that
  # job's own gate, which stands exactly as it did before this job
  # existed. What this job protects instead is every line beside those:
  # new dead code in either configuration, or a `needs_bindings` marker
  # drawn wider than it should be, now shows up as a line neither run
  # covers rather than as nothing.
  # What it costs: a third job, an artifact round trip in each direction,
  # and coverage.py's own combine step, which is the same trade the
  # `coverage` job already made against the `suite` matrix, applied once
  # more
  coverage-union:
    name: Combine coverage from both runs, gated at 100% too
    # needs.changes.outputs.code, not reliance on coverage/no-bindings
    # skipping under it: a job's own `if` here replaces the implicit
    # "needs succeeded" check, so without this a prose-only pull request
    # would still run this job -- straight into two "Download coverage
    # data" steps with nothing uploaded to download
    if: >-
      ${{ !github.event.pull_request.draft
          && github.event.action != 'closed'
          && needs.changes.outputs.code == 'true' }}
    needs: [changes, coverage, no-bindings]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # the source files coverage.py reports against: a data file alone
      # names lines by path and number, not by content
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Download coverage data from the coverage job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-data-bindings
      - name: Download coverage data from the no-bindings job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-data-no-bindings
      # `--group harness` and not `--group test`: combining and reporting
      # read coverage.py's own data files and the source tree checked out
      # above, neither of which needs btclib importable, let alone the
      # bindings
      - name: Combine the two runs
        run: >
          uv run --locked --no-default-groups --group harness
          coverage combine coverage-data-bindings coverage-data-no-bindings
      # `fail_under` in pyproject.toml is what the `coverage` job's report
      # already reads; asked for explicitly here too, since this report is
      # of the combined file the block comment above argues for gating
      # rather than of the one `tool.coverage.run`'s default location
      # would have produced
      - name: Report the union, gated at 100%
        run: >
          uv run --locked --no-default-groups --group harness
          coverage report --fail-under=100

  # the packaging metadata is checked on every pull request, not only on
  # the tag that ships it: a release is the one place where finding a
  # problem is too late, a version being consumed by the upload that
  # carries it, and then only yankable. The release workflow calls this
  # one, so it runs these checks too, here on the files this job's own
  # `uv build` produces. Its `build` job builds a second, separate copy
  # -- the one it actually publishes -- and runs the same three checks on
  # that copy as well (issue #1154), because passing here said nothing
  # about files this job never saw.
  # Installing the wheel is the last of them (issue #131), and it is a
  # gate here rather than in the release workflow alone because the
  # bindings it resolves are published: while they were not, the step
  # could only be red, for a reason nobody could fix from a branch
  dist:
    name: Build the distribution and install it
    if: >-
      ${{ !github.event.pull_request.draft
          && github.event.action != 'closed'
          && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      # uv build builds the sdist first and then the wheel from it, not
      # both from the source tree, so what is checked below is what a user
      # installing from source would get. That the sdist is complete in the
      # first place is check-manifest's job, a pre-commit hook, gated by
      # the lint workflow
      - name: Build the distribution files
        run: uv build
      # what the three checks below do not look at: the members of the two
      # archives, which is what a user installs. The allowlist and the
      # reasoning are in the script; release.yml's build job runs the same
      # command on the files it is about to publish, and this is the copy
      # that answers before a tag rather than after one.
      # --no-project, so it runs on the interpreter uv already fetched and
      # installs nothing: the script imports the standard library only
      - name: Check what the distribution files contain
        run: |
          uv run --no-project --python 3.14 \
            .github/scripts/verify_dist_contents.py dist/
      # and the bill of materials release.yml attaches to a release. Written
      # here and thrown away, into $RUNNER_TEMP rather than the workspace:
      # what this gates is that the script still reads a real wheel, which
      # otherwise nothing would say until a tag ran it for the first time
      - name: Write the bill of materials
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct) \
            uv run --no-project --python 3.14 \
            .github/scripts/generate_sbom.py dist/ "$RUNNER_TEMP"/sbom/
      # the same validation PyPI applies on upload: broken metadata, or a
      # README that does not render, cannot be fixed by reuploading
      - name: Check the metadata and the long description
        run: uv run --locked --only-group check twine check --strict dist/*
      # what twine does not look at: where the files land once installed,
      # a test package shipped by accident, a stray top-level module
      - name: Check the wheel contents
        run: uv run --locked --only-group check check-wheel-contents dist/*.whl
      # and what twine cannot see either: metadata that is valid but poor,
      # a missing classifier or url, a version PyPI would sort in a way
      # nobody meant. The pyroma pre-commit hook rates the source tree, for
      # an answer before pushing; this rates the sdist, i.e. the metadata
      # that would actually be shipped. --min 10 is a ratchet, the score
      # being 10 today
      - name: Rate the packaging metadata
        run: uv run --locked --only-group check pyroma --min 10 dist/*.tar.gz
      # what none of the three above does: install the wheel, and install
      # it alone, from an empty directory. The wheel is the only thing
      # asked for, so what pulls btclib_secp256k1 in is the
      # `Requires-Dist` the wheel itself carries, resolved from the index
      # -- which is the question, metadata being what the three checks
      # above only read.
      # The extra is named on both sides for that reason: the bindings
      # are `Requires-Dist ... ; extra == "secp256k1"` now, so a wheel
      # installed without it declares nothing to resolve and the question
      # goes unasked. `--extra secp256k1` on the export is what puts the
      # bindings in the constraints, at the version uv.lock resolved: a
      # version and not a git commit, pyproject.toml carrying no source
      # table, which is what makes the bindings this step installs the
      # published ones its own name claims (issue #1116)
      # The lock arrives as constraints and not as requirements: a
      # requirements file installs the bindings whether or not the wheel
      # asks for them, so a wheel declaring nothing would pass. A
      # constraint binds a version and requests no package, which leaves
      # the wheel's metadata doing the work while pinning the outcome to
      # what uv.lock resolved -- and pinning it is what keeps a required
      # check deterministic, since with the floor alone uv takes the
      # newest release and a btclib_secp256k1 published this morning
      # would redden every open pull request, none of which caused it.
      # Every package, then, including the two siblings: what made them
      # an exception was the direct reference, the lock exporting the
      # commit it resolved against a wheel asking for `main`, which uv
      # refuses as conflicting once the branch has moved past it. A floor
      # resolves to a release, and a release does not move.
      # Whether the newest bindings still work is asked on a schedule by
      # latest.yml, and again by the release workflow before it publishes.
      # Each assertion catches what the others miss: the version is
      # asserted and not merely printed, since btclib.__version__ falls
      # back to "unknown" with no metadata installed (issue #150), so a
      # wheel shipping none would print that and pass; `btclib.ecc.dsa`
      # is imported because `import btclib` runs only __init__.py, which
      # reads that metadata and touches no binding, so the bindings could
      # be missing entirely; the bindings are asserted to be serving
      # because nothing else here notices when they are not; and a
      # signature is verified because an installable release of them with
      # an incompatible API imports fine and answers wrongly.
      # The serving one is issue #1117, and what it guards here is not
      # what it guards in release.yml's unconstrained copy. The
      # constraints bind a version and request no package, so the only
      # thing that installs the bindings at all is the wheel's own
      # `Requires-Dist` for the extra: a wheel that stopped declaring it
      # resolves nothing, and a btclib_secp256k1 the lock pins that this
      # tree cannot import lands in `_libsecp256k1`'s `except
      # ImportError`. Either way `is_libsecp256k1_serving` is False while
      # the Python arithmetic answers the version and the signature
      # correctly -- that arm being supported is what the `no-bindings`
      # job above exists for -- so both would pass unnoticed. Both are
      # the tree's own state and not the index's, which is what makes the
      # assertion fit for a required check: what it cannot say is whether
      # the *newest* bindings serve, which is release.yml's copy and
      # latest.yml's job.
      # `is_libsecp256k1_serving` and not `INSTALLED`: serving is
      # installed and not refused, so it implies the other, and it is the
      # public reading of the seam every dispatch consults -- the same
      # name the `no-bindings` job asserts the negative of. Asserted
      # before the signature because it is what gives that signature its
      # meaning: verified by libsecp256k1 here rather than by the Python
      # arm it would otherwise silently be
      - name: Smoke-test the wheel, with its dependencies from PyPI
        run: |
          uv export --locked --no-dev --extra secp256k1 \
            --no-emit-project --no-hashes -o "$RUNNER_TEMP"/constraints.txt
          cd "$RUNNER_TEMP"
          uv venv
          # `set --` and not `echo`, which would collapse a second wheel
          # into one space-separated word and fail about a path with a
          # space in it rather than about there being two; and not a
          # named array either, whose first element is `[0]` in bash and
          # `[1]` in zsh, where CONTRIBUTING.md's copy of this command is
          # pasted. The positional parameters are sh, bash and zsh alike,
          # so the two stay one string, and a second wheel is `$2`
          set -- "$GITHUB_WORKSPACE"/dist/*.whl
          uv pip install --constraints constraints.txt "$1[secp256k1]"
          .venv/bin/python -c "import btclib; \
            from btclib.curves import is_libsecp256k1_serving; \
            from btclib.ecc import dsa; \
            from btclib.to_pub_key import pub_keyinfo_from_prv_key; \
            print(btclib.__version__); \
            assert btclib.__version__ != 'unknown'; \
            assert is_libsecp256k1_serving(), \
              'the secp256k1 extra resolved, the bindings do not serve'; \
            assert dsa.verify(b'btclib', pub_keyinfo_from_prv_key(1)[0], \
              dsa.sign(b'btclib', 1))"

  # the single check main's branch protection requires from this
  # workflow, and it exists because that rule names its checks as literal
  # strings, stored outside the repository. The matrix above produces one
  # per (runner label, interpreter) pair -- `gh api` on a run's jobs counts
  # them, and the count moves whenever the matrix does: naming those
  # directly means every matrix edit has to be mirrored in a setting no
  # pull request can
  # review, and a name that stops being produced -- macos-latest moving
  # on, 3.10 aging out in its turn -- becomes a required check that never
  # reports, which blocks every merge until someone remembers where the
  # rule lives.
  # This job depends on the others instead, so the rule names one thing
  # that never changes and adding a job here is enough to gate on it
  test-passed:
    # the name and not the id is what branch protection matches, and it
    # carries the workflow on purpose: a context is keyed by name alone, so
    # two workflows with a job named "every job passed" would produce one
    # ambiguous check. lint and docs need no aggregate of their own while
    # they have one job each -- the job *is* the context there -- and the
    # day either grows a second one, this pattern and a change to the rule
    # are what that costs
    name: "test: every job passed"
    needs: [changes, suite, coverage, no-bindings, coverage-union, dist]
    # !cancelled(), not always(): a run superseded by the concurrency
    # group above -- the next push landing on this ref, or a re-run
    # cancelled from the UI -- cancels every job still in flight, and
    # that means "a newer run is authoritative", not "this tree is
    # unproven" (issue #1025). cancelled() answers for the run itself,
    # not for a dependency's own result -- unlike failure(), which walks
    # needs -- so this condition goes false, and the job skips instead
    # of failing, only when the run as a whole was superseded. A skipped
    # job satisfies a required check -- this job's own draft/closed
    # condition below already relies on exactly that, and has since
    # before this change; integration.yml, by contrast, deliberately
    # carries no `paths` filter, for the same reason stated in
    # REPOSITORY.md and in that workflow's own comment: a required check
    # that never runs blocks a merge, where a skipped one satisfies it,
    # and a filter would make it never run rather than skip. A run that
    # was not cancelled still reaches the step below even when a
    # dependency failed, or was individually cancelled (a matrix cell
    # hitting its own timeout-minutes, say), because cancelled() does not
    # go true for that.
    # and the draft condition every job above carries, so a draft
    # skips uniformly rather than tripping the check below -- the
    # closed one for the same reason, added at the trigger above
    if: ${{ !cancelled() && !github.event.pull_request.draft && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # unconditional -- no `if:` of its own -- and deciding in the
      # shell rather than in a boolean `contains(needs.*.result, ...)`
      # expression: issue #1001 saw four `suite` cells die in "Set up
      # job" on an action download's HTTP 429, the run's own conclusion
      # was `failure`, and yet `needs.suite.result` was not `'failure'`
      # when the old expression checked it -- so that `if:`-gated step
      # was skipped, and a skipped step leaves the job green by
      # construction, the same shape the job-level condition used to
      # have. Looping over every result here instead means the step
      # always runs and the log always carries what `needs` actually
      # held, whether or not that matches a run's own conclusion; and it
      # is what makes a job added to `needs` above covered without
      # touching this loop, the same as the expression it replaces.
      # `skipped` is an allowed result now, not just `success`: `changes`
      # makes `suite`, `coverage`, `no-bindings`, `dist` and
      # `coverage-union` conditional on its own output, so a prose-only
      # pull request means every one of them reports `skipped` on
      # purpose. `changes` itself is not conditional, and a job that
      # fails outright still reports `failure`, never `skipped` -- an
      # allowlist rather than a denylist of the two, since an
      # unanticipated result (empty string included, issue #1001's own
      # failure mode) is exactly what this step exists to catch
      - name: Fail unless every job above succeeded or was legitimately skipped
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "results: $results"
          for result in $results; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "::error::a job this gate depends on reported $result"
                exit 1
                ;;
            esac
          done
