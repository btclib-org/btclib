name: test-pydev

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev

jobs:
  test-pydev:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # as of 2023-07-01 windows-latest does crash
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          # the interpreter is downloaded by uv, no matter how new it is
          python-version: "3.15"
      - name: Run pytest
        # --upgrade instead of --frozen: this workflow is the canary for
        # the next python, so it must not be pinned by uv.lock
        run: uv run --upgrade --no-default-groups --group test pytest
