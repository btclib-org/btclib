---
name: sdist-rebuild

# the sentinel on what the attestation vouches for: the tag of the latest
# release, rebuilt the way RELEASING.md's *Rebuild a release from its tag*
# rebuilds it, and `gh attestation verify` over the rebuilt sdist, which
# passes only where its digest is one release.yml signed.
#
# What moves between a release and this run is the runner image, uv, and
# the build backend within the range the tag's pyproject.toml allows; that
# interval is what a weekly run covers and a check inside release.yml
# does not.
#
# The sdist alone: section 10 of btclib-org/.github's README.md makes the
# row the sdist's. A red run is an issue against this tree. It gates
# nothing, and must not appear in main's required checks

on:
  schedule:
    # The time is section 10's grid in btclib-org/.github and not this
    # file's to restate.
    # Only the default branch schedules workflows, so on any other branch
    # this is reachable through the dispatch below, and through the
    # pull_request trigger further down.
    - cron: "4 3 * * 0"
  workflow_dispatch:
  # so a change to this file is checked by the thing it configures. What
  # the job runs besides this file is the tag's own, so nothing else a
  # pull request touches changes the answer.
  # ready_for_review and closed for the reasons links.yml gives beside its
  # own trigger
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, closed]
    paths:
      - .github/workflows/sdist-rebuild.yml

permissions:
  contents: read

# grouped by branch, for the reason links.yml gives beside its own group
concurrency:
  group: sdist-rebuild-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  rebuild:
    name: Rebuild the latest release's sdist and verify its attestation
    if: >-
      ${{ !github.event.pull_request.draft
          && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # restated, a job's permissions replacing the workflow's
      contents: read
      # the attestations API, which gh attestation verify reads
      attestations: read
    steps:
      # the release GitHub marks latest, not the newest tag: a tag whose
      # release never published has no attestation to verify against
      - name: Find the latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" \
            --json tagName --jq .tagName)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Checkout the release's tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}
          persist-credentials: false
      # no cache, as test.yml's dist job when release.yml calls it: the
      # backend is fetched afresh, as it was for the release
      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
      # test.yml's dist job's steps up to the sdist it uploads, which is
      # the file release.yml attested. --sdist, the wheel being outside the
      # row: the sdist it writes is the one a bare `uv build` writes
      - name: Pin the build timestamp to the commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
      - name: Build the sdist
        run: uv build --sdist
      - name: Make the sdist's determinism this tree's own
        run: |
          uv run --no-project --python 3.14 \
            .github/scripts/normalize_sdist.py dist/
          sha256sum dist/*.tar.gz
      - name: Verify the rebuilt sdist against the release's attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify dist/*.tar.gz --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
