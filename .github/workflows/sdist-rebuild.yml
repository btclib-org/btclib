---
name: sdist-rebuild

# the sentinel on what the attestation vouches for: the tag of the
# latest release, rebuilt the way RELEASING.md's *Rebuild a release from
# its tag* rebuilds it, and `gh attestation verify` over the rebuilt
# sdist, which passes only where its digest is one release.yml signed.
# The release lookup, the checkout, the build, the normalizer and the
# verification are btclib-org/.github's own: reusable-sdist-rebuild.yml,
# called at @main so a fix there reaches this tree in one landing (issue
# btclib-org/.github#35). What stays here is the trigger, the cron
# minute, the workflow-level permissions, the concurrency group and the
# calling job's own `if:`, none of which the callee carries.
#
# The sdist alone: section 10 of btclib-org/.github's README.md makes the
# row the sdist's. A red run is an issue against this tree. It gates
# nothing, and must not appear in main's required checks

on:
  schedule:
    # The time is section 10's grid in btclib-org/.github and not this
    # file's to restate.
    # Only the default branch schedules workflows, so on any other branch
    # this is reachable through the dispatch below, and through the
    # pull_request trigger further down.
    - cron: "4 3 * * 0"
  workflow_dispatch:
  # so a change to this file is checked by the thing it configures. What
  # the job runs besides this file is the tag's own, so nothing else a
  # pull request touches changes the answer.
  # ready_for_review and closed for the reasons links.yml gives beside its
  # own trigger
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, closed]
    paths:
      - .github/workflows/sdist-rebuild.yml

permissions:
  contents: read

# grouped by pull request, for the reason links.yml gives beside its own
# group (issue #2101)
concurrency:
  group: sdist-rebuild-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rebuild:
    if: >-
      ${{ !github.event.pull_request.draft
          && github.event.action != 'closed' }}
    permissions:
      # a called workflow's own permissions: block can only downgrade
      # what this job grants, never restore an omitted scope -- measured
      # twice in btclib-org/.github#912 -- so both scopes the callee's
      # own job asks for are named here
      contents: read
      # the attestations API, which gh attestation verify reads
      attestations: read
    # sdist-builder, submodules and python-version all take their
    # defaults -- "uv", "" and "" -- which is exactly what this file
    # built before this conversion: `uv build --sdist`, no submodules and
    # no setup-python step. No `with:` block is needed
    uses: btclib-org/.github/.github/workflows/reusable-sdist-rebuild.yml@main
