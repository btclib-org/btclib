---
name: codeql

# the static analysis GitHub runs on its side, moved into the tree.
#
# A repository setting is edited in a browser by whoever holds the token,
# leaves no history a reviewer sees, and cannot be branched -- so while
# default setup held this analysis, the thing that looks for injected
# expressions and unsafe checkouts in these very workflows was itself the
# one part of CI no diff could review. It is a file now, with its actions
# pinned to commit SHAs a pull request can be read for, which is the
# property that had to hold whether or not it gates: the `on:` block below
# is where it stopped gating, and why.
#
# What the setting held is reproduced rather than invented. Read from the
# API while it still held it -- the same command answers
# `state: not-configured` now, the switch having been made:
#
#   gh api repos/btclib-org/btclib/code-scanning/default-setup
#   # {"state":"configured","languages":["actions","python"],
#   #  "query_suite":"default","threat_model":"remote",
#   #  "schedule":"weekly","runner_type":"standard"}
#
# Ruby was not in that list and is not in the matrix below, which is
# worth a word because default-setup runs here did carry an
# `Analyze (ruby)` job: GitHub Pages serves btclib.org from main's root,
# so a Gemfile sits beside the library and autodetection saw it. It
# analysed nothing, and the evidence is the results rather than the
# absence of the job -- 263 ruby analyses ran here, the last on
# 2026-07-30, and every one of them found zero:
#
#   gh api --paginate \
#     "repos/btclib-org/btclib/code-scanning/analyses?per_page=100" \
#     --jq '.[] | select(.category == "/language:ruby") | .results_count' \
#     | sort | uniq -c        # 263 0
#
# --paginate is the point of that line and not a detail. Without it the
# endpoint answers the newest hundred, which since the switch are all
# python and actions, so the command this comment used to carry
# confirmed "none is ruby" by never reaching one.
#
# `threat_model: remote` is CodeQL's own default, so nothing here sets it;
# it would take a `config:` block naming `threat-models` to depart from.
#
# REPOSITORY.md has the order in which the two are exchanged, and it
# matters, because the setting does not refuse to let this file run: the
# analysis completes and the SARIF uploads, and processing then answers
# "CodeQL analyses from advanced configurations cannot be processed when
# the default setup is enabled". Both jobs below are therefore red rather
# than absent while the setting is on, so the branch rule stops naming
# `CodeQL` before the setting goes off rather than after.

on:
  # push and schedule cover main and what a diff cannot; pull_request adds
  # the analysis on the branch itself, ahead of the merge rather than
  # landing after it, which is what the OpenSSF Scorecard's SAST check
  # asks for: it reads a merged pull request's own commits, and this
  # repository was scoring "SAST configuration detected: CodeQL" beside
  # "0 commits out of 29 are checked with a SAST tool" while the trigger
  # below produced no run against a branch at all.
  # Adding pull_request is a trade made in the opposite direction from the
  # one this file used to make against the concurrency ceiling
  # REPOSITORY.md measures: two more matrix cells on every push to a
  # branch, and a check its author now waits on.
  # What still reads a branch before this workflow does is lint.yml:
  # zizmor is a pre-commit hook and reads exactly these files for an
  # injected expression, which is one of the findings this workflow makes;
  # the python queries, and whatever zizmor does not model, are the rest.
  # No `paths` filter, on any of the three triggers: a filter would have
  # to name every path a query reads
  push:
    # a merge creates a commit that its own pull request did not analyse
    # -- squashed to a sha the branch never had, or pushed to main
    # directly -- and code scanning compares a branch's alerts against
    # the default branch's, so without a run here there is no baseline
    # for any other run to be read against
    branches: [main]
  pull_request:
    # ready_for_review and closed, the same two types test.yml and
    # lint.yml carry and for the same reasons given there: a pull request
    # marked ready gets the run the draft condition below withheld while
    # it was a draft, and a closed one is taken only to supersede a run
    # its own concurrency group is still holding
    types: [opened, reopened, synchronize, ready_for_review, closed]
  schedule:
    # Weekly, as default setup was: what a scheduled analysis catches is
    # a query CodeQL added since the last commit, which arrives with the
    # bundle rather than with a branch.
    # The time is section 10's grid in btclib-org/.github and not this
    # file's to restate.
    # Cron runs from the default branch only, so this asks nothing until
    # it reaches main; elsewhere the dispatch below is the way in
    - cron: "4 4 * * 2"
  # the escape hatch: a run on demand for a branch whose pull request is
  # not open yet
  workflow_dispatch:

# least privilege for the GITHUB_TOKEN: everything running in a job
# (actions, dependencies, the CodeQL bundle itself) can read the token, so
# the workflow default must not be able to write to the repository. The
# analysis job elevates for itself, one elevation on the one job that
# needs it, which is the shape REPOSITORY.md keeps
permissions:
  contents: read

# cancel superseded runs on the same branch or pull request.
# The group is named literally rather than with github.workflow, which in
# a called workflow is the caller's name: nothing calls this one today,
# and the expression would be a trap for whatever does.
# github.event.pull_request.number, not github.ref alone: for a closed,
# merged pull request's run, github.ref resolves to the base branch's ref
# rather than refs/pull/N/merge, which would collide with the push
# trigger's own group -- PR 1023's bug, recorded in test.yml's and
# lint.yml's own copy of this comment. A pull_request run of any kind,
# closed included, now groups by the pull request's own number instead,
# which a push never carries and so still groups by github.ref, unchanged
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    # one job per language rather than one job analysing both, so a
    # failure names the language in the checks list instead of sending a
    # reader into the log to find out which half broke -- and so the two
    # run in parallel, which is what default setup did too
    name: Analyze ${{ matrix.language }}
    # a draft pull request is work in progress: every push to one would
    # spend this analysis on a tree its author is not asking anyone to
    # review yet. A run on the merge result still happens the moment the
    # pull request is marked ready, which is why ready_for_review is a
    # trigger type above.
    # A closed pull request spends no runner either, for the reason the
    # trigger above gives: closed is taken only to supersede a run this
    # ref's group is still holding
    if: ${{ !github.event.pull_request.draft && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    # far above what either language needs; what it bounds is a hung job
    # holding a runner for six hours
    timeout-minutes: 20
    # the elevation, on the job that needs it and nowhere else: no other
    # job in this workflow declares permissions, so no other job elevates.
    # security-events: write is what uploading a SARIF to code scanning
    # takes, and the whole reason this job cannot run on the read-only
    # token. actions: read is redundant while this repository is public --
    # it is what the CodeQL action needs to read run metadata in a
    # *private* one -- and it is written down so that the file does not
    # quietly stop working the day the repository stops being public. No
    # packages: read, which fetching a private CodeQL pack would want and
    # the default query suite does not.
    # The trailing comments below are not that paragraph again for its own
    # sake: zizmor's undocumented-permissions audit reads the line a
    # permission is on and not the prose above the block, so one word there
    # is what keeps `--persona=auditor` at zero findings for this file
    permissions:
      security-events: write # the SARIF upload, and nothing else needs it
      contents: read
      actions: read # run metadata, which only a private repository gates
    strategy:
      # one language failing must not cancel the other: which of the two
      # is red is the information, and cancelling throws half of it away
      fail-fast: false
      matrix:
        language:
          - actions
          - python
    steps:
      # every action is pinned to a commit SHA, the tag in the comment: a
      # tag, let alone a branch, is a name its owner can move, and these
      # run in a job that can write security events
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # see the checkout of the coverage job in test.yml
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          # both languages are interpreted, so no build step sits between
          # init and analyze and no autobuild is attempted. Written out
          # rather than left to the default because it is the input that
          # would have to change first if a compiled language ever joined
          # the matrix, and because it is what default setup used here:
          # every analysis default setup produced carries
          # `"build-mode":"none"` in its environment, and not one this
          # workflow has produced does. What an analysis records there
          # changed when the analysis moved into the tree, so the newest
          # answers `{"language":"python"}` and says nothing either way
          # about the input below --
          #   gh api --paginate \
          #     "repos/btclib-org/btclib/code-scanning/analyses?per_page=100" \
          #     --jq '.[] | .environment | test("build-mode")' \
          #     | sort | uniq -c        # 1046 false, 2896 true
          build-mode: none
          # no `queries`, no `packs` and no `config`, which is not an
          # omission: `query_suite: "default"` is precisely the state in
          # which nothing has been added, the action running the default
          # code-scanning suite when the default queries are not disabled
          # and no packs, queries or query-filters are named. Neither
          # init nor analyze takes a `query_suite` input to say it with,
          # so anything written here would widen the analysis rather than
          # pin it -- `queries: security-extended` is the widening, and
          # it is a decision separate from moving the file into the tree
      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          # code scanning keys an analysis by category, so without one
          # per language the second upload of a commit replaces the first
          # and every alert of the other language reads as fixed. The
          # spelling is default setup's own, from the `category` its
          # analyses carry, so the history of alerts survives the switch
          # rather than starting again
          category: "/language:${{ matrix.language }}"

  # one context a branch rule can name, for a workflow whose answer
  # reaches a pull request. Section 10 of the organization standard
  # conditions an aggregate on that and says in as many words that a
  # matrix is not what asks for one: a branch rule can name only a
  # context a pull request produces, so a workflow triggered by `push`
  # and `schedule` alone is one no rule can require however many cells it
  # runs, and an aggregate there is a name nothing can hold. The
  # `pull_request` trigger in the `on:` block above is what makes this
  # workflow the other kind.
  #
  # A third name and not the two cells: REPOSITORY.md's "Required checks
  # on main" states "Never name matrix contexts in the branch rule", and
  # `analyze` fans out to `Analyze actions` and `Analyze python`, so a
  # rule naming both breaks in silence the day CodeQL gains a language
  # worth adding -- the new cell falls outside it with nothing red. This
  # job depends on the matrix, so one name covers whatever the matrix
  # grows into, which is the same reason test.yml carries
  # `test: every job passed` where lint.yml and docs.yml, one job each,
  # need no aggregate at all.
  #
  # Existing and being required are two different things: this job makes
  # the second possible and does not perform it, main's rule being a
  # setting no pull request can change. What the rule actually asks for
  # is REPOSITORY.md's "Required checks on main", which reads the
  # endpoint rather than this file
  codeql-passed:
    # the name and not the id is what branch protection matches, and it
    # carries the workflow because a context is keyed by name alone: two
    # workflows with a job named "every job passed" would produce one
    # ambiguous check, and test.yml's aggregate is required today, so the
    # two names must not converge
    name: "codeql: every job passed"
    needs: [analyze]
    # !cancelled(), not always(): a run superseded by the concurrency
    # group above means "a newer run is authoritative", not "this tree is
    # unproven", and the job skips rather than failing. Not success()
    # either, which would skip the job when a dependency failed -- and a
    # skipped check reads as satisfied wherever a check is read at all,
    # so the gate has to run to be able to fail.
    # The draft and closed halves are the condition `analyze` carries, so
    # a draft skips uniformly instead of reporting a failure for work the
    # workflow declined to do
    if: >-
      ${{ !cancelled() && !github.event.pull_request.draft
      && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # unconditional, and deciding in the shell rather than in an
      # `if:`-gated `contains(needs.*.result, ...)` expression, for the
      # reason test.yml's own aggregate gives at length: issue #1001 saw
      # matrix cells die in "Set up job" with the run's conclusion
      # `failure` while `needs.<job>.result` was not `'failure'`, so the
      # gated step skipped and left the job green by construction. A step
      # that always runs always puts what `needs` held into the log.
      # Reading `needs.*` rather than naming `analyze` is what makes a job
      # added above covered without touching this loop.
      # `success` alone, where test.yml also allows `skipped`: nothing in
      # this workflow is conditional on another job's output -- there is
      # no `changes` job here -- and `analyze`'s own draft and closed
      # condition is this job's too, so a skip means something did not run
      - name: Fail unless every job above succeeded
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "results: $results"
          for result in $results; do
            case "$result" in
              success) ;;
              *)
                echo "::error::a job this gate depends on reported $result"
                exit 1
                ;;
            esac
          done
