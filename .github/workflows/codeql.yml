---
name: codeql

# the static analysis GitHub runs on its side, moved into the tree.
#
# A repository setting is edited in a browser by whoever holds the token,
# leaves no history a reviewer sees, and cannot be branched -- so while
# default setup held this analysis, the thing that looks for injected
# expressions and unsafe checkouts in these very workflows was itself the
# one part of CI no diff could review. It is a file now, with its actions
# pinned to commit SHAs a pull request can be read for, which is the
# property that had to hold whether or not it gates: the `on:` block below
# is where it stopped gating, and why.
#
# What the setting held is reproduced rather than invented. Read from the
# API while it still held it -- the same command answers
# `state: not-configured` now, the switch having been made:
#
#   gh api repos/btclib-org/btclib/code-scanning/default-setup
#   # {"state":"configured","languages":["actions","python"],
#   #  "query_suite":"default","threat_model":"remote",
#   #  "schedule":"weekly","runner_type":"standard"}
#
# Ruby is in neither that list nor the matrix below, and there is no
# Ruby in this tree for either to analyse. It is worth a word all the
# same, because default-setup runs here did carry an `Analyze (ruby)`
# job: autodetection had a Gemfile to see, this repository having served
# a Jekyll site from its root until btclib-org/.github#530 moved that to
# the organization site. The job analysed nothing, and the evidence is
# the results rather than the absence of the job -- 263 ruby analyses
# ran here, the last on 2026-07-30, and every one of them found zero:
#
#   gh api --paginate \
#     "repos/btclib-org/btclib/code-scanning/analyses?per_page=100" \
#     --jq '.[] | select(.category == "/language:ruby") | .results_count' \
#     | sort | uniq -c        # 263 0
#
# --paginate is the point of that line and not a detail. Without it the
# endpoint answers the newest hundred, which since the switch are all
# python and actions, so the command this comment used to carry
# confirmed "none is ruby" by never reaching one.
#
# `threat_model: remote` is CodeQL's own default, so nothing here sets it;
# it would take a `config:` block naming `threat-models` to depart from.
#
# REPOSITORY.md has the order in which the two are exchanged, and it
# matters, because the setting does not refuse to let this file run: the
# analysis completes and the SARIF uploads, and processing then answers
# "CodeQL analyses from advanced configurations cannot be processed when
# the default setup is enabled". Every job below is therefore red rather
# than absent while the setting is on, so the branch rule stops naming
# `CodeQL` before the setting goes off rather than after.

on:
  # push and schedule cover main and what a diff cannot; pull_request adds
  # the analysis on the branch itself, ahead of the merge rather than
  # landing after it, which is what the OpenSSF Scorecard's SAST check
  # asks for: it reads a merged pull request's own commits, and this
  # repository was scoring "SAST configuration detected: CodeQL" beside
  # "0 commits out of 29 are checked with a SAST tool" while the trigger
  # below produced no run against a branch at all.
  # Adding pull_request is a trade made in the opposite direction from the
  # one this file used to make against the concurrency ceiling
  # REPOSITORY.md measures: two more matrix cells on every push to a
  # branch, and a check its author now waits on.
  # What still reads a branch before this workflow does is lint.yml:
  # zizmor is a pre-commit hook and reads exactly these files for an
  # injected expression, which is one of the findings this workflow makes;
  # the python queries, and whatever zizmor does not model, are the rest.
  # No `paths` filter, on any of the three triggers: a filter would have
  # to name every path a query reads
  push:
    # a merge creates a commit that its own pull request did not analyse
    # -- squashed to a sha the branch never had, or pushed to main
    # directly -- and code scanning compares a branch's alerts against
    # the default branch's, so without a run here there is no baseline
    # for any other run to be read against
    branches: [main]
  pull_request:
    # ready_for_review and closed, the same two types test.yml and
    # lint.yml carry and for the same reasons given there: a pull request
    # marked ready gets the run the draft condition below withheld while
    # it was a draft, and a closed one is taken only to supersede a run
    # its own concurrency group is still holding
    types: [opened, reopened, synchronize, ready_for_review, closed]
  schedule:
    # Weekly, as default setup was: what a scheduled analysis catches is
    # a query CodeQL added since the last commit, which arrives with the
    # bundle rather than with a branch.
    # The time is section 10's grid in btclib-org/.github and not this
    # file's to restate.
    # Cron runs from the default branch only, so this asks nothing until
    # it reaches main; elsewhere the dispatch below is the way in
    - cron: "4 4 * * 0"
  # the escape hatch: a run on demand for a branch whose pull request is
  # not open yet
  workflow_dispatch:

# least privilege for the GITHUB_TOKEN: everything running in a job
# (actions, dependencies, the CodeQL bundle itself) can read the token, so
# the workflow default must not be able to write to the repository. A job
# below that needs more declares it for itself and declares only that --
# the analysis its `security-events: write`, the aggregate its
# `actions: read` -- which is the shape REPOSITORY.md keeps
permissions:
  contents: read

# cancel superseded runs on the same branch or pull request.
# The group is named literally rather than with github.workflow, which in
# a called workflow is the caller's name: nothing calls this one today,
# and the expression would be a trap for whatever does.
# github.event.pull_request.number, not github.ref alone: for a closed,
# merged pull request's run, github.ref resolves to the base branch's ref
# rather than refs/pull/N/merge, which would collide with the push
# trigger's own group -- PR 1023's bug, recorded in test.yml's and
# lint.yml's own copy of this comment. A pull_request run of any kind,
# closed included, now groups by the pull request's own number instead,
# which a push never carries and so still groups by github.ref, unchanged
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # the analysis itself is btclib-org/.github's, called at @main so a fix
  # there reaches this tree in one landing (section 10 of its README.md);
  # what stays here is the trigger, the schedule, the concurrency group
  # and the aggregate job below. No inputs: this tree and every sibling
  # carrying codeql.yml scan the same two languages the same way, and an
  # input for a difference none of them has would be a copy in disguise
  # (btclib-org/.github#35)
  analyze:
    uses: btclib-org/.github/.github/workflows/reusable-codeql.yml@main
    # permissions do not inherit through a call, and the called workflow
    # names what it needs in its own header: security-events: write for
    # the SARIF upload, contents: read to check out the tree, and
    # actions: read for CodeQL to read run metadata in a private
    # repository -- redundant while this repository is public, and kept
    # so that the file does not quietly stop working the day it stops
    # being one
    permissions:
      security-events: write # the SARIF upload, and nothing else needs it
      contents: read
      actions: read # run metadata, which only a private repository gates

  # what a branch rule can name, where no cell of the matrix the called
  # workflow runs can be. REPOSITORY.md's "Required checks on main"
  # states "Never name matrix contexts in the branch rule": the rule
  # lives outside the repository, so a context that stops being produced
  # blocks every merge with nothing here to explain it, and the matrix
  # reports a context per language, under a name this job's own id
  # prefixes, so a rule naming the cells it finds goes silently short the
  # day a language joins. lint.yml and docs.yml need no aggregate of
  # their own while each has one job, the job being the context there,
  # which is the same reason test.yml has one.
  # Naming this job in the branch rule is a settings change and
  # REPOSITORY.md's own section to decide; what this job makes is the
  # option, which a workflow reporting its cells and nothing else does
  # not have (btclib-org/.github#459)
  codeql-passed:
    # the name and not the id is what such a rule matches, and it carries
    # the workflow on purpose: a context is keyed by name alone, so two
    # workflows with a job named "every job passed" would produce one
    # ambiguous check, and test.yml's aggregate is a required check
    name: "codeql: every job passed"
    # ordering, and nothing else: nothing in this tree calls this
    # workflow, so the step below reads the run's own job listing rather
    # than `needs.*.result`, which is section 10 of the organization
    # standard's shape for a workflow only ever run directly -- a called
    # workflow's listing is the caller's run and holds jobs waiting on
    # this one, which is why test.yml, being release.yml's own call,
    # keeps `needs`. Here `needs` sequences this job after the call above
    # and decides nothing, so a language the called workflow's own matrix
    # adds is covered without touching this
    needs: [analyze]
    # not success(): a job whose dependencies failed is skipped, and a
    # skipped check reports "skipped", which a rule naming this context
    # counts as satisfied -- the gate has to run to be able to fail. Not
    # always() either: a run superseded by the concurrency group above is
    # one the newer run already speaks for, and reaching this job would
    # turn that cancellation into a red check with no defect behind it.
    # The draft flag is not part of this condition: a skipped required
    # check reads as passing, and this job's own check run does not exist
    # until analyze has settled, so declining it here while draft would
    # leave the draft's skip as the only check of this name on the sha
    # until a later run's own aggregate exists. The closed condition
    # stays: a closed pull request has nothing left to become ready
    # (btclib-org/.github#1327)
    if: >-
      ${{ !cancelled()
      && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # what asking the API for this run's own jobs takes, and the same
      # read test.yml's aggregate would hold if it ever asked that
      # question. REPOSITORY.md's "Token permissions" is where the
      # elevation is read back. The trailing comment repeats it in one
      # line for the reason the analysis job's block gives: zizmor's
      # undocumented-permissions audit reads the permission's own line
      actions: read # the run's job listing, which contents: read misses
    steps:
      # `needs.analyze.result` cannot tell a matrix cell that died in
      # *Set up job* from one that ran and passed (issue #1001); asking
      # the run's own listing instead reads what actually happened, at
      # the price of a step per workflow rather than one shared with
      # test.yml's aggregate, `needs` reaching nothing outside its own
      # workflow
      #
      # under the call above, the listing carries the called workflow's
      # rows under a name this job's own id prefixes -- reusable-codeql.yml's
      # own header has the reason -- and the filter below reads `.jobs[]`
      # whole and judges each row on its conclusion column alone, so the
      # rename changes what a row is called and nothing the filter or the
      # count below reads
      #
      # the allowlist below names "success" and "skipped", which is what
      # section 10 asks of a listing step, rather than "success" alone.
      # Narrowing it reads well against the jobs this file holds -- none
      # is conditional on what a pull request touched, and a superseded
      # run skips this job before the step runs -- but that is a claim
      # about today's jobs and not about the shape: a `changes` job, or
      # an `if:` on a job narrower than this one's own, makes a
      # legitimate "skipped" row reachable, and the first run carrying
      # one is then this job going red with no defect under it and
      # nothing in the tree pointing here. btclib-org/.github#990 is
      # where the aggregates that narrow are swept
      # a skipped required check reads as passing, so the draft flag
      # moves from the job's own `if:` above into this first step: the
      # job still runs while draft, and reports a failure instead of a
      # skip (btclib-org/.github#1327)
      - name: Fail while this pull request is a draft
        if: github.event.pull_request.draft
        run: |
          echo "::error::this pull request is a draft"
          exit 1
      - name: Fail unless every other job of this run succeeded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # `.status` beside the conclusion so that an unfinished job says
          # which kind it is: queued and running are one word to
          # `.conclusion` and two facts to a reader of the log
          jobs=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
            --jq '.jobs[] | "\(.conclusion // "unfinished")\t\(.status)\t\(.name)"')
          # printed before it is judged: the job whose purpose is to be
          # trusted is the one that has to be able to say what it saw
          printf '%s\n' "${jobs}"
          # awk and not grep: a tab in a grep pattern is one
          # implementation's extension and a literal "t" in another's,
          # where awk's field separator is POSIX
          bad=$(printf '%s\n' "${jobs}" |
            awk -F'\t' '$1 != "success" && $1 != "skipped" && $1 != "unfinished"')
          unfinished=$(printf '%s\n' "${jobs}" |
            awk -F'\t' '$1 == "unfinished"' | wc -l | tr -d ' ')
          # each annotation names the rows it is about, an annotation
          # being what the checks page shows without the log being
          # opened. `%0A` is a newline to one, and the tab goes with it:
          # the columns line up in a log and not in this
          annotate() {
            printf '::error::%s' "$1"
            printf '%s' "$2" | tr '\t' ' ' | awk '{ printf "%%0A%s", $0 }'
            printf '\n'
          }
          verdict=0
          if [ -n "${bad}" ]; then
            annotate "these jobs of the run did not succeed:" "${bad}"
            verdict=1
          fi
          # exactly one job of the run may be unfinished, and it is this
          # one. Counted rather than excluded by name, a name being what
          # goes stale when this job is renamed -- and none unfinished at
          # all is refused too, a listing with no job running not being a
          # listing of the run this step is running in
          if [ "${unfinished}" -ne 1 ]; then
            annotate \
              "this check should be the run's one unfinished job; ${unfinished} are" \
              "$(printf '%s\n' "${jobs}" | awk -F'\t' '$1 == "unfinished"')"
            verdict=1
          fi
          exit "${verdict}"
