---
name: integration-bitcoind

# The suite's one part that needs a program this repository does not ship:
# a bitcoind to talk to. `tests/integration/` skips itself without
# BTCLIB_INTEGRATION, so every other workflow reports those tests skipped
# and nothing ever asks a real node whether btclib's psbt is one it will
# relay. This is where that question is asked: a disposable regtest
# bitcoind, the account export, the funding, the spend and the broadcast,
# against Core itself.
#
# `Regtest against Bitcoin Core` is a required check on main: what it
# asks is whether Core accepts what this branch built, and the node is a
# pinned release verified against a published sha256, so the answer is
# about btclib. A run of it can still go red on an unreachable
# bitcoincore.org or a runner slow enough to miss the node's startup
# timeout; that is a re-run, and it is the price of the question.
#
# Which workflow a required check comes from lives outside the
# repository, in main's protection, and names it as a literal string:
# renaming this job is therefore a change to make there first, and
# REPOSITORY.md has the recipe and the reason it cannot be done in one
# pull request.
#
# The HWI half of `tests/integration/` -- a pinned Trezor emulator and a
# pinned Ledger under Speculos -- is `integration-hwi.yml`, a workflow of
# its own rather than a second job here: those can go red on a firmware
# release, on data.trezor.io, or on an app whose screens changed wording,
# none of which is a claim this branch's review has anything to do with.
# A job that is merely skipped on a pull request still lists there as a
# check nobody asked about; a workflow with no `pull_request` trigger at
# all produces no check on one, skipped or otherwise. What checks the HWI
# command line on every commit stays tests/hwi_test.py, whose stand-in
# device is a subprocess answering HWI's own json.
#
# A schedule too, like every other unattended question here, and it is
# not about the tree: the job below is a required check on every pull
# request and on the commit a merge creates, so a weekly run asks the
# same node the same question about a tree nothing has touched. What it
# asks that nothing else does is whether bitcoincore.org still serves the
# tarball pinned below. A pruned release or a moved path is external rot
# of exactly the kind pypi-install.yml is weekly for -- both fetch
# a pinned third-party artifact and verify a hash -- and unscheduled it
# would first appear during a quiet stretch as a red required check on
# the branch of whoever opened the next pull request, about something
# that branch did not do. Sweeping several Core majors would be a different
# question again, and is what bitcoin-core-rpc has
# (btclib-org/bitcoin-core-rpc#211)

on:
  schedule:
    # Sunday, the hour after mutation.yml: what this run watches is the
    # download rather than the tree, so it wants the emptiest day rather
    # than a particular one, and Sunday holds one other job.
    # The time is section 10's grid in btclib-org/.github and not this
    # file's to restate.
    # Only the default branch schedules workflows, so on any other branch
    # this is reachable through the dispatch below alone
    - cron: "4 5 * * 0"
  # the same trigger set as the other gates: main so that the commit a
  # merge creates is asked the question too -- and so that a cache is
  # written where every pull request can read it -- the pull request so
  # that the merge result is, and workflow_call because release.yml calls
  # this workflow, as it calls test.yml, lint.yml and docs.yml: a
  # rehearsal is dispatched from a branch, where the required check this
  # job's name is on main has asked nothing
  push:
    branches: [main]
  workflow_call:
  # the escape hatch, and the way to ask a node about a Core version
  # other than the one pinned below
  workflow_dispatch:
  # so a change to the tests this runs, or to this file, is checked by the
  # thing it configures -- links.yml does the same for its ignore list.
  # As there, the filter is evaluated against the pull request's whole
  # diff against its base rather than against the push that triggered the
  # run, so once a pull request touches one of these every later push to
  # that branch runs this too
  pull_request:
    # ready_for_review, so a pull request marked ready gets the run the
    # draft condition below withheld while it was a draft: the default
    # types do not include it, and without it a readied pull request
    # would wait for its next push to be checked at all.
    # closed too, though the job below declines the real work on it: a
    # merge or a close is neither a push nor a synchronize, so a run this
    # PR's own concurrency group is still holding survives either unless
    # the closed event lands in that same group -- which this type is
    # what makes it do, cancel-in-progress above turning the landing
    # into the cancellation. A closed pull request has nothing left to
    # ask this workflow, the merge commit being main's own push
    # trigger's question. The group below keys on github.head_ref rather
    # than plain github.ref for exactly this event: a merged pull
    # request's closed event sets github.ref to the base branch, not the
    # merge ref, which used to land it in main's own push group and race
    # the merge commit's run for cancellation (PR 1023's bug) instead of
    # the PR's own group as intended
    types: [opened, reopened, synchronize, ready_for_review, closed]
    # no `paths` filter any more: the regtest job below is a required
    # check on main, and a required check that never runs blocks a merge
    # where a skipped one satisfies it -- a filter and a required check
    # cannot both be had. Every pull request pays it, documentation-only
    # ones included, which is what 36 seconds of work buys

# least privilege for the GITHUB_TOKEN: nothing here writes, and the
# tarball is fetched from bitcoincore.org, which does not know this token
permissions:
  contents: read

# the release under test, and the sha256 of its linux tarball as four
# independent guix builders attested it in bitcoin-core/guix.sigs. Pinned
# rather than resolved to "latest": a run that installs whatever is
# newest reports the day Core released rather than the day btclib
# changed, and the version that answered is then unknowable from a green
# run. Raising it is a commit, with the new sha read from the same place.
# integration-hwi.yml pins the same two values for its own signing test
env:
  BITCOIND_VERSION: "31.1"
  BITCOIND_SHA256: >-
    b80d9c3e04da78fb6f0569685673418cf686fadba9042d926d13fb87ff503f9e

# cancel superseded runs. Named literally rather than through
# github.workflow, as everywhere else here: in a called workflow that
# expression is the caller's name.
# head_ref falls back to ref rather than being used bare: it is set only
# for pull_request events, to the PR's head branch, so a push run (ref
# refs/heads/main) still gets its own group -- and a pull_request event
# always groups by the PR's branch, closed and merged ones included, so
# it never collides with a push's group the way bare ref did
concurrency:
  group: integration-bitcoind-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  regtest:
    name: Regtest against Bitcoin Core
    # a draft pull request is work in progress and spends no runner
    # here either: a draft is work its author is not asking anyone to
    # read yet. The same condition lint.yml and test.yml carry, and
    # ready_for_review is a trigger type above for the same reason.
    # A closed pull request spends none either -- the trigger above takes
    # the closed event only to supersede a run this ref's group is still
    # holding
    if: ${{ !github.event.pull_request.draft && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    # the whole flow is seconds -- two tests, a node that answers its
    # first rpc call in well under a second, and a chain of a few blocks
    # -- so this bounds the download and the failure cases rather than
    # the work
    timeout-minutes: 20
    steps:
      # every action is pinned to a commit SHA, the tag in the comment: a
      # tag, let alone a branch, is a name its owner can move
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # see the checkout of the coverage job in test.yml
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # the wheels uv.lock pins do not change between runs, so the
          # cache is the difference between a download and a copy
          enable-cache: true
      # the repository's own composite action, which integration-hwi.yml
      # calls with the same two values: the reasoning for the download is
      # in the file
      - name: Install bitcoind
        id: bitcoind
        uses: ./.github/actions/install-bitcoind
        with:
          version: ${{ env.BITCOIND_VERSION }}
          sha256: ${{ env.BITCOIND_SHA256 }}
      # the same command tests/README.md documents, with the binary named
      # rather than found on PATH. The junit report is for the step below,
      # the run itself being read from the log
      - name: Run the integration tests
        env:
          BTCLIB_INTEGRATION: "1"
          BTCLIB_BITCOIND: ${{ steps.bitcoind.outputs.path }}
        run: |
          uv run --locked --no-default-groups --group test \
            pytest tests/integration --junitxml=integration.xml
      # a skip is not a failure, and that is exactly why this step is
      # here: pytest exits 0 for a module that skipped itself, so a job
      # whose fixture stopped finding the node would stay green while
      # asking Core nothing -- the failure mode of an unattended run that
      # looks like good news. The hwi tests skip here by design and are
      # not counted; the regtest ones have a node, so a skip among them
      # means a prerequisite this job thought it had provided
      - name: Fail if the node tests did not run
        run: |
          uv run --locked --no-default-groups --group test python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          cases = ET.parse("integration.xml").getroot().iter("testcase")
          ran = [one for one in cases
                 if "regtest" in one.get("classname", "")]
          skipped = [one for one in ran if one.find("skipped") is not None]
          for one in skipped:
              reason = one.find("skipped").get("message", "")
              print(f"::error::{one.get('name')} skipped: {reason}")
          if not ran or skipped:
              print(f"::error::{len(ran)} regtest tests, {len(skipped)} skipped")
              sys.exit(1)
          print(f"{len(ran)} regtest tests ran against the node")
          PY
      # always(), because a failure is what somebody opens this job for
      # and the report is what says whether the node refused the
      # transaction or the test never reached it
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-report
          path: integration.xml
          if-no-files-found: error
          # long enough to compare a run with the one before it, short
          # enough that a required check does not accumulate a year of
          # xml
          retention-days: 90
