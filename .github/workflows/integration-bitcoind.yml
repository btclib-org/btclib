---
name: integration-bitcoind

# The suite's one part that needs a program this repository does not ship:
# a bitcoind to talk to. `tests/integration/` skips itself without
# BTCLIB_INTEGRATION, so every other workflow reports those tests skipped
# and nothing ever asks a real node whether btclib's psbt is one it will
# relay, or whether Core still speaks the p2p octets this library emits
# and parses. This is where both questions are asked: a disposable
# regtest bitcoind, the account export, the funding, the spend and the
# broadcast on one side, and a `Version` this library serialized dialled
# straight at the node's p2p port on the other, against Core itself.
#
# The checkout, the node install, the test run and the report upload are
# btclib-org/.github's: reusable-integration-bitcoind.yml, called at
# @main so a fix there reaches this tree in one landing (section 10 of
# its README.md). What stays here is the trigger, the cron minute, the
# concurrency group, the pinned release and its sha256, and the two
# environment-variable names tests/integration/conftest.py reads.
#
# `Regtest against Bitcoin Core` is a required check on main: what it
# asks is whether Core accepts what this branch built, and the node is a
# pinned release verified against a published sha256, so the answer is
# about btclib. A run of it can still go red on an unreachable
# bitcoincore.org or a runner slow enough to miss the node's startup
# timeout; that is a re-run, and it is the price of the question.
#
# A call changes the reported check context to the calling job's own id
# joined to the called job's `name:` -- the called workflow's own header
# has the reason and names updating the branch rule as each caller's own
# change to make, outside its own pull request.
#
# Which workflow a required check comes from lives outside the
# repository, in main's protection, and names it as a literal string:
# renaming this job is therefore a change to make there first, and
# REPOSITORY.md has the recipe and the reason it cannot be done in one
# pull request.
#
# The HWI half of `tests/integration/` -- a pinned Trezor emulator and a
# pinned Ledger under Speculos -- is `integration-hwi.yml`, a workflow of
# its own rather than a second job here: those can go red on a firmware
# release, on data.trezor.io, or on an app whose screens changed wording,
# none of which is a claim this branch's review has anything to do with.
# A job that is merely skipped on a pull request still lists there as a
# check nobody asked about; a workflow with no `pull_request` trigger at
# all produces no check on one, skipped or otherwise. What checks the HWI
# command line on every commit stays tests/hwi_test.py, whose stand-in
# device is a subprocess answering HWI's own json.
#
# `exclude-classname` below carries "hwi" for the reason the called
# workflow's own header names as the ground on which this conversion
# could be wrong: this tree's tests/integration mixes in HWI-classname
# testcases that legitimately skip here (the paragraph above), so the
# node-ran check has to be told to let those skips through before it
# judges the rest. btclib is the only caller that will ever set it --
# btclib-node has no such tests and filters nothing -- which is the
# shape this organization otherwise refuses for an input; it is taken
# here anyway because the difference is one filter inside one step of a
# job that is otherwise identical end to end -- not a different script, a
# different trigger set or a different job -- which is the same ground
# reusable-os-suite.yml's own pre-suite-script already stands on for
# btclib-secp256k1 alone.
#
# A schedule too, like every other unattended question here, and it is
# not about the tree: the job below is a required check on every pull
# request and on the commit a merge creates, so a weekly run asks the
# same node the same question about a tree nothing has touched. What it
# asks that nothing else does is whether bitcoincore.org still serves the
# tarball pinned below. A pruned release or a moved path is external rot
# of exactly the kind pypi-install.yml is weekly for -- both fetch
# a pinned third-party artifact and verify a hash -- and unscheduled it
# would first appear during a quiet stretch as a red required check on
# the branch of whoever opened the next pull request, about something
# that branch did not do. Sweeping several Core majors would be a different
# question again, and is what bitcoin-core-rpc has
# (btclib-org/bitcoin-core-rpc#211)

on:
  schedule:
    # An integration sentinel, the others being integration-hwi.yml and
    # zkp-oracle.yml: what this run watches is the download rather than
    # the tree, so it wants no particular day.
    # The time is section 10's grid in btclib-org/.github and not this
    # file's to restate.
    # Only the default branch schedules workflows, so on any other branch
    # this is reachable through the dispatch below, and through the
    # pull_request trigger further down.
    - cron: "4 5 * * 2"
  # the same trigger set as the other gates: main so that the commit a
  # merge creates is asked the question too -- and so that a cache is
  # written where every pull request can read it -- the pull request so
  # that the merge result is, and workflow_call because release.yml calls
  # this workflow, as it calls test.yml, lint.yml and docs.yml: a
  # rehearsal is dispatched from a branch, where the required check this
  # job's name is on main has asked nothing
  push:
    branches: [main]
  workflow_call:
    inputs:
      concurrency-suffix:
        description: >
          Appended to the concurrency group, and the release workflow is
          the only caller that passes one. See the group below.
        type: string
        default: ""
  # the escape hatch, and the way to ask a node about a Core version
  # other than the one pinned below
  workflow_dispatch:
  # so a change to the tests this runs, or to this file, is checked by the
  # thing it configures -- links.yml does the same for its ignore list.
  # As there, the filter is evaluated against the pull request's whole
  # diff against its base rather than against the push that triggered the
  # run, so once a pull request touches one of these every later push to
  # that branch runs this too
  pull_request:
    # ready_for_review, so a pull request marked ready gets the run the
    # draft condition below withheld while it was a draft: the default
    # types do not include it, and without it a readied pull request
    # would wait for its next push to be checked at all.
    # closed too, though the job below declines the real work on it: a
    # merge or a close is neither a push nor a synchronize, so a run this
    # PR's own concurrency group is still holding survives either unless
    # the closed event lands in that same group -- which this type is
    # what makes it do, cancel-in-progress above turning the landing
    # into the cancellation. A closed pull request has nothing left to
    # ask this workflow, the merge commit being main's own push
    # trigger's question. The group below keys on the pull request's own
    # number rather than plain github.ref for exactly this event: a
    # merged pull request's closed event sets github.ref to the base
    # branch, not the merge ref, which used to land it in main's own
    # push group and race the merge commit's run for cancellation
    # (PR 1023's bug) instead of the PR's own group as intended
    types: [opened, reopened, synchronize, ready_for_review, closed]
    # no `paths` filter any more: the regtest job below is a required
    # check on main, and a required check that never runs blocks a merge
    # where a skipped one satisfies it -- a filter and a required check
    # cannot both be had. Every pull request pays it, documentation-only
    # ones included, and the job below is short enough that paying it is
    # the cheaper side of the trade

# least privilege for the GITHUB_TOKEN: nothing here writes, and the
# tarball is fetched from bitcoincore.org, which does not know this token
permissions:
  contents: read

# cancel superseded runs. Named literally rather than through
# github.workflow, as everywhere else here: in a called workflow that
# expression is the caller's name.
# github.ref has the same shape of problem one level down, and it is why
# the suffix is there. Inside a called workflow that context is the
# caller's ref, so a rehearsal -- a workflow_dispatch of release.yml on a
# branch -- computes integration-bitcoind-refs/heads/<branch>, the very
# group a push to that branch or a direct dispatch of this workflow
# computes. One then kills the other. release.yml passes a suffix of its
# own, which keeps the release path out of the branch groups
# (issue btclib-org/.github#1083).
# github.event.pull_request.number, not github.head_ref, is the key: a
# pull_request event always groups by the PR's own number, closed and
# merged ones included, so it never collides with a push's group the way
# bare ref did, and it also survives two forks whose head branches share a
# name -- head_ref does not, being the branch's name rather than the pull
# request's own number (issue #1158)
concurrency:
  group: >-
    integration-bitcoind-${{ github.event.pull_request.number ||
    github.ref }}${{ inputs.concurrency-suffix }}
  cancel-in-progress: true

jobs:
  regtest:
    uses: btclib-org/.github/.github/workflows/reusable-integration-bitcoind.yml@main
    # permissions do not inherit through a call: the called job reads the
    # tree and writes nothing, so this is what caps what it may be
    # granted -- refusing rather than trimming what the called workflow
    # itself requests
    permissions:
      contents: read
    with:
      # the release under test, and the sha256 of its linux tarball as
      # the independent guix builders attested it in
      # bitcoin-core/guix.sigs. Pinned rather than resolved to "latest":
      # a run that installs whatever is newest reports the day Core
      # released rather than the day btclib changed, and the version
      # that answered is then unknowable from a green run. Raising it is
      # a commit, with the new sha read from the same place.
      # integration-hwi.yml pins the same two values for its own signing
      # test
      bitcoind-version: "31.1"
      bitcoind-sha256: >-
        b80d9c3e04da78fb6f0569685673418cf686fadba9042d926d13fb87ff503f9e
      # tests/integration/conftest.py's own two switches, not something
      # a file here could write
      integration-env-var: BTCLIB_INTEGRATION
      bitcoind-path-env-var: BTCLIB_BITCOIND
      # the header above has the reasoning; this is the one value that
      # makes this caller differ from btclib-node's
      exclude-classname: hwi
