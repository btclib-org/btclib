---
name: vendored vectors

# tests/_data/README.md pins every vendored test vector to a commit and
# a git blob SHA-1, and carries a documented manual procedure to
# re-check one pin. This runs that procedure once a week instead, over
# every pin the script can check, and opens or updates an issue on
# drift rather than fixing anything: what to do about a pin that has
# moved is a decision the script does not get to make.
#
# The checkout, the optional interpreter setup and the re-check itself
# are btclib-org/.github's: reusable-vendored-vectors.yml, called at
# @main so a fix there reaches this tree in one landing (section 10 of
# its README.md). What stays here is the trigger, the cron minute, the
# concurrency group and the ledger this tree checks.
#
# issues: write here is granted by no other workflow in this tree, and
# three decline it in as many words, each for its own reason: links.yml,
# deps-latest.yml and mutation.yml. The reason this one takes it is the
# called workflow's own header, not this file's to restate.

on:
  schedule:
    # Test data: links.yml asks whether a page this tree points at still
    # resolves, this one whether a file it pinned is still the file --
    # one question over two distances.
    # The time is section 10's grid in btclib-org/.github and not this
    # file's to restate.
    # Only the default branch schedules workflows, so on any other branch
    # this is reachable through the dispatch below, and through the
    # pull_request trigger further down.
    - cron: "4 3 * * 1"
  workflow_dispatch:
  pull_request:
    # ready_for_review, so a pull request marked ready gets the run the
    # draft condition below withheld while it was a draft: the default
    # types do not include it, and without it a readied pull request
    # would wait for its next push to be checked at all.
    # closed too, though the job below declines the real work on it: a
    # merge or a close is neither a push nor a synchronize, so a run this
    # PR's own concurrency group is still holding survives either unless
    # the closed event lands in that same group -- which this type is
    # what makes it do, cancel-in-progress above now false for a landing,
    # so the arriving run queues behind the one already in flight instead
    # of cancelling it; a bare close still cancels, unchanged. The group
    # below keys on
    # github.event.pull_request.number rather than plain github.ref for
    # exactly this event: a merged pull request's closed event sets
    # github.ref to the base branch, not the merge ref, which used to
    # land it in main's own group -- racing the scheduled run for
    # cancellation (PR 1023's bug) instead of the PR's own group as
    # intended
    types: [opened, reopened, synchronize, ready_for_review, closed]
    paths:
      - .github/workflows/vendored-vectors.yml
      - .github/scripts/check_vendored_vectors.py
      - tests/_data/README.md

permissions:
  contents: read

# github.event.pull_request.number, not github.head_ref, is the key: it
# is set only for pull_request events, to the PR's own number, so a
# scheduled or dispatched run (ref refs/heads/main) still gets its own
# group -- and a pull_request event always groups by the PR's own
# number, closed and merged ones included, so it never collides with
# that group the way bare ref did, and it also survives two forks whose
# head branches share a name, which head_ref does not (issue #2101)
concurrency:
  group: vendored-vectors-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !(github.event.action == 'closed' && github.event.pull_request.merged) }}

jobs:
  vectors:
    uses: btclib-org/.github/.github/workflows/reusable-vendored-vectors.yml@main
    # permissions do not inherit through a call: the check job the
    # reusable workflow runs wants issues: write for its gh issue
    # create/edit/close calls, so the calling job declares it here,
    # which is what caps what the called workflow may be granted
    permissions:
      contents: read
      issues: write # gh issue create/edit/close, in the called workflow
    with:
      # cardinality 1: this tree pins one ledger, tests/_data/README.md.
      # The tf2 verdict ledger belongs to tf2, not to this tree
      # (issue #2220).
      ledgers: >-
        [{"ledger": "tests/_data/README.md",
        "title": "Vendored vectors behind upstream"}]
      # the interpreter .python-version pins: the script imports only
      # the standard library, so this is not a claim about what btclib
      # itself requires, only this tree's own choice to pin one rather
      # than run against the runner's own python3
      python-version: "3.15"
