---
name: mutation

# Coverage answers "was this line executed"; this answers "would the suite
# notice if it were wrong". The gap is not theoretical here -- issue #219
# lists three defects found inside a 100% covered tree, all three in the
# consensus code, and issue #327 five more on the input boundaries, two of
# them in the transaction parsers -- and a surviving mutant names one line
# of it at a time.
#
# The baseline check, the session loop, the restore guard, the counts and
# the upload are btclib-org/.github's reusable-mutation.yml, called at
# @main so a fix there reaches this tree in one landing (section 10 of
# that repository's README.md, btclib-org/.github#35). What stays here is
# this tree's own subject matter -- the profiles below, their budgets and
# their ceilings -- and the trigger, the schedule, the dispatch dropdown,
# the concurrency group and the permissions, none of which a reader of
# the callee could write for this tree.
#
# It gates nothing, and that is the design rather than a caution. A gate
# needs a number nobody has measured yet, and a survival rate is not a
# regression: a mutant survives because a test is missing, so a red merge
# would block whoever next touched the file for a hole somebody else left.
# It therefore does not appear in main's required checks, and must not --
# that rule lives outside the repository and names its checks as literal
# strings.
#
# What runs here is what .github/mutation/*.toml says, which is what
# CONTRIBUTING.md documents for a local run: one list of scopes and test
# commands, not a second copy of them in yaml.

on:
  # No pull_request trigger, unlike links.yml, which does run itself when
  # its own configuration changes. The difference is the clock: a link
  # sweep is a couple of hundred requests, a mutation session is hours, so
  # a trigger on .github/mutation/*.toml would hang an hours-long job off a
  # pull request it is not allowed to gate. What that trigger would have
  # caught is caught cheaply elsewhere -- check-toml parses these files on
  # every commit, and `cosmic-ray baseline`, which the callee runs first,
  # fails the run before any mutant if a test command has gone stale
  schedule:
    # Test depth, the other of that family being fuzz.yml: a session
    # measured in hours, asking something on a different axis from every
    # other sentinel here -- the suite's own quality, not a dependency's
    # or a platform's.
    # The time is section 10's grid in btclib-org/.github and not this
    # file's to restate.
    # Cron runs from the default branch only, so this file gates nothing
    # until it reaches the default branch -- elsewhere it is reachable
    # through the
    # dispatch button below and nowhere else
    - cron: "4 5 * * 1"
  # the escape hatch, and the way to spend a whole afternoon on the engine
  # session that the weekly budget only samples
  workflow_dispatch:
    inputs:
      profile:
        # one scope's numbers are what a question about that scope needs,
        # and without this the only way to ask is the whole matrix: twelve
        # runners and, at the consensus job's ceiling, most of an
        # afternoon. Re-measuring one configuration -- a budget changed, a
        # timeout argued about, a survivor that moved -- is worth minutes
        # rather than that, and a question nobody can afford to ask twice
        # gets answered once and quoted for months.
        # `all` is the default and is what the schedule does, the
        # button having had no other behaviour before this input
        # existed. Spelled rather than left empty: a blank entry in a
        # dropdown reads as a mistake
        description: one profile's slug, or all of them
        required: false
        default: all
        type: choice
        options:
          - all
          - consensus
          - parsers
          - keys
          - signing
          - block
          - shared
          - signatures
          - curves
          - descriptors
          - psbt
          - script
          - boundaries
          - frost

# least privilege for the GITHUB_TOKEN: everything running in a job can
# read it, and nothing here writes. In particular no issues: write --
# filing an issue per survivor is the obvious next step and the wrong one,
# a survivor being a test to write rather than a defect to track
permissions:
  contents: read

# cancel superseded runs. Named literally rather than through
# github.workflow, as everywhere else here: in a called workflow that
# expression is the caller's name.
# cancel-in-progress because a dispatch is how somebody asks for these
# numbers now, and waiting behind the scheduled run for hours would be the
# opposite of an escape hatch
concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    uses: btclib-org/.github/.github/workflows/reusable-mutation.yml@main
    with:
      # One object per profile, and every value in it is this tree's own:
      # the phrase the job is named for, the slug the dropdown above and
      # the artifact are keyed on, the ceiling in minutes, and the
      # sessions in the order they run. The callee's `profiles` input
      # describes that shape and its `timeout-minutes` says what a
      # ceiling bounds, so what is left to say here is why each budget is
      # the number it is.
      #
      # A budget's measurement belongs to the scope it pays for, and
      # `.github/mutation/` is where a scope is judged: each
      # configuration's header states which survivors were weighed and
      # why. None of them states a total any more -- section 9 refuses
      # one, and every scheduled run prints what it enumerated, killed
      # and skipped (btclib-org/.github#1158) -- so there is no figure
      # here that would be a second copy. What that copy cost is still
      # on record: this file once stated "977 apiece" for bms.toml and
      # bip322.toml, a count neither file's own header could produce,
      # and bms.toml is where that was caught (issue #987). What stays
      # below is the reasoning no single configuration can hold: which
      # scopes share a runner, how a ceiling is arrived at, and the wall
      # clock a budget was set from where no configuration records one.
      #
      # `consensus`: two sessions of ninety minutes, and the asymmetry is
      # in what they buy rather than in the number. sig_hash.toml
      # finishes inside its budget with room for a runner slower than the
      # machine that measured it, while engine.toml's own header has the
      # arithmetic saying no budget this workflow is worth can finish
      # that one, so it is sampled. A sample of the same slice every week
      # is worth more than it sounds: the verdicts in it are stable, so
      # one that changes is a test that stopped checking what it used to.
      #
      # `parsers`: minutes rather than hours, the budget having been
      # sized against a session of five to seven minutes of wall clock on
      # the machine that measured it -- elapsed and not cpu, which is
      # what the callee's `timeout` and this ceiling both count. A runner
      # is slower than that machine by more than the margin allows for: a
      # dispatch of this profile alone is cut at its budget with a part
      # of the scope never run, so what the weekly job reports is a
      # sample rather than the comparable rate the budget was written
      # for. Buying the rest of it is a question for the ceiling as much
      # as for the budget, this one leaving fifteen minutes of slack over
      # the other.
      #
      # `keys`: bip32.toml finishes in about twenty minutes and
      # codecs.toml is sampled at the thirty it is given, both measured
      # on a machine already running the rest of this matrix, so a
      # dedicated runner has room to spare rather than needing it.
      #
      # `signing`: the two message-signing scopes share a runner, a
      # session each, and ten minutes apiece is headroom rather than a
      # measurement -- bip322.toml's own header puts its session under
      # ten minutes, which is the figure to re-measure before this budget
      # is leaned on.
      #
      # `block`: block.toml's session completes in under an hour on the
      # machine that measured it, and 75 minutes is that with a slower
      # runner's margin.
      #
      # `shared`: five scopes, and the cell where the budgets argue with
      # each other. utils.toml carries the largest of them and is sampled
      # rather than expected to finish, a weakened size bound turning
      # into a near-timeout mutant there the way numeric.toml's own does.
      # numeric.toml gets 25 rather than 15 because at the 30 s
      # per-mutant timeout its configuration argues for, 25 is what a
      # complete session costs, and a profile that finishes states a
      # survival rate where a sampled one can only be read for the
      # verdicts that move in it. fetch_decorators.toml sits beside
      # fetch.toml rather than taking a runner of its own, a session this
      # short buying nothing from one: it completes in 200 s of wall
      # clock at a load average of 24 on the machine that timed it, and
      # 10 minutes is three times that. The budgets sum to 95 against a
      # ceiling raised by those same 10, which leaves the others the
      # slack they were measured with.
      #
      # `signatures`: sampled rather than expected to finish, and
      # signatures.toml's header is what the ninety minutes below reached.
      #
      # `curves`: ninety minutes, matching signatures.toml's budget for a
      # scope curve_group.toml's header measures at nearly double the
      # size, which samples the scope rather than finishing it -- the
      # weekly job cuts the session there and reports what it judged. Why
      # this scope is invisible to the signatures profile, and what
      # triaging its survivors involves, are curve_group.toml's own
      # header too.
      #
      # `descriptors`: the largest scope in this matrix, and its own job
      # because it would otherwise spend every other scope's budget.
      # Sampled the way the engine is and for the same reason: no budget
      # this workflow is worth finishes it, and a sample of the same
      # slice each week is worth having because a verdict that changes in
      # it is a test that stopped checking what it used to.
      #
      # `psbt`: psbt.toml's own header measures its session with four
      # other profiles sharing the machine, so a runner of its own is
      # faster and 45 minutes there is most of the scope rather than the
      # third that header records.
      #
      # `script`: not folded into the consensus job, which spends 180 of
      # its 200 minutes already, and not into the psbt one, which would
      # then need 90 minutes of its own. 45 again, the 20 it was cut to
      # having bought its answer: this profile twice took its host down
      # mid-session (issue #948), and a session cut ahead of the kill was
      # a floor under the loss while the mechanism was unknown. It is no
      # longer the only thing holding the profile up -- the callee runs
      # every session under an address-space limit, which is what turns
      # that dead host into a recorded verdict whatever the budget -- and
      # a cut session cannot be compared with the week before it, which
      # is what this profile is for. If it dies here again the budget was
      # the only thing holding it, and that is a mechanism still to find
      # rather than one this file should hide.
      #
      # `boundaries`: the four small scopes, which is what makes them one
      # job rather than four runners. Budgets in the order their own
      # headers measure them -- signer.toml the fastest, then
      # wallet.toml, then musig2.toml, which spends most of a session on
      # the two `%` turned `**` its configuration names, and hwi.toml,
      # whose tests start a subprocess apiece -- and the ceiling is their
      # sum plus the environment.
      #
      # `frost`: a runner of its own rather than a fifth session in
      # `boundaries`, where musig2.toml sits. The two are the same
      # protocol question one BIP apart, which is the argument for
      # putting them together; the arithmetic is the argument against.
      # The dispatch frost.toml's header cites, run 35443988434, spent the
      # whole budget below -- more than any session in `boundaries` is
      # given -- and left most of the scope's mutants unrun. It is a
      # sample, for the reason descriptors.toml's cell gives, and the
      # ceiling leaves the slack over the budget that the `psbt` cell's
      # does.
      profiles: >-
        [{"profile": "the consensus code", "slug": "consensus", "ceiling": 200, "sessions":
        "sig_hash.toml 90m\nengine.toml 90m"},
        {"profile": "the wire-format parsers", "slug": "parsers", "ceiling": 45, "sessions":
        "parsers.toml 30m"},
        {"profile": "extended keys and the checksummed codecs", "slug": "keys", "ceiling": 95,
        "sessions": "bip32.toml 45m\ncodecs.toml 30m"},
        {"profile": "message signing and BIP322", "slug": "signing", "ceiling": 35, "sessions":
        "bms.toml 10m\nbip322.toml 10m"},
        {"profile": "the block chain", "slug": "block", "ceiling": 95, "sessions":
        "block.toml 75m"},
        {"profile": "shared helpers, numeric bounds and fetch", "slug": "shared", "ceiling":
        105, "sessions":
        "utils.toml 30m\nnumeric.toml 25m\nfetch.toml 15m\nfetch_decorators.toml
        10m\nmnemonic.toml 15m"},
        {"profile": "signature signing and verification", "slug": "signatures", "ceiling": 100,
        "sessions": "signatures.toml 90m"},
        {"profile": "the pure-Python curve arithmetic", "slug": "curves", "ceiling": 100,
        "sessions": "curve_group.toml 90m"},
        {"profile": "output descriptors and miniscript", "slug": "descriptors", "ceiling": 100,
        "sessions": "descriptors.toml 90m"},
        {"profile": "the psbt format", "slug": "psbt", "ceiling": 60, "sessions":
        "psbt.toml 45m"},
        {"profile": "the script encodings", "slug": "script", "ceiling": 60, "sessions":
        "script.toml 45m"},
        {"profile": "wallets, the signer boundary, musig2 and HWI", "slug": "boundaries",
        "ceiling": 90, "sessions":
        "signer.toml 10m\nwallet.toml 20m\nmusig2.toml 20m\nhwi.toml 30m"},
        {"profile": "FROST threshold signing", "slug": "frost", "ceiling": 75, "sessions":
        "frost.toml 60m"}]
      # the dropdown above, forwarded. A schedule has no `inputs` at all,
      # so this arrives at the callee as an empty string, which its own
      # `SELECTED` expression reads as every profile rather than as none
      selected: ${{ inputs.profile }}
