---
name: release

# one pipeline, two targets:
# - pushing a v<version> tag runs the full test matrix, builds and
#   checks the distribution files, publishes them to PyPI, and turns
#   the tag into a GitHub release whose notes come from RELEASE_NOTES.md
# - workflow_dispatch is the rehearsal: the same pipeline from any
#   branch, publishing to TestPyPI under a unique .dev<N> version.
#   A rehearsal is never tagged
# Both indices trust this workflow directly (PyPI Trusted Publishing,
# see RELEASING.md): there is no API token to store or leak
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# never two runs of this workflow at once, and never a cancellation: the
# other workflows cancel a superseded run because their subject is the
# commit, and a newer commit supersedes the answer. Here the subject is a
# publication -- a version on an index, an attestation, a release -- so a
# second run is a second attempt at the same side effects, and cancelling one
# halfway is how a version reaches PyPI with no release cut for it.
# Named literally, as everywhere else: github.workflow in a called workflow
# is the caller's name, and this workflow is a caller
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # what a tag cannot survive being wrong about, checked before anything is
  # built and long before anything is uploaded: a version is consumed by
  # the upload that carries it, and can then only be yanked.
  # A minute of checking, ahead of an hour of building.
  # The rehearsal runs this too, so a mismatch cannot wait for release day
  # to surface; only the checks about the tag itself are release-only,
  # there being no tag to ask about otherwise
  version-check:
    name: Check the tag and the declared versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # every action is pinned to a commit SHA, the tag in the comment: a
      # tag, let alone a branch, is a name its owner can move, and these
      # run in a job that can read the workflow token. It matters most in
      # this workflow, where a job holds an OIDC token PyPI accepts
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # see the checkout of the suite job in test.yml
          persist-credentials: false
          # the whole history, where every other checkout in these
          # workflows takes the default single commit: the ancestry check
          # below has nothing to answer with otherwise, and it is also what
          # puts origin/<default branch> in this checkout at all. Only this
          # job pays for it, and it pays once per release
          fetch-depth: 0
      # a tag is a name that can point anywhere, and nothing else in this
      # workflow asks where: every check below reads the tree the tag names
      # rather than where that tree came from. So a tag pushed from a stale
      # worktree, or from a branch whose pull request is still open, or from
      # a commit squashed away on its way into the default branch, would
      # publish code no review ever approved and no branch contains --
      # which is issue #574's failure mode one pipeline over, a build
      # running something unreachable from where it is supposed to be.
      # `git merge-base --is-ancestor` is the whole of the question.
      # Release-only, like the two checks below and for the same reason: a
      # rehearsal is dispatched from a branch on purpose, that being what
      # it is for.
      # The default branch is read from the event rather than written as
      # `main`: this is the one check whose subject is that branch, so it
      # has to keep meaning what it says the day the name changes
      - name: Check that the tag is merged into the default branch (release only)
        if: github.event_name == 'push'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! git rev-parse --verify --quiet "origin/$DEFAULT_BRANCH" >/dev/null; then
            msg="fetch-depth: 0 on the checkout above is what puts it there"
            echo "::error::origin/$DEFAULT_BRANCH is not in this checkout; $msg"
            exit 1
          fi
          commit=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$commit" "origin/$DEFAULT_BRANCH"; then
            msg="a release is tagged on a commit that branch contains"
            echo "::error::$commit is not an ancestor of $DEFAULT_BRANCH; $msg"
            exit 1
          fi
          echo "$commit is an ancestor of $DEFAULT_BRANCH"
      # caching off in this workflow, unlike every other: a cache entry is
      # written by whichever run populated it, and read here through the
      # scoping that gives a tag push the caches of the default branch. This
      # is the workflow that builds what gets uploaded and whose jobs hold
      # an OIDC token PyPI accepts, so it downloads its dependencies afresh
      # every time. It costs seconds, once per release.
      # Spelled out rather than left off: the input defaults to "auto",
      # which means enabled on a GitHub-hosted runner
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      # every other uv command in these workflows passes --locked, which
      # asserts the same thing, so this is the named early gate rather
      # than the only one. --locked and not --frozen, there and here:
      # --frozen takes uv.lock as it finds it and never checks it, so a
      # dependency added to pyproject.toml without a re-lock goes
      # unnoticed while nothing installs it
      - name: Check that uv.lock is up to date
        run: uv lock --check
      # one comparison: pyproject.toml is the
      # only place the version is declared, btclib.__version__ reads it
      # back from the installed metadata and docs/source/conf.py reads it
      # from the file, so there is no second declaration to disagree with.
      # uv.lock carries the project version too, which is what the check
      # above covers
      - name: Check that the tag matches the declared version (release only)
        if: github.event_name == 'push'
        run: |
          version=$(uv version --short)
          echo "pyproject.toml declares $version"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the declared version $version"
            exit 1
          fi
          # the trigger decides the index, so a tagged pre-release goes to
          # PyPI itself: a v2023.8rc1 tag on a tree declaring 2023.8rc1
          # passes the comparison above and burns a version that a --pre
          # install would then resolve. RELEASING.md sends a trial run to
          # TestPyPI through workflow_dispatch and says never to tag one;
          # this is the check for it. Digits and dots only, which is the
          # calendar scheme of YYYY.M.D and its patch number, and nothing
          # PEP 440 reads as a pre-release, a dev build or a post release
          if ! echo "$version" | grep -Eq '^[0-9]+(\.[0-9]+)*$'; then
            msg="rehearse on TestPyPI via workflow_dispatch instead"
            echo "::error::$version is not a final version; $msg"
            exit 1
          fi
          # three components at least: the day is not optional on
          # anything this pushes to PyPI, only on the placeholder "Open
          # the next cycle" sets between releases -- which is never
          # tagged, so this check never sees it. Without this, "v2026.8"
          # passes every check above it and publishes a version with no
          # day, indistinguishable from the placeholder that names the
          # same month
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            msg="a release is YYYY.M.D, optionally YYYY.M.D.N for a patch"
            echo "::error::$version has no day; $msg"
            exit 1
          fi
      # the release notes are RELEASE_NOTES.md's section for the tag,
      # lifted by the github-release job below, and its fallback fires
      # only on an *empty* section: "## v2026.8 (work in progress, not
      # released yet)" matches that job's heading regex, the tag being
      # followed by a space, so a forgotten retitle publishes the
      # work-in-progress text as the release notes, silently. This is the
      # check for it, and it belongs here rather than in github-release
      # because that job runs after PyPI has accepted the files, and a
      # version cannot be unpublished.
      # CHANGELOG.md is checked too: RELEASING.md retitles the two
      # together, RELEASE_NOTES.md's section points at CHANGELOG.md's for
      # the detail, and a heading left as "work in progress" makes that a
      # link into nothing.
      # Release-only, like the comparison above, and for the same reason:
      # a rehearsal is what runs *before* the retitle, so requiring it
      # there would forbid the dry run it exists to be.
      # String comparison rather than a regex, so that the dots of the
      # version match dots and not any character, and awk rather than
      # grep, one pass answering all three questions
      - name: Check that the release notes are retitled for the tag (release only)
        if: github.event_name == 'push'
        run: |
          version=$(uv version --short)
          for file in RELEASE_NOTES.md CHANGELOG.md; do
            awk -v tag="v$version" -v file="$file" '
              $0 == "## " tag {heading = NR; next}
              index($0, "## " tag " ") == 1 {heading = NR; extra = $0; next}
              /^## / && heading {exit}
              heading && NF {body = 1}
              END {
                if (!heading) {
                  printf "::error::%s has no \"## %s\" section\n", file, tag
                  exit 1
                }
                if (extra) {
                  printf "::error::%s:%d is \"%s\"; the heading must be \"## %s\" alone\n",
                    file, heading, extra, tag
                  exit 1
                }
                if (!body) {
                  printf "::error::%s section \"## %s\" is empty\n", file, tag
                  exit 1
                }
                printf "%s has a non-empty \"## %s\" section\n", file, tag
              }
            ' "$file"
          done

  # the whole build/test matrix, exactly as a pull request runs it
  test:
    name: Run the test workflow
    needs: version-check
    uses: ./.github/workflows/test.yml
    # a called workflow's jobs are capped at what the caller grants here,
    # not at what the called workflow's own top-level default declares:
    # this workflow's contents: read alone would leave test.yml's
    # `changes` job, which asks for pull-requests: read to list a pull
    # request's files, refused before a single job starts, version-check
    # included -- `changes` never actually reads a file list on a
    # release, answering code=true unconditionally off anything that is
    # not a pull_request event, but the check is against what the job
    # declares, not against what it goes on to do. contents: read is
    # repeated rather than left to test.yml's own default for the same
    # reason: a caller's grant replaces the callee's default outright, so
    # anything this list leaves off becomes none for every job over
    # there, not only for the one this comment names
    permissions:
      contents: read
      pull-requests: read

  # and the same checks a pull request lints with: without this, a tag
  # push could publish code the pre-commit hooks reject. Not gated on
  # version-check: this is the cheap one, and it runs in parallel with it
  lint:
    name: Run the lint workflow
    uses: ./.github/workflows/lint.yml

  # and the documentation build, for the reason the lint call above gives: a
  # tag publishes the docstrings read the docs will render from it, so the
  # build that would fail there fails here first. It has a workflow of its
  # own now, so calling lint.yml no longer covers it
  docs:
    name: Run the docs workflow
    uses: ./.github/workflows/docs.yml

  # and the two platforms the merge gate does not wait for: each runs
  # weekly, so a regression there could otherwise sit on main until the
  # morning after the tag. Cheap in work and the slowest calls here in wall
  # clock, which a release is the one place worth paying for
  macos:
    name: Run the macos workflow
    uses: ./.github/workflows/macos.yml

  windows:
    name: Run the windows workflow
    uses: ./.github/workflows/windows.yml

  build:
    name: Build the wheel and the sdist
    needs: version-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # caching off, for the reason given in the version-check job: this is
      # the job whose output is published
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      # what makes the wheel this job publishes reproducible: without it
      # setuptools stamps the zip entries with the mtimes of the checkout,
      # so the same commit built twice gives two digests and the
      # attestation below vouches for bytes nobody else can obtain. The
      # commit date, not the tag's: `git log -1` on a shallow clone reads
      # the tip, which is the commit the tag points at, and a lightweight
      # tag has no date of its own to prefer.
      # RELEASING.md has the command that rebuilds a released tag and
      # verifies it against the attestation
      - name: Pin the build timestamp to the commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
      # TestPyPI refuses a version it has already seen: the rehearsal
      # appends .dev<run*100+attempt>, unique per dispatch and per re-run
      # of one, and sorted before the release it rehearses (PEP 440).
      # A re-run keeps the run's own id and number and only raises
      # run_attempt, so .dev<run number> alone -- the previous shape of
      # this suffix -- was identical across every re-run of one dispatch
      # and collided with itself on TestPyPI the moment a rehearsal was
      # re-run rather than freshly dispatched. Multiplying the run number
      # by 100 and adding the attempt keeps both properties at once:
      # every attempt of every run is still unique, and, because the
      # attempt never reaches the run number's own place value, attempt 2
      # of run 7 (702) still sorts after every attempt of run 6 (600-699)
      # -- the ordering .dev<run><attempt> concatenation would have kept
      # only while the two numbers' digit counts happened to line up.
      # The two digits reserved for the attempt are checked, not assumed
      - name: Make the version unique for TestPyPI (rehearsal only)
        if: github.event_name == 'workflow_dispatch'
        # Python and tomllib, not sed: the value is parsed and only then
        # located in the text, because a regex for a version key on its own
        # line would find whichever table came first. The assignment is
        # rewritten whole, which leaves its spelling as the file had it.
        # The interpreter comes from uv, --no-project so that nothing is
        # installed and no lock is consulted: this job sets up no Python of
        # its own, and tomllib needs 3.11. 3.14 is what .python-version
        # pins, so this asks for a version uv has already fetched for the
        # other jobs rather than a second one
        run: |
          uv run --no-project --python 3.14 python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          run_number = int(os.environ["GITHUB_RUN_NUMBER"])
          run_attempt = int(os.environ["GITHUB_RUN_ATTEMPT"])
          if run_attempt > 99:
              msg = f"attempt {run_attempt} exceeds the two digits reserved for it"
              raise SystemExit(msg)

          path = Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          declared = tomllib.loads(text)["project"]["version"]
          match = re.search(rf'(?m)^version\s*=\s*"{re.escape(declared)}"\s*$', text)
          if match is None:
              msg = f"pyproject.toml declares {declared}, which is not a literal in it"
              raise SystemExit(msg)
          suffixed = declared + ".dev" + str(run_number * 100 + run_attempt)
          line = match.group().replace(declared, suffixed, 1)
          path.write_text(text[: match.start()] + line + text[match.end() :], encoding="utf-8")
          PY
          grep -m1 '^version' pyproject.toml
          # uv.lock carries the project version, so patching pyproject.toml
          # leaves the two disagreeing, and every uv command that passes
          # --locked -- which is all of them, by convention -- then fails
          # with "the lockfile needs to be updated". Measured: without this
          # re-lock, "uv run --locked --only-group check" on a patched tree
          # exits non-zero. This step now has three --locked consumers
          # downstream in this same job -- the twine, check-wheel-contents
          # and pyroma steps added for issue #1154 -- and the re-lock is
          # what keeps every one of them working.
          # The re-lock is also what makes the sdist coherent: it ships
          # uv.lock, which otherwise declared the unsuffixed version inside
          # a distribution named for the suffixed one
          uv lock
      # what a rehearsal does differently from a tag: test.yml's dist job,
      # called by this workflow's own `test` job above, validates the tree
      # as committed, while the twine/check-wheel-contents/pyroma steps
      # below run on the version this step just suffixed. Neither minds:
      # what the three judge is metadata syntax, README rendering, wheel
      # layout and metadata quality, none of which a .dev<N> suffix
      # changes. The smoke test further down is the one check that does
      # depend on the suffix -- it installs the wheel this job built,
      # suffix and all -- which is why it could never have been left to
      # test.yml's dist job and needed no plumbing to avoid it
      # uv build builds the sdist first and then the wheel from it, not
      # both from the source tree: the packaging path a user installing
      # from source takes is therefore the one that produced the wheel,
      # which is why no separate "install from the sdist" job is needed.
      # check-manifest stays out of this job: it is a pre-commit hook,
      # gated by the lint workflow, which this one also calls, and its
      # question is about the tree uv build reads rather than the files
      # this job goes on to publish
      - name: Build the distribution files
        run: uv build
      # SOURCE_DATE_EPOCH reaches every entry of the wheel and nothing at
      # all in the sdist: setuptools honours it in the wheel writer it
      # vendors and in no other place, so each member of the .tar.gz keeps
      # a clock -- the checkout's for a file, the build's for the directory
      # setuptools stages them in -- to sub-second precision, in a PAX
      # record whose length changes with it. The script rewrites member
      # metadata and no content, and its docstring has the measurement.
      # --no-project, so this runs on the interpreter uv already fetched
      # and installs nothing into the tree it is about to publish
      - name: Make the sdist reproducible too
        run: |
          uv run --no-project --python 3.14 \
            .github/scripts/normalize_sdist.py dist/
          sha256sum dist/*
      # what the packaging checks of the dist job do not look at: the
      # members of the two archives. They read metadata -- whether it is
      # valid, whether the long description renders, whether the
      # classifiers are the ones a package should declare -- and the
      # allowlist in the script is about what is *in* the files. It runs in
      # that job too, so a pull request is told before a tag is; here it
      # judges the files that get uploaded, which in a rehearsal are a
      # different version built from a re-locked tree.
      # After the normalizer rather than before: that rewrites member
      # metadata, and this reads member names
      - name: Check what the distribution files contain
        run: |
          uv run --no-project --python 3.14 \
            .github/scripts/verify_dist_contents.py dist/
      # and what nothing said at all: what the files contain, as a document
      # rather than as a check. The bill of materials is reproducible for
      # the reason the two steps above are -- SOURCE_DATE_EPOCH is its
      # timestamp and the two digests its serial number -- so a rebuild of
      # the tag writes this file too, and the attest job below signs it
      # beside the distribution files.
      # Into a directory of its own and not dist/: that directory is
      # uploaded as the artifact the publish jobs hand to an index, and an
      # index takes distribution files
      - name: Write the bill of materials
        run: |
          uv run --no-project --python 3.14 \
            .github/scripts/generate_sbom.py dist/ sbom/
      # before anything is installed, and that ordering is the point: the
      # step below runs third-party code -- a `.pth` file in a dependency
      # executes at interpreter startup, before the first import -- while
      # dist/ is a writable directory on the same runner. Uploading first
      # freezes what the publish jobs will download, so the worst a
      # compromised dependency can do here is fail the job, which stops
      # them: both name this one in `needs`
      - name: Upload the distribution files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
      # an artifact of its own, for the reason the step that writes it gives:
      # the two jobs that download `dist` hand every file in it to an index
      - name: Upload the bill of materials
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom/
      # the same three checks test.yml's dist job runs, and for the same
      # reason given there: a release is the one place where finding a
      # packaging problem is too late. They run in both places because
      # dist builds its own copy of the distribution files rather than
      # this job's -- issue #1154 -- so passing there was never a
      # guarantee about the files this job is about to publish; this is
      # the run that judges those files themselves. After the two uploads
      # above rather than between them and the build: each of the three is
      # a dependency this job has to install to run, and the comment on
      # the first upload above already freezes what the publish jobs will
      # download before anything is installed, a boundary these steps
      # keep rather than move
      - name: Check the metadata and the long description
        run: uv run --locked --only-group check twine check --strict dist/*
      - name: Check the wheel contents
        run: uv run --locked --only-group check check-wheel-contents dist/*.whl
      - name: Rate the packaging metadata
        run: uv run --locked --only-group check pyroma --min 10 dist/*.tar.gz
      # dist installs a wheel too, but not this one: it builds its own
      # copy, on another runner and -- in a rehearsal -- from another
      # version, the step above having patched pyproject.toml and
      # re-locked. What reaches an index is this artifact, so this one is
      # imported, from an empty directory so the import resolves to the
      # wheel and not to the btclib/ source tree.
      # Unconstrained, where dist pins the runtime dependencies to
      # uv.lock: no pull request waits on this job, so it can afford the
      # question a required check cannot -- whether the newest published
      # btclib_secp256k1 satisfies the wheel about to be published,
      # which is what a user installing it resolves. A release stopping
      # on that answer is the outcome wanted.
      # The assertions are dist's, and there for the same reasons:
      # metadata can be missing (issue #150), `import btclib` runs only
      # __init__.py and touches no binding, the extra can resolve to a
      # release this tree cannot import, and a bindings release can
      # install and still answer wrongly.
      # The serving assertion is what makes the resolution above a
      # question at all (issue #1117): a bindings release btclib fails
      # to import lands in `_libsecp256k1`'s `except ImportError`, and
      # the Python arithmetic then answers the version and the signature
      # correctly -- that arm being supported and tested is what
      # test.yml's `no-bindings` job exists for -- so without it this
      # step goes green on exactly the resolution it is asked about.
      # `is_libsecp256k1_serving` and not `INSTALLED`: serving is
      # installed and not refused, so it implies the other, and it is
      # the public reading of the seam every dispatch consults. It is
      # asserted before the signature because it is what gives that
      # signature its meaning -- verified by libsecp256k1 here rather
      # than by the Python arm it would otherwise silently be
      - name: Smoke-test the wheel, with its dependencies from PyPI
        run: |
          cd "$RUNNER_TEMP"
          # `set --` for the reason dist's copy of this states: the
          # positional parameters are sh, bash and zsh alike, where a
          # named array is 0-indexed in one and 1-indexed in another
          set -- "$GITHUB_WORKSPACE"/dist/*.whl
          uv run --isolated --no-project --with "$1[secp256k1]" \
            python -c "import btclib; \
              from btclib.curves import is_libsecp256k1_serving; \
              from btclib.ecc import dsa; \
              from btclib.to_pub_key import pub_keyinfo_from_prv_key; \
              print(btclib.__version__); \
              assert btclib.__version__ != 'unknown'; \
              assert is_libsecp256k1_serving(), \
                'the secp256k1 extra resolved, the bindings do not serve'; \
              assert dsa.verify(b'btclib', pub_keyinfo_from_prv_key(1)[0], \
                dsa.sign(b'btclib', 1))"

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [test, lint, docs, macos, windows, build]
    if: github.event_name == 'workflow_dispatch' && github.repository == 'btclib-org/btclib'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: testpypi
      url: https://test.pypi.org/project/btclib/
    permissions:
      # OIDC: this is what lets TestPyPI trust the workflow itself
      id-token: write
    steps:
      - name: Download the distribution files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      # generates PEP 740 attestations by default
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: [test, lint, docs, macos, windows, build]
    if: github.event_name == 'push' && github.repository == 'btclib-org/btclib'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # deployment gate: configure required reviewers on the "pypi"
    # environment to require a manual approval before publishing
    environment:
      name: pypi
      url: https://pypi.org/project/btclib/
    permissions:
      # OIDC: this is what lets PyPI trust the workflow itself
      id-token: write
    steps:
      - name: Download the distribution files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      # generates PEP 740 attestations by default
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # what RELEASING.md used to ask for by hand: the sentinel on what the
  # index serves, against the version this run just published. It waits for
  # the file to be served before installing, so it cannot pass by testing
  # the previous release, and it runs beside github-release rather than
  # before it -- a release announcing files that do not install is worse
  # than a release announced a minute later, but the announcement is not
  # what makes them installable
  published:
    name: Install the published version from PyPI
    needs: publish-pypi
    uses: ./.github/workflows/published.yml
    with:
      version: ${{ github.ref_name }}

  # the same files reach users by two routes and only one of them carries
  # provenance: the publish action above generates PEP 740 attestations for
  # the copies on the index, while the copies attached to the GitHub release
  # below carry nothing. This job signs them, and the digests are the
  # index's own, the dist artifact being downloaded here rather than
  # rebuilt. The bill of materials is signed with them, and for the same
  # reason: it is attached to that release too, so leaving it out would be
  # the gap this job exists to close, reopened for the one asset that says
  # what the others contain.
  # A job of its own rather than two more permissions on github-release:
  # this workflow elevates one job at a time, and the one that writes
  # releases has no reason to also hold an OIDC token. It is not in the
  # build job for the stronger form of the same reason -- that job runs the
  # build backend and installs the wheel it just built, and a token minted
  # there would be minted beside third-party code.
  # After a publish and not after the build, so that a run reaching here is
  # a run the environment approval already let through: without that, a
  # dispatch from any branch would sign whatever that branch built.
  # Whichever publish ran, though -- the rehearsal signs its own .dev files,
  # and that is the point of it: everything else in this job is a permission
  # and an API that would otherwise be exercised for the first time on
  # release day, where a failure lands after PyPI has the files and the tag
  # can no longer be moved
  attest:
    name: Attest the release assets
    needs: [publish-pypi, publish-testpypi]
    # always(), the other publish job being skipped rather than run, and a
    # skipped job is one `needs` treats as failed
    if: >-
      always() && (needs.publish-pypi.result == 'success' ||
      needs.publish-testpypi.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # OIDC for the short-lived Sigstore signing certificate, and the
      # write that persists the attestation against the repository
      id-token: write
      attestations: write
    steps:
      - name: Download the distribution files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      # into a directory of its own, as in the job below and for the same
      # reason: the dist/* glob has to stay the distribution files
      - name: Download the bill of materials
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: sbom/
      # actions/attest and not the attest-build-provenance wrapper around
      # it: as of v4 the wrapper is a composite that does nothing but call
      # this, and its own README sends new callers here. No predicate input
      # is what selects SLSA build provenance.
      # One attestation, every file: the statement carries every subject the
      # globs matched, so verifying the wheel, the sdist or the bill of
      # materials against the bundle below works
      - name: Attest the release assets
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*
            sbom/*
      # the bundle is the signed statement itself, and the job below
      # attaches it to the release: that is what lets `gh attestation verify
      # --bundle` read it from disk instead of from the attestations API,
      # for whoever mirrors the releases page rather than trusting it live.
      # Copied into the workspace rather than uploaded where the action left
      # it, under $RUNNER_TEMP: an upload takes its layout from the paths it
      # matched, and one outside the workspace is one more thing to be right
      # about than a fixed name here
      - name: Collect the attestation bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" attestation.jsonl
      - name: Upload the attestation bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: attestation
          path: attestation.jsonl

  # only after PyPI has accepted the files: a GitHub release announces what
  # users can already install. Both jobs in `needs` and not attest alone:
  # attest runs in a rehearsal too, so naming it by itself would cut a
  # release from a dispatch, where publish-pypi is skipped; asking below
  # for publish-pypi's success is what keeps this job to the tag. attest
  # earns its place in the list by producing the bundle attached here.
  # The `if` is spelled out, and it opens with always(), because the
  # absence of one does not mean "whatever my own needs did": a job with a
  # skipped job anywhere in its ancestry is force-skipped whatever its
  # condition says, unless that condition opens with a status function --
  # and attest's own always(), which is what lets attest run past the
  # skipped publish-testpypi, does not clear that skip for whoever needs
  # attest in turn. Every job crossing a skip has to opt out for itself.
  # Measured on v2026.8.21, the first tag with attest standing between
  # publish-pypi and here: both needs green, this job skipped in the same
  # second attest finished, the version on PyPI and no GitHub release cut
  # at all (issue #1142). That run was also failing an unrelated install
  # job (issue #1141), which looks like the cause and is not -- sibling
  # btclib-secp256k1 lost v0.8.0.2 to the same skip on a run with nothing
  # failing in it, and carries this exact condition as the fix.
  # A skip is neither a failure nor within that flag's blast radius, so
  # `gh run rerun --failed` does not recover it: it re-runs failed jobs
  # and their dependents, and this job is a dependent of neither -- tried
  # twice on the v2026.8.21 run, skipped both times. What does recover it
  # is RELEASING.md's other option, the release created by hand from the
  # run's own dist, sbom and attestation artifacts, with the distribution
  # files checked against the digests PyPI publishes before they are
  # attached
  github-release:
    name: Attach the files to the GitHub release
    needs: [publish-pypi, attest]
    if: >-
      always() && needs.publish-pypi.result == 'success' &&
      needs.attest.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # the one job that writes to the repository through its token, and
      # what it writes is a release; the attestation the job above signed
      # went to the attestations API under a permission of its own
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the distribution files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      # each into a directory of its own, so that the dist/* glob below
      # stays the distribution files and nothing else
      - name: Download the attestation bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: attestation
          path: attestation/
      - name: Download the bill of materials
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: sbom/
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # the release notes are the tag's own section of RELEASE_NOTES.md;
        # if the section is missing the release still happens, with
        # notes generated from the merged pull requests instead.
        # The fallback is the safety net for a tag pushed past a red
        # version-check, not the check itself: version-check has already
        # refused a tag whose RELEASE_NOTES.md heading carries anything
        # after the version -- "(work in progress, not released yet)"
        # matches the regex below and is not empty, so nothing here would
        # notice
        run: |
          awk -v tag="$GITHUB_REF_NAME" '
            $0 ~ "^## " tag "( |$)" {found=1; next}
            /^## / && found {exit}
            found {print}
          ' RELEASE_NOTES.md > "$RUNNER_TEMP/notes.md"
          # named for the tag only here, where the ref is one: nothing
          # inside the bundle says which release it belongs to, the way the
          # distribution files' own names do
          bundle="$GITHUB_REF_NAME.attestation.jsonl"
          cp attestation/attestation.jsonl "$bundle"
          # the bill of materials needs no renaming, unlike the bundle: it
          # carries the version in its own name, the distribution files
          # being where it took it from
          if [ -s "$RUNNER_TEMP/notes.md" ]; then
            gh release create "$GITHUB_REF_NAME" dist/* sbom/* "$bundle" \
              --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          else
            echo "::warning::RELEASE_NOTES.md has no $GITHUB_REF_NAME section"
            gh release create "$GITHUB_REF_NAME" dist/* sbom/* "$bundle" \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi

  # the sentinel on the documentation, which nothing was watching: read the
  # docs activates and builds a new release tag from an automation rule of
  # its own (REPOSITORY.md's "Read the Docs" section), and a build that
  # never starts fails nothing -- a site answering 200 serves the last build
  # that succeeded, for as long as that takes somebody to notice. Two
  # releases went out undocumented that way, which is issue #574.
  # The rendered URL and not the v3 API, which is the reverse of what
  # `published` above does with PyPI's: read the docs throttles an
  # unauthenticated caller to five requests a minute and warns that
  # requests from a cloud provider are blocked outright without a token, so
  # asking the API from a runner would mean storing a credential for a
  # check that gates nothing. /en/<tag>/ is CDN-served, answers 404 for a
  # version that is inactive or has no successful build, and is the URL a
  # reader follows anyway.
  # Release-only, a rehearsal never being tagged; after version-check, so a
  # tag it refuses produces one verdict and not two; and nothing needs it:
  # a late documentation build is not a reason to withhold a wheel, and the
  # fix for a red run here is a build on their side, not a moved tag
  documented:
    name: Check read the docs built the tag
    needs: version-check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for the tag's documentation to be served
        env:
          TAG: ${{ github.ref_name }}
        run: |
          url="https://btclib.readthedocs.io/en/${TAG}/"
          for attempt in $(seq 30); do
            if curl -sf --max-time 10 -o /dev/null "$url"; then
              echo "${url} is served"
              exit 0
            fi
            echo "attempt ${attempt}: ${url} is not served yet"
            sleep 30
          done
          echo "::error::${url} was never served: read the builds page on" \
            "https://app.readthedocs.org/projects/btclib/builds/"
          exit 1
