---
name: release

# one pipeline, two targets:
# - pushing a v<version> tag runs the full test matrix, builds and signs
#   the distribution files with btclib-org/.github's reusable-build.yml,
#   checks them, publishes them to PyPI, and turns the tag into a GitHub
#   release whose notes come from RELEASE_NOTES.md
# - workflow_dispatch is the rehearsal: the same pipeline from any
#   branch, publishing to TestPyPI under a unique .dev<N> version.
#   A rehearsal is never tagged
# Both indices trust this workflow directly (PyPI Trusted Publishing,
# see RELEASING.md): there is no API token to store or leak
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# never two runs of this workflow at once, and never a cancellation: the
# other workflows cancel a superseded run because their subject is the
# commit, and a newer commit supersedes the answer. Here the subject is a
# publication -- a version on an index, an attestation, a release -- so a
# second run is a second attempt at the same side effects, and cancelling one
# halfway is how a version reaches PyPI with no release cut for it.
# Named literally, as everywhere else: github.workflow in a called workflow
# is the caller's name, and this workflow is a caller
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # the tag ancestry check, the version comparison and the release-notes
  # retitling check are btclib-org/.github's, called at @main so a fix
  # there reaches this tree in one landing (section 10 of its README.md).
  # No tag-requires-day: this tree is calendar-versioned, which is the
  # reusable workflow's own default. version-suffix is this job's output,
  # unchanged in shape from when the step computing it lived here, and
  # `build` below forwards it under this job's own id
  # (btclib-org/.github#35)
  version-check:
    uses: btclib-org/.github/.github/workflows/reusable-version-check.yml@main

  # the griffe walk is btclib-org/.github's, called at @main so a fix
  # there reaches this tree in one landing (section 10 of its README.md).
  # package: btclib is this tree's own name, with no hyphen to turn into
  # an underscore -- the reusable workflow's own header says the equality
  # with the repository name is a coincidence of four trees and not a
  # rule, which is why the input has no default
  # (btclib-org/.github#35)
  public-api:
    uses: btclib-org/.github/.github/workflows/reusable-public-api.yml@main
    with:
      package: btclib

  # `uv audit` over what the wheel declares, before anything is published:
  # btclib-org/.github's reusable-audit.yml, called at @main so that the uv
  # version, the flags and what it refuses are written once. An
  # advisory or an unreachable service fails it, and the publish jobs
  # below name it in `needs:` and in their `if:`, `always()` there being
  # what would otherwise let them run past a red one. The callee asks only
  # for the `contents: read` this workflow grants, as the calls above do.
  # github-release does not name it: it runs only after publish-pypi
  # succeeds
  audit:
    uses: btclib-org/.github/.github/workflows/reusable-audit.yml@main

  # the build and its signature: btclib-org/.github's reusable-build.yml,
  # called at @main (section 10 of its README.md). It builds the
  # distribution files and the bill of materials, uploads them as `dist`
  # and `sbom`, and signs them before any publish job waits for its
  # environment's approval, which is how the signer is a workflow this
  # tree's own steps cannot alter (SLSA Build L3). It uploads the bundle
  # as `attestation` for github-release. The version-suffix output is
  # empty on the tag path, where version-check skips the step that writes
  # it: a release ships the version the tree declares
  build:
    name: Build and sign the distribution files
    needs: version-check
    # a called workflow's own permissions: block can only downgrade what
    # this job grants, never restore an omitted scope (btclib-org/.github#912),
    # so every scope the callee declares is named here: contents: read at
    # its workflow level, the two writes on its attest job
    permissions:
      contents: read
      id-token: write # the OIDC token the callee's attest job mints
      attestations: write # the build provenance attestation it writes
    uses: btclib-org/.github/.github/workflows/reusable-build.yml@main
    with:
      python: "3.15"
      version-suffix: ${{ needs.version-check.outputs.version-suffix }}

  # the whole build/test matrix, exactly as a pull request runs it:
  # test.yml's `dist` job checks the files the build job uploaded, and its
  # other jobs read the tree
  test:
    name: Run the test workflow
    needs: [version-check, build]
    uses: ./.github/workflows/test.yml # zizmor: ignore[self-repository]
    # this block bounds test.yml rather than standing in for what test.yml
    # declares: a job over there with no block of its own is granted
    # test.yml's own top-level contents: read and not the pull-requests:
    # read granted here. The bound refuses rather than trims, so this
    # workflow's contents: read alone would leave test.yml's `changes`
    # job, which asks for `pull-requests: read` so its own call to
    # `btclib-org/.github`'s `reusable-changes.yml` can list a pull
    # request's files, refused before a single job starts, version-check
    # included -- `changes` never actually reads a file list on a release,
    # answering code=true unconditionally off anything that is not a
    # pull_request event, but the check is against what the job declares,
    # not against what it goes on to do. contents: read is repeated rather
    # than left to test.yml's own default to keep that top-level
    # declaration inside this list: what a run does where a called
    # workflow's top-level declaration falls outside the caller's list is
    # not measured, and the refusal above is not evidence for it
    # (btclib-org/.github#912)
    permissions:
      contents: read
      pull-requests: read # so test.yml's changes job can list a pull request's files
    with:
      # what keeps this run out of the branch concurrency groups: see the
      # group in test.yml
      concurrency-suffix: "-release"
      # only this call sets it: see the input's own description in
      # test.yml
      check-newest-bindings: true
      # the files the dist job checks are the ones the build job signed
      use-signed-dist: true

  # and the same checks a pull request lints with: without this, a tag
  # push could publish code the pre-commit hooks reject. Not gated on
  # version-check: this is the cheap one, and it runs in parallel with it
  lint:
    name: Run the lint workflow
    uses: ./.github/workflows/lint.yml # zizmor: ignore[self-repository]
    with:
      # see the test job above
      concurrency-suffix: "-release"

  # and the documentation build, for the reason the lint call above gives: a
  # tag publishes the docstrings read the docs will render from it, so the
  # build that would fail there fails here first. It has a workflow of its
  # own now, so calling lint.yml no longer covers it
  docs:
    name: Run the docs workflow
    uses: ./.github/workflows/docs.yml # zizmor: ignore[self-repository]
    with:
      # a rehearsal computes the same group a push to the dispatching
      # branch holds otherwise: see the group in docs.yml
      # (issue btclib-org/.github#1083)
      concurrency-suffix: "-release"

  # and the three platform sweeps, which between them are every image
  # and every interpreter this package claims: the gate runs one cell of
  # os-ubuntu.yml's matrix and each of these runs its own whole, weekly, so
  # a regression outside that cell could otherwise sit on main until the
  # morning after the tag. Cheap in work and the slowest calls here in
  # wall clock, which a release is the one place worth paying for
  os-ubuntu:
    name: Run the os-ubuntu workflow
    uses: ./.github/workflows/os-ubuntu.yml # zizmor: ignore[self-repository]
    with:
      # see the docs job above
      concurrency-suffix: "-release"

  os-macos:
    name: Run the os-macos workflow
    uses: ./.github/workflows/os-macos.yml # zizmor: ignore[self-repository]
    with:
      # see the docs job above
      concurrency-suffix: "-release"

  os-windows:
    name: Run the os-windows workflow
    uses: ./.github/workflows/os-windows.yml # zizmor: ignore[self-repository]
    with:
      # see the docs job above
      concurrency-suffix: "-release"

  # and the one required check on main this workflow was not asking for.
  # `regtest / Regtest against Bitcoin Core` gates every merge, which is
  # why it was left out and why leaving it out was wrong: a rehearsal is
  # dispatched from a branch, and a tag is pushed at a commit whose merge
  # that check answered for -- but the calls to test.yml, lint.yml and
  # docs.yml are every one of them a required check too, made again here
  # for exactly that reason. integration-bitcoind.yml declared
  # `workflow_call` for this from the day it became a gate; nothing had
  # ever called it
  integration-bitcoind:
    name: Run the integration-bitcoind workflow
    uses: ./.github/workflows/integration-bitcoind.yml # zizmor: ignore[self-repository]
    with:
      # see the docs job above
      concurrency-suffix: "-release"

  publish-testpypi:
    name: Publish to TestPyPI
    # public-api stays a need for ordering -- what it orders is this
    # job, which does not start until the surface has been read -- but
    # not for its result: that job's own comment calls it deliberately
    # not a merge gate, and `needs` without `always()` gates on every
    # listed job regardless, a skipped job counting as failed the same
    # as this run's own comment on the line below already says of
    # publish-pypi. Measured on run 33008687408: public-api exited 1 on
    # the widening every Octets-taking alias got this cycle, and
    # publish-testpypi never started, so the testpypi environment
    # review never fired (issue #1461)
    needs:
      [
        public-api,
        audit,
        test,
        lint,
        docs,
        os-ubuntu,
        os-macos,
        os-windows,
        integration-bitcoind,
      ]
    if: >-
      always() && github.event_name == 'workflow_dispatch' &&
      github.repository == 'btclib-org/btclib' &&
      needs.test.result == 'success' && needs.lint.result == 'success' &&
      needs.docs.result == 'success' &&
      needs.os-ubuntu.result == 'success' &&
      needs.os-macos.result == 'success' &&
      needs.os-windows.result == 'success' &&
      needs.integration-bitcoind.result == 'success' &&
      needs.audit.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: testpypi
      url: https://test.pypi.org/project/btclib/
    permissions:
      id-token: write # OIDC: this is what lets TestPyPI trust the workflow itself
    steps:
      - name: Download the distribution files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      # generates PEP 740 attestations by default
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    # See publish-testpypi's own comment: public-api stays a need for
    # ordering, not for its result, the same issue applying to a tag
    # push as to a rehearsal
    needs:
      [
        public-api,
        audit,
        test,
        lint,
        docs,
        os-ubuntu,
        os-macos,
        os-windows,
        integration-bitcoind,
      ]
    if: >-
      always() && github.event_name == 'push' &&
      github.repository == 'btclib-org/btclib' &&
      needs.test.result == 'success' && needs.lint.result == 'success' &&
      needs.docs.result == 'success' &&
      needs.os-ubuntu.result == 'success' &&
      needs.os-macos.result == 'success' &&
      needs.os-windows.result == 'success' &&
      needs.integration-bitcoind.result == 'success' &&
      needs.audit.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # deployment gate: configure required reviewers on the "pypi"
    # environment to require a manual approval before publishing
    environment:
      name: pypi
      url: https://pypi.org/project/btclib/
    permissions:
      id-token: write # OIDC: this is what lets PyPI trust the workflow itself
    steps:
      - name: Download the distribution files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      # generates PEP 740 attestations by default
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # what RELEASING.md used to ask for by hand: the sentinel on what the
  # index serves, against the version this run just published. It waits for
  # the file to be served before installing, so it cannot pass by testing
  # the previous release, and it runs beside github-release rather than
  # before it -- a release announcing files that do not install is worse
  # than a release announced a minute later, but the announcement is not
  # what makes them installable
  pypi-install:
    name: Run the pypi-install workflow
    needs: publish-pypi
    # publish-pypi's own always() opts it back in past public-api's
    # designed failure, but does not carry this job with it: a bare
    # needs: here still reads back through publish-pypi's own needs:,
    # public-api two hops away skipping this job even though its one
    # listed dependency succeeded. Measured on the v2026.8.26 tag: this
    # sentinel never ran on v2026.8.27, and #1461's fix to publish-pypi
    # itself was not enough (issue #1470)
    if: always() && needs.publish-pypi.result == 'success'
    uses: ./.github/workflows/pypi-install.yml # zizmor: ignore[self-repository]
    with:
      version: ${{ github.ref_name }}

  # only after PyPI has accepted the files: a GitHub release announces what
  # users can already install. Both jobs in `needs` and not build alone:
  # build runs in a rehearsal too, so naming it by itself would cut a
  # release from a dispatch, where publish-pypi is skipped; asking below
  # for publish-pypi's success is what keeps this job to the tag. build
  # earns its place in the list by producing the bundle attached here.
  # The `if` is spelled out, and it opens with always(), because the
  # absence of one does not mean "whatever my own needs did": a job with a
  # skipped job anywhere in its ancestry is force-skipped whatever its
  # condition says, unless that condition opens with a status function.
  # Without it both needs can be green and this job skipped, the version on
  # PyPI and no GitHub release cut at all (issue #1142). A skip is neither
  # a failure nor within that flag's blast radius, so
  # `gh run rerun --failed` does not recover it. What does recover it
  # is RELEASING.md's other option, the release created by hand from the
  # run's own dist, sbom and attestation artifacts, with the distribution
  # files checked against the digests PyPI publishes before they are
  # attached.
  # The release itself is btclib-org/.github's, called at @main so a fix
  # there reaches this tree in one landing (section 10 of its README.md).
  # A called workflow's own permissions: block can only downgrade what
  # this job grants, never restore an omitted scope -- measured twice in
  # btclib-org/.github#912 -- so the one scope the callee's own job asks
  # for is named here
  # (btclib-org/.github#35)
  github-release:
    needs: [publish-pypi, build]
    if: >-
      always() && needs.publish-pypi.result == 'success' &&
      needs.build.result == 'success'
    permissions:
      contents: write # creates the GitHub release reusable-github-release.yml attaches files to
    uses: btclib-org/.github/.github/workflows/reusable-github-release.yml@main
    with:
      dist-artifact: dist

  # the wait for read the docs to build the tag is btclib-org/.github's,
  # called at @main so a fix there reaches this tree in one landing
  # (section 10 of its README.md). readthedocs-slug: btclib matches what
  # this job passed to wait_for_readthedocs_build.py before the move.
  # needs: version-check and the release-only if: stay the caller's, as
  # the reusable workflow's own header says
  # (btclib-org/.github#35)
  documented:
    needs: version-check
    if: github.event_name == 'push'
    uses: btclib-org/.github/.github/workflows/reusable-documented.yml@main
    with:
      readthedocs-slug: btclib
