---
name: deps-latest

# the dependency sentinel: everything uv resolves, upgraded to the newest
# release that satisfies pyproject.toml, and then put through the suite,
# the lint gate and the packaging checks.
#
# Nothing else covers this. The dependency groups declare no version at
# all, so the whole drift of pytest, mypy, coverage and twine lives in
# uv.lock, and every command in every other workflow passes --locked: what
# CI runs is the resolution someone locked, not the one PyPI holds today.
# uv.lock moves on a weekly dependabot pull request. A break upstream
# therefore surfaces a week or more later, inside a pull request that has
# to be reviewed anyway, and its cause is one entry in a diff of many.
# btclib-secp256k1 is the entry that matters most here: a release of
# the bindings is a release in another repository, which nothing in this
# one has to change for the pair to stop working. suite-bindings-latest
# below asks about that one entry alone, precisely, rather than folding
# it into suite-latest's broader upgrade -- see that job for why.
#
# The obvious alternative, dropping --locked from test.yml and resolving
# afresh on every run, is what this workflow exists instead of: a pull
# request would go red for a release in somebody else's repository, with
# main's required checks in front of it, and the contributor
# holding the branch cannot fix any of it. pytest runs with
# filterwarnings = ["error"] and coverage with a fail_under ratchet, so
# the ways an upstream release turns this tree red without touching it are
# not hypothetical. Determinism is what makes the gate legible; the early
# warning belongs on a schedule, off the critical path.
#
# Scope: what uv resolves. Not the pre-commit hook revisions, which are
# pinned in .pre-commit-config.yaml and bumped by pre-commit.ci's weekly
# pull request -- that pull request runs the whole matrix, so ruff and the
# other pinned hooks already have their sentinel. mypy is the exception
# and the reason the lint job below is here at all: its hook is local and
# shells out to uv, so it is the lock that pins it. Not sphinx: docs.yml
# already builds the docs, with --locked, on every pull request, so a
# broken build surfaces there, not here. What it builds
# against is the same lock this workflow exists to get ahead of, so a
# sphinx break in the newest releases is the one gap this file leaves
# open too, same as everywhere else in it.
#
# Nothing here gates anything, by construction: a separate workflow, with
# no aggregate job, named by no branch protection rule. That is the point.
# This job is expected to go red for reasons no pull request introduced,
# and a red check that nobody can act on from a branch is noise.
# It opens no issue on failure either, which would cost issues: write in a
# job that needs nothing but read; a failed scheduled run notifies the
# last person to have touched the cron below, and that is the signal

on:
  schedule:
    # Wednesday, the day before Dependabot's, which is the whole point of
    # the placement: this reports on the upgrade before the pull request
    # carrying it opens. pypi-install.yml follows an hour later, the pair
    # asking what moved underneath -- the dependencies here, and what the
    # index serves there.
    # The time is section 10's grid in btclib-org/.github and not this
    # file's to restate.
    # Only the default branch schedules workflows, so on any other branch
    # this is reachable through the dispatch below alone
    - cron: "4 4 * * 3"
  workflow_dispatch:

# least privilege for the GITHUB_TOKEN: everything running in a job
# (actions, dependencies, build scripts) can read the token, so it must
# not be able to write to the repository
permissions:
  contents: read

# named literally rather than with github.workflow: nothing calls this
# workflow today, but that expression is the caller's name when something
# does, and the convention is what keeps the groups distinct
concurrency:
  group: deps-latest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # narrower than the test matrix, and for a different reason: there,
  # every (os, arch, interpreter) triple selects a different wheel of the
  # bindings; here what varies is which release of each dependency the
  # interpreter resolves to, and the two ends of the supported range are
  # what a sentinel needs. The low end earns its place: a
  # dependency dropping 3.10 does not fail to resolve, it resolves to an
  # older version there and keeps the job green while 3.10 quietly stops
  # being tested against what everybody else runs. That is not a
  # hypothetical: 3.9 left the floor resolving 35 of the 132 locked
  # packages to older versions
  suite-latest:
    name: "Run the suite on ${{ matrix.python }}, ${{ matrix.os }}, dependencies at latest"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.14"]
    # far above what a run of the suite needs, the resolution the upgrade
    # below performs included: what it bounds is a hung job
    timeout-minutes: 30
    steps:
      # every action is pinned to a commit SHA, the tag in the comment: a
      # tag, let alone a branch, is a name its owner can move, and these
      # run in a job that can read the workflow token
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # see the checkout of the coverage job in test.yml
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # a week where nothing moved is a full hit, and a week where
          # something did is the week this job has work to do anyway
          enable-cache: true
          python-version: ${{ matrix.python }}
      # --upgrade re-resolves every entry, btclib-secp256k1 included:
      # this is what carries the bindings to their newest release, which
      # nothing else off a pull request does.
      # It prints one "Update <pkg> vA -> vB" line per package it moves,
      # so the log names the suspects without a diff of uv.lock; a run
      # that moved nothing says so, and its green means nothing new.
      # This rewrites uv.lock, harmless on an ephemeral checkout and worth
      # knowing before running the same command in a working tree
      - name: Upgrade every dependency to its latest release
        # this matrix includes windows-latest, whose default shell is
        # PowerShell rather than bash -- see os-windows.yml's suite-windows
        # job for the failure mode a POSIX-only step hits there unnoticed
        # (issue #1148). This step and the pytest step below happen not to
        # use any POSIX-only syntax today, which is exactly the hazard: a
        # future edit that does would go green on this cell having run
        # nothing
        shell: bash
        run: uv lock --upgrade
      # still --locked, which is not a contradiction: the step above just
      # wrote that lock, so this asserts nothing moved between the two and
      # keeps the convention that no uv command in these workflows
      # installs from a lock it has not checked.
      # No "assert the bindings are serving" in front of it, which
      # suite-bindings-latest below does have (issue #1136), and the
      # difference is what these two jobs are for. There the bindings are
      # the only thing that moved, so they are the answer and stopping on
      # them costs nothing; here everything moved, so they are one
      # suspect among the dozen this job exists to net, and an assertion
      # ahead of pytest would trade the list of failures that names the
      # others for one line about the one the job below already asks
      # precisely, on this same matrix, from this same newest release.
      # The case the two answers differ in is a package moving *under*
      # the bindings and breaking their import while the bindings
      # themselves are fine -- and there the upgrade step above has
      # already printed the "Update <pkg> vA -> vB" line the assertion
      # would not have named
      - name: Run pytest
        shell: bash
        run: uv run --locked --no-default-groups --group test pytest

  # narrower than suite-latest above, and for a different reason: that
  # job upgrades every dependency, so a red run there buries a release
  # of btclib-secp256k1 behind a dozen other candidates. This
  # upgrades only that one, so a red run here names it without a
  # bisect -- worth a job of its own because it is a sibling project
  # under the same org, released by the same maintainer, which makes
  # "did my own other release just break this one" a distinct and
  # likely enough question to ask separately from "did some
  # third-party wheel". Moved here from pypi-install.yml (issue #397): it
  # is a question about drift against a tree not yet published, which
  # belongs before publication rather than after
  suite-bindings-latest:
    name: >-
      Run the suite on ${{ matrix.python }}, ${{ matrix.os }}, bindings at latest
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.14"]
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      # upgrades one entry rather than every one of them, which is the
      # whole difference from suite-latest above: it prints "Update
      # btclib-secp256k1 vA -> vB" when a release moved it and
      # nothing when it did not, so the log names the suspect without a
      # diff of uv.lock. Harmless on an ephemeral checkout; worth
      # knowing before running the same command in a working tree
      - name: Upgrade the bindings to their latest release
        # this matrix includes windows-latest; see suite-latest above and
        # os-windows.yml's suite-windows job (issue #1148)
        shell: bash
        run: uv lock --upgrade-package btclib-secp256k1
      # test.yml's no-bindings job, with the sense reversed, and here for
      # the mirror image of its reason: asked before the suite, and asked
      # of the interpreter rather than of the resolver, because the step
      # above resolves and installs whatever the newest release is
      # whether or not this tree can import it. `btclib._libsecp256k1`
      # imports the whole surface in one `try` whose `except ImportError`
      # sets `INSTALLED = False`, so a release missing one name of it --
      # issue #1116, where the name was `musig` -- leaves the suite below
      # answering on the Python arithmetic, tests/conftest.py's
      # `pytest_collection_modifyitems` skipping every `bindings`-marked
      # test, and the run answering the one question this job exists to
      # ask as a coverage shortfall against the 100% ratchet -- the whole
      # bindings half of the suite having skipped itself. Reproduce it
      # with the bindings out of reach and read what it says:
      #
      #   UV_PROJECT_ENVIRONMENT=.venv-nobind uv run --locked \
      #       --no-default-groups --group harness pytest
      #
      # Red, so nothing shipped on it, but only by accident and saying
      # nothing -- and RELEASING.md reads this workflow per job, where a
      # coverage shortfall is the shape of "a dependency moved and this
      # tree has not caught up", which does not block a release, while
      # what happened is the one shape that does (issue #1136).
      # The ratchet is not what is wrong and is deliberately untouched:
      # it measures a suite that really did skip those tests, and
      # lowering it would turn this failure green. What was missing is a
      # step in front of it that says which suite ran.
      # `is_libsecp256k1_serving` and not `INSTALLED`: serving is
      # installed and not refused, so it implies the other, and it is the
      # public reading of the seam every dispatch consults -- the name
      # the wheel smoke tests assert (issue #1117) and the one
      # `no-bindings` and py-arm-authority.yml assert the negative
      # of. Nothing here sets BTCLIB_NO_LIBSECP256K1, so refusal is not
      # reachable and False leaves only the import, which is what the
      # message says rather than the generic sentence those two carry
      - name: Assert the bindings are serving
        # see suite-latest above; this one folds a python -c onto the uv
        # invocation, closer to the shape of ISS #1141's original defect
        shell: bash
        run: >
          uv run --locked --no-default-groups --group test
          python -c "from btclib.curves import is_libsecp256k1_serving;
          assert is_libsecp256k1_serving(),
          'the newest btclib_secp256k1 does not import'"
      - name: Run pytest
        shell: bash
        run: uv run --locked --no-default-groups --group test pytest

  # mypy is the whole reason this job exists, and it is worth being
  # explicit about how little else differs from the lint gate: the hooks
  # pinned by rev in .pre-commit-config.yaml are the same ones a commit
  # runs, because pre-commit.ci bumps those and this cannot. What the
  # upgrade reaches is pre-commit itself and, through the local hook that
  # shells out to uv, mypy -- the tool whose new release adds a check the
  # existing code base fails, on a schedule of its own
  lint-latest:
    name: Lint and type-check, dependencies at latest
    runs-on: ubuntu-latest
    # nothing here takes minutes; a job that does is hung
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      # ImageOS is set by the runner image, not by this workflow, so the
      # env context holds nothing for it and a shell is where it is read.
      # lint.yml's step of this name carries the rest of that reasoning,
      # ImageVersion included
      - name: Identify the runner image
        id: image
        run: echo "os=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"
      # the hook environments are the slow part and the upgrade below does
      # not touch them, which is why they are cached here at all.
      # The key carries the runner image and the interpreter as well as the
      # config hash because what is cached is virtualenvs: on the config
      # hash alone an ubuntu-latest rotation is not a graceful miss but a
      # hit, handing the job environments built on the previous image. This
      # is the job that can least afford one -- it runs to report what a
      # new release of a dependency breaks, so a failure the cache caused
      # is read as the thing this workflow was watching for and chased in
      # the tree instead.
      # That is the key lint.yml uses, deliberately rather than by
      # coincidence, and
      #   git grep -n 'pre-commit-\${{' -- .github/workflows/
      # is what re-reads the two together: they are meant to agree
      - name: Cache the pre-commit hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: >-
            pre-commit-${{ runner.os }}-${{ steps.image.outputs.os }}-${{
            hashFiles('.pre-commit-config.yaml', '.python-version') }}
          # a prefix that still names the image, so a partial restore
          # cannot cross an image boundary either
          restore-keys: |
            pre-commit-${{ runner.os }}-${{ steps.image.outputs.os }}-
      - name: Upgrade every dependency to its latest release
        run: uv lock --upgrade
      # --all-files, so pre-commit does not stash the rewritten uv.lock:
      # it stashes unstaged changes only when it was given neither
      # --all-files nor --files, and a stash here would hand the mypy hook
      # back the committed lock and quietly type check the pinned mypy,
      # which is the one thing this job is for
      - name: Run the pre-commit hooks
        run: >
          uv run --locked --only-group lint
          pre-commit run --all-files --show-diff-on-failure

  # the check group, for the same reason the packaging checks live in
  # test.yml rather than in the release workflow: a release is the one place
  # where finding a problem is too late, a version being consumed by the
  # upload that carries it. twine, check-wheel-contents and pyroma are
  # pinned by uv.lock like everything else, and a new pyroma with a
  # stricter rating would fail --min 10 for the first time on a tag
  dist-latest:
    name: Build the distribution and inspect it, dependencies at latest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Upgrade every dependency to its latest release
        run: uv lock --upgrade
      # the build backend is uv's own, packaged inside the uv binary and
      # resolved from neither uv.lock nor the index, so this step builds
      # with whatever backend the installed uv carries whether or not the
      # one above ran. pyproject.toml bounds it on both sides, which is
      # what makes "what does the sdist hold" a question with one answer;
      # a uv older than that floor falls back to resolving uv_build from
      # the index instead
      - name: Build the distribution files
        run: uv build
      - name: Check the metadata and the long description
        run: uv run --locked --only-group check twine check --strict dist/*
      - name: Check the wheel contents
        run: uv run --locked --only-group check check-wheel-contents dist/*.whl
      - name: Rate the packaging metadata
        run: uv run --locked --only-group check pyroma --min 10 dist/*.tar.gz
