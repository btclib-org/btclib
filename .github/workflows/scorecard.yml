---
name: scorecard

# OpenSSF Scorecard: a third-party, external audit of this repository's
# supply-chain posture, run independently rather than by anything this
# organization asked itself. btclib-org/.github#339 is where this
# sentinel and its permissions were decided; the analysis job itself --
# its checkout, the scan, the artifact and the SARIF upload, permissions
# included -- is btclib-org/.github's reusable-scorecard.yml, called at
# @main so a fix there reaches this tree in one landing
# (btclib-org/.github#35). What stays here is the trigger, the cron
# minute, the workflow-level permissions and the concurrency group,
# which the callee does not carry and says so in its own header.
#
# This repository is public and is not a fork, which is the property
# section 10 of the standard keys the sentinel on:
#
#   gh api repos/btclib-org/btclib --jq '.fork, .private'
#
# answers `false` and `false`.

on:
  push:
    # only the default branch is analysed -- ossf/scorecard-action's own
    # README names this and schedule as the supported triggers and calls
    # workflow_dispatch experimental, so unlike every other workflow here
    # this one carries no dispatch and no pull_request: its triggers are
    # the action's, not section 10's general rule
    branches: [main]
  schedule:
    # Section 10's calendar, decided by btclib-org/.github#363 and landed
    # via btclib-org/.github#382; the minute is this repository's own row
    # in the same table.
    # The time is section 10's grid in btclib-org/.github and not this
    # file's to restate.
    # The push trigger above already runs the analysis on every push to
    # main, which is what feeds the badge and the published score between
    # scheduled runs; this covers what push cannot -- a week with none.
    - cron: "4 5 * * 0"

# least privilege for the GITHUB_TOKEN at the workflow level, elevated
# on the calling job below -- each grant explained at its own line
# there -- and pushes nothing back to the tree.
permissions:
  contents: read

concurrency:
  # named literally, never through github.workflow. A run with no pull
  # request -- every run of this workflow, since it carries none -- has
  # no number and groups by github.ref, which is refs/heads/main for the
  # one trigger this workflow has, so two pushes in quick succession
  # supersede each other -- wanted, since they ask the same question of
  # the same tree
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    uses: btclib-org/.github/.github/workflows/reusable-scorecard.yml@main
    # a called workflow's own permissions: block can only downgrade, not
    # restore, what this calling job grants -- GitHub's own docs on
    # reusing workflow configurations -- so every scope the callee's job
    # asks for is named here too, or the run fails before any job starts
    # (a startup_failure, README.md section 11's "the bound refuses
    # rather than trims", measured in btclib-org/.github#912)
    permissions:
      id-token: write # the OpenSSF transparency log publish
      security-events: write # the SARIF upload
      contents: read
      actions: read # the Packaging check's workflow-run history read
