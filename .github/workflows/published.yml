---
name: published

# checks whether what is already on PyPI actually works, not merely
# installs -- which no pull request asks, checking out the tree it is
# testing being the whole point of one. No checkout here either, on
# purpose: nothing from this repository takes part, which is what
# guarantees the checks below resolve to what was installed from the
# index and not to a source tree.
#
# `import btclib` runs __init__.py alone, and the data files under
# btclib/ -- `git ls-files | grep '^btclib/.*_data/'` is which, the BIP39
# wordlists among them -- are opened by path at the first call that needs
# one, not imported, so a wheel missing one of them installs cleanly,
# imports cleanly, and only fails there. test.yml's dist job shares that
# blind spot with its own smoke test; this workflow's second check is the
# one that does not have it.
#
# Version-independent on purpose, checking a BIP39 vector and a BIP340
# one whose values are fixed forever, so neither needs an edit after a
# release the way a version-pinned assertion would.
#
# A schedule this quiet is also the one GitHub itself might stop
# firing: it suspends a workflow's cron trigger after sixty days
# without repository activity, and says so only by email. That is
# exactly the interval this sentinel exists to cover, so a silence
# from it is worth a look at the Actions tab before it is read as
# green.
#
# What this is not: a sentinel for whether the newest btclib_secp256k1
# breaks this tree. That question -- issue #397 -- belongs to latest.yml's
# suite-bindings-latest job instead: it is about drift against a tree not
# yet published, asked before publication rather than after, and asking
# it here would be asking it one step too late to matter to what gets
# published next
#
# Two jobs, not one job asking both questions or one matrix carrying an
# extra axis, because they are entitled to different answers.
# install-published names no extra, so it is answering whether the
# supported no-bindings configuration -- issues #990, #991 and #992 --
# installs and works; it has not asked the index for the bindings and
# cannot ask whether they serve. install-published-secp256k1 names the
# extra a user who wants the bindings actually types, and is the one this
# workflow lacked until issue #1143: `btclib/_libsecp256k1.py` answers a
# resolution it cannot import with `INSTALLED = False`, no error and no
# warning, so a pair broken on the index degrades silently to the Python
# arithmetic -- tens of times slower, not constant-time -- rather than
# failing here. An axis over the base matrix would ask that question on
# every (os, python) cell the no-bindings question already uses; a job of
# its own asks it on the cells that actually vary for it instead, which
# is argued where that job's own matrix is

on:
  schedule:
    # The first of the month, at a minute that is not the hour: everything
    # scheduled on the hour queues together, and a run that waits is a run
    # whose failure is noticed later. Monthly and not weekly because the
    # subject does not change: an already-released artifact is fixed, and
    # what can move under it -- a new interpreter, an index serving a file
    # that does not match its own hash -- moves on nobody's week. The one
    # moment the answer can change is a release, and that is a call from
    # release.yml rather than a day on the calendar.
    # Only the default branch schedules workflows, so on any other branch
    # this is reachable through the dispatch below alone
    - cron: "31 4 1 * *"
  # after a release, which is the one moment this workflow's answer can
  # change: a call does not forget, where RELEASING.md's step is a verdict
  # to read. Called by release.yml rather than triggered by
  # workflow_run, which zizmor rates a dangerous trigger and rightly -- it
  # runs the default branch's copy with the token of a push nobody reviewed
  # -- where a call runs inside the release that gated it. The caller passes
  # the tag, and only the caller does: the monthly run and a dispatch have
  # no particular version in mind, which is the point of them
  workflow_call:
    inputs:
      version:
        description: >-
          the tag whose version the index must serve before the matrix
          installs anything, empty on a run with no release behind it
        required: false
        type: string
        default: ""
  workflow_dispatch:

# least privilege for the GITHUB_TOKEN: everything running in a job
# (actions, dependencies) can read the token, so it must not be able to
# write to the repository
permissions:
  contents: read

# never cancel a sentinel: a scheduled run and a dispatched one are both
# samples worth keeping, and neither supersedes the other. A concurrent
# run queues instead
concurrency:
  group: published-${{ github.ref }}
  cancel-in-progress: false

jobs:
  install-published:
    name: >-
      ${{ matrix.no-binary && 'Build' || 'Install' }}
      ${{ matrix.python }} from PyPI on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-26-intel
          - macos-latest
          - windows-latest
          - windows-11-arm
        # the two ends of the supported range, plus the free-threaded
        # interpreter: btclib itself ships one universal wheel, so what
        # varies across the base matrix is entirely which wheel of
        # btclib_secp256k1 each cell resolves to
        python: ["3.10", "3.14", "3.14t"]
        include:
          # the one cell where the sdist is what gets built, not merely
          # what a missing wheel would silently fall back to: btclib ships
          # data files opened by path rather than imported (see the
          # header), and a wheel built from an sdist that lost one of them
          # installs and imports cleanly, failing only at the BIP39 check
          # below. No wheel-only cell can see that kind of drift -- the
          # risk is MANIFEST.in or [tool.setuptools] listing what ships,
          # not a build failure -- and btclib was the only one of the
          # three publishing repositories with no cell that exercised it
          # (issue #1153). A single extra cell rather than a second axis
          # over the base matrix: a `["", "--no-binary"]` axis would
          # multiply the base matrix to watch the sdist path on every os
          # and python, sampling a risk that does not vary by platform or
          # interpreter, being the same sdist everywhere. Pure Python, so
          # nothing here compiles -- measured by hand against the
          # published 2026.8.21, this is a packaging step and nothing
          # more, unlike btclib_secp256k1's own sdist cell, which compiles
          # a C library. Python 3.13 rather than a version already in the
          # base matrix, so this adds a job rather than a property to an
          # existing one
          - os: ubuntu-latest
            python: "3.13"
            no-binary: true
    timeout-minutes: 20
    steps:
      # every run step below declares `shell: bash`, and the matrix is why:
      # the default shell on a Windows runner is PowerShell, which parses
      # none of this. The wait step went in without the line (issue #1141)
      # and took every Windows cell of v2026.8.21's release run with it --
      # "Missing opening '(' after keyword 'for'" -- having never run
      # before that tag, the release path being the only one that reaches
      # it. A step whose script happens to be a couple of plain commands
      # survives PowerShell unchanged, which is what makes an omission
      # invisible on review; declaring it on every step is what makes the
      # absence of one visible instead. Both siblings' copies of this file
      # already do
      #
      # the index does not serve a new file the instant the upload returns,
      # and this workflow installs whatever the resolver picks: a run that
      # starts too early tests the *previous* version and reports a pass for
      # it, which is worse than reporting nothing. So the release path waits
      # for the version its tag names, and fails if it never arrives rather
      # than measuring the wrong thing. Only there: the input is empty on
      # every other trigger
      - name: Wait for the index to serve the released version
        if: inputs.version != ''
        shell: bash
        env:
          TAG: ${{ inputs.version }}
        run: |
          version="${TAG#v}"
          for attempt in $(seq 20); do
            if curl -sf --max-time 10 -o /dev/null \
                "https://pypi.org/pypi/btclib/${version}/json"; then
              echo "the index serves ${version}"
              exit 0
            fi
            echo "attempt ${attempt}: ${version} is not served yet"
            sleep 15
          done
          echo "::error::${version} never appeared on the index"
          exit 1
      # uv rather than actions/setup-python, which is what every other
      # workflow here already uses and what this one has to use for a
      # reason of its own: setup-python installs from the runner tool
      # cache, whose manifest has no Windows arm64 build below 3.11 --
      # measured, it starts at 3.11 -- because CPython never produced
      # one. So the windows-11-arm cell at 3.10 died asking for an
      # interpreter that does not exist, "The version '3.10' with
      # architecture 'arm64' was not found", having never reached the
      # install this workflow exists to check. uv fetches
      # python-build-standalone and takes the emulated x86-64 build
      # there, which is what test.yml's own windows-11-arm cells have
      # been doing all along.
      #
      # Nothing about btclib is arm64-specific here, and the gap is not
      # one a user falls into: 3.10 on a Windows arm64 machine *is* the
      # emulated x86-64 build, there being no other, so the resolver
      # takes btclib_secp256k1's cp310-win_amd64 wheel and it runs
      # under the same emulation the interpreter does. The bindings'
      # own wheel matrix says the same thing from the other side --
      # win_arm64 from cp311 up, cp310 win_amd64 alone -- because a
      # wheel cannot be built for an interpreter that was never built.
      # Measured on the first run this workflow ever had: seventeen cells
      # green, that one red, and the release it was checking was sound
      - name: Setup uv with Python ${{ matrix.python }}
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python }}
      # --verbose so the log names the btclib_secp256k1 wheel this cell
      # resolved to, and on the include cell above where btclib itself is
      # built from its sdist, what that build did too. --only-binary
      # btclib on every other cell: without it a yanked or missing wheel
      # demotes a cell to an sdist build silently, and the run stays green
      # while testing the wrong thing -- the failure mode issue #1153
      # named, and now the one thing a wheel cell here cannot become by
      # accident. Only btclib is constrained either way, never its
      # dependencies: this install names no extra, so btclib_secp256k1 is
      # one of them and is left to resolve however pip normally would,
      # and neither flag here names it. install-published-secp256k1,
      # below, is the job that names the extra and is entitled to
      # constrain btclib_secp256k1 too, with its own --only-binary --
      # the same flag applied a second time rather than a reason to
      # change this one. An
      # environment variable and a shell conditional rather than a ${{ }}
      # expression inside run, as both siblings already do: matrix values
      # are not attacker-controlled, but the pattern is worth keeping
      # uniform. A venv of its own, and every step below runs --no-project
      # against it: there is no checkout, so nothing of this repository is
      # on the path either way, and that is the property the header claims
      - name: Install btclib from PyPI
        shell: bash
        env:
          NO_BINARY: ${{ matrix.no-binary || false }}
        run: |
          uv venv --python ${{ matrix.python }}
          if [ "$NO_BINARY" = "true" ]; then
            uv pip install --verbose --no-binary btclib btclib
          else
            uv pip install --verbose --only-binary btclib btclib
          fi
      # the ecc surface, as test.yml's dist job asserts it: a signature
      # round trip is the one thing an import cannot get wrong by itself,
      # and a bindings release that installs and answers incorrectly is
      # what this catches.
      # That one asserts something more, that the bindings are serving
      # (issue #1117), and this deliberately does not: the install above
      # names btclib and no extra, so the bindings are not asked for and
      # nothing here is entitled to them. That is the supported
      # configuration of issues #990, #991 and #992 -- the one
      # `no-bindings` runs the suite in -- and what it makes this step
      # answer is that the published wheel works on the Python arithmetic
      # alone, which is the question a bare `pip install btclib` asks
      - name: Verify a signature, round tripped
        shell: bash
        run: |
          uv run --no-project python -c "import btclib; \
            from btclib.ecc import dsa; \
            from btclib.to_pub_key import pub_keyinfo_from_prv_key; \
            print(btclib.__version__); \
            assert btclib.__version__ != 'unknown'; \
            assert dsa.verify(b'btclib', pub_keyinfo_from_prv_key(1)[0], \
              dsa.sign(b'btclib', 1))"
      # the trezor test vector, whose seed is fixed forever: this is the
      # check the header describes, the one that touches a _data/ file a
      # bare import does not reach
      - name: Verify a BIP39 seed, derived from shipped word lists
        shell: bash
        run: |
          uv run --no-project python -c \
            "from btclib.mnemonic.bip39 import seed_from_mnemonic; \
            m = 'abandon abandon abandon abandon abandon abandon abandon ' \
                'abandon abandon abandon abandon about'; \
            seed = seed_from_mnemonic(m, 'TREZOR').hex(); \
            expected = ( \
              'c55257c360c07c72029aebc1b53c05ed0362ada38ead3e3e9efa370' \
              '8e53495531f09a6987599d18264c1e1c92f2cf141630c7a3c4ab7c8' \
              '1b2f001698e7463b04'); \
            assert seed == expected, seed"

  install-published-secp256k1:
    name: >-
      Install ${{ matrix.python }}[secp256k1] from PyPI on
      ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-26-intel
          - macos-latest
          - windows-latest
          - windows-11-arm
        # one interpreter, where install-published samples three: the
        # bindings publish a wheel per (platform, interpreter) pair, so a
        # broken pair can in principle hide behind either axis, but the
        # two are not equally likely to hide one. Measured against
        # https://pypi.org/pypi/btclib-secp256k1/json for the newest
        # release, 0.8.0.4: every platform below has a wheel for every
        # supported interpreter, cp310 through cp315t, win_arm64's floor
        # of cp311 excepted -- which is the paragraph below -- so trying a
        # second interpreter on a platform that already has one answers
        # the same "does a wheel exist and import here" question again.
        # A missing wheel is where the two publishing pipelines actually
        # differ per platform -- a manylinux build, a macOS universal2
        # build and a Windows build are three independent jobs in the
        # bindings' own release workflow -- which is why the platform axis
        # stays install-published's own instead of shrinking to one, the
        # thing issue #1143 asks to be argued rather than assumed.
        # 3.14 and not install-published's 3.10 floor: the same JSON API
        # answer says btclib_secp256k1 ships no win_arm64 wheel below
        # cp311, which is what makes install-published fetch an emulated
        # win_amd64 interpreter for its 3.10 cell on windows-11-arm (see
        # that job's own comment). 3.14 has a native win_arm64 wheel, so
        # this job resolves the bindings this platform actually ships
        # rather than exercising that workaround a second time
        python: ["3.14"]
    timeout-minutes: 20
    steps:
      # the same wait, for the same reason install-published's copy
      # states: a run started by release.yml's call must not measure the
      # version the tag is replacing
      - name: Wait for the index to serve the released version
        if: inputs.version != ''
        shell: bash
        env:
          TAG: ${{ inputs.version }}
        run: |
          version="${TAG#v}"
          for attempt in $(seq 20); do
            if curl -sf --max-time 10 -o /dev/null \
                "https://pypi.org/pypi/btclib/${version}/json"; then
              echo "the index serves ${version}"
              exit 0
            fi
            echo "attempt ${attempt}: ${version} is not served yet"
            sleep 15
          done
          echo "::error::${version} never appeared on the index"
          exit 1
      - name: Setup uv with Python ${{ matrix.python }}
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python }}
      # --only-binary on both packages: btclib for the reason
      # install-published's own comment gives, and btclib_secp256k1 for
      # the same one applied to the package this job adds. Without it, a
      # wheel the bindings have not published for this cell demotes the
      # install to a source build -- a C toolchain question a hosted
      # runner may or may not answer -- and the run would stay green
      # while never having asked whether a published wheel imports
      - name: Install btclib[secp256k1] from PyPI
        shell: bash
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install --verbose \
            --only-binary btclib --only-binary btclib_secp256k1 \
            "btclib[secp256k1]"
      # is_libsecp256k1_serving is the assertion install-published's own
      # comment says it is not entitled to, that job's install naming no
      # extra. This job names the extra, so it is entitled to the
      # question and asks it before the signature, which is what gives
      # that signature its meaning: verified by libsecp256k1 rather than,
      # unnoticed, by the Python arithmetic it would otherwise silently
      # be -- issue #1116, live on main once already, is exactly the
      # failure a passing signature alone cannot distinguish from this
      - name: Verify the bindings serve, with a signature round tripped
        shell: bash
        run: |
          uv run --no-project python -c "import btclib; \
            from btclib.curves import is_libsecp256k1_serving; \
            from btclib.ecc import dsa; \
            from btclib.to_pub_key import pub_keyinfo_from_prv_key; \
            print(btclib.__version__); \
            assert btclib.__version__ != 'unknown'; \
            assert is_libsecp256k1_serving(), \
              'the secp256k1 extra resolved, the bindings do not serve'; \
            assert dsa.verify(b'btclib', pub_keyinfo_from_prv_key(1)[0], \
              dsa.sign(b'btclib', 1))"
