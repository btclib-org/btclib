---
# Skip execution of one or more hooks using the SKIP environment variable:
# $ SKIP=mypy git commit -m "foo"
# $ SKIP=mypy,ruff-check pre-commit run --all-files
#
# If want to disable all hooks while committing, use the --no-verify/-n option:
# $ git commit -n -m "foo"

# these hooks are the lint gate: the lint workflow runs this very file, so
# what CI enforces is exactly what a commit enforces, with no second list
# of tools and versions to keep in step. What pre-commit.ci provides on
# top of that, and what it is kept for, is the periodic pull request
# bumping the revisions pinned below
ci:
  # a bot committing to a branch is at odds with the rest of this setup,
  # where no workflow token can write and every action is pinned to a
  # commit SHA: a failing hook is fixed by its author
  autofix_prs: false
  # onto dev, as dependabot does: master only receives merges from it
  autoupdate_branch: dev
  autoupdate_commit_msg: "Update the pinned pre-commit hook revisions"
  autoupdate_schedule: weekly
  # the hooks pre-commit.ci cannot run: they shell out to uv, which is not
  # installed there, and the lint workflow covers them
  skip: [mypy]

repos:
  # this file checking itself, and the only two hooks here with no
  # environment to install. A `files` or `exclude` pattern that stops
  # matching anything is a hook that has quietly stopped running, which is
  # the shape of issue #145 one level up: the rule is still written down
  # and no longer enforced. One pattern to go stale today, the
  # `files: \.py$` on copyright-notice -- and nothing else would say so
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        # not the default --fix=auto, which normalizes a file to its own
        # most frequent ending: a file entirely in CRLF is consistent by
        # that measure, so it stays, and the LF lines added to it are
        # converted the wrong way. This repository is LF throughout
        args: [--fix=lf]
      - id: check-case-conflict
      # no check-executables-have-shebangs, by check-hooks-apply's own
      # verdict: it selects on types [executable], nothing tracked here
      # carries that bit, and a hook that matches no file is not a guard
      # on the future but a line that reads as a rule while enforcing
      # nothing. That is the whole reason the meta hooks are in this
      # file, and overruling one of them would be an odd way to keep them
      #
      # its converse stays off too, and not by oversight: every module here
      # opens with "#!/usr/bin/env python3", which is the house header
      # above the copyright notice the hook below enforces and not a
      # claim that the file is a script. 154 files have one and none is
      # executable, so enabling this means either chmod +x on a library
      # or deleting a convention -- measured, not guessed
      # - id: check-shebang-scripts-are-executable
      # no byte order mark anywhere today, and the same kind of guard as
      # check-executables-have-shebangs: what it costs is one line, what
      # it buys is that an editor on another platform cannot quietly add
      # three bytes in front of a python file
      - id: fix-byte-order-marker
      # this one *adds* "# -*- coding: utf-8 -*-" to every python file.
      # UTF-8 has been the default source encoding since python 3 and the
      # floor here is 3.10, so it is 155 dead lines
      # - id: fix-encoding-pragma
      - id: check-yaml
      - id: check-json
      # both of this hook's defaults are wrong for this tree: at
      # --indent=2 it fails on 44 of the 45 json files, and with the key
      # sort on, on 33. The golden-file
      # fixture writes json.dumps(indent=4) (tests/conftest.py), so at
      # indent 2 the two would rewrite each other on every run; and
      # sorting the keys reorders a golden file against the insertion
      # order to_dict() emits, which the next run of the suite reports as
      # a mismatch -- the sort does not churn the diff, it breaks the
      # tests. With both flags 39 of the 45 files already conform.
      # --autofix because every other fixing hook here corrects rather
      # than reports
      - id: pretty-format-json
        name: pretty-format-json (in place fixes)
        args: [--autofix, --indent=4, --no-sort-keys]
        # tests/**/_data/ is the vendored directory, as tests/_data/
        # README.md declares it: five of the six files that do not
        # conform are vectors that file gives a blob SHA and the verdict
        # "identical" to, and a reformat voids the pin and the verdict
        # together. Excluded by directory rather than by name so that the
        # next file vendored into it is safe before anyone remembers this
        # line; check-json above still answers the question worth asking
        # of them, which is whether they parse. The lookahead is the four
        # files in there that have no pinned blob for a reformat to void:
        # three of btclib's own and one of chain data, whose provenance is
        # a txid rather than a blob. By name because there are four, and
        # because the default for anything else in that directory has to
        # stay "not touched". (?x) is verbose mode, i.e. the newlines
        # below are not part of the pattern
        exclude: |
          (?x)^tests/([^/]+/)?_data/
          (?!descriptor_checksums\.json
            |rfc6979\.json
            |electrum_test_vectors\.json
            |unspendable_script_pub_keys\.json)
      - id: check-merge-conflict
      - id: check-vcs-permalinks
      - id: detect-private-key
      - id: debug-statements
      - id: check-docstring-first
      # the hook's default, *_test.py, with neither args nor exclude.
      # What it is for is the one failure mode a test suite cannot report
      # on itself -- a file named so that pytest never collects it is not
      # a red test, it is no test, and the count in the report is the only
      # thing that moves.
      # test_*.py, i.e. --pytest-test-first, would guard the same thing,
      # pytest's default `python_files` collecting both; *_test.py, the
      # convention the 71 test modules follow, needs no args. No
      # exclude, and the hook's own exemptions, conftest.py and
      # __init__.py, are what keep it that way: shared test code lives in
      # the package __init__ -- the vector loaders in tests/__init__.py,
      # helpers in the __init__ of tests/script and tests/script_engine.
      # Naming a loader module vectors_test.py instead would be this
      # hook's failure mode written by hand: a name that says "test" to
      # every reader, on the one module with none
      - id: name-tests-test
      - id: check-toml
      # only files being *added* are measured, the hook intersecting its
      # arguments with git's added set, so the 9 MB of
      # script_assets_test.json already vendored does not trip it and the
      # next one that size does. The default 500 KB is left alone: it is
      # the threshold at which a blob deserves a sentence in
      # tests/_data/README.md saying where it came from
      - id: check-added-large-files
      # there are none, and a submodule is the one dependency that would
      # not be in uv.lock, not be pinned by dependabot, and not be
      # visible in an sdist
      - id: forbid-submodules
  # the credentials of other systems, which is the half of secret scanning
  # GitHub's free plan does not cover: partner and provider tokens are
  # scanned server-side, the generic patterns (PEM keys, connection
  # strings, authentication headers) belong to Secret Protection, and the
  # API accepts that setting with a 200 and leaves it disabled.
  # detect-private-key above covers the PEM case, and the lint workflow
  # runs these hooks on every pull request, a fork's included, so this is
  # not only a local gate.
  # Not gitleaks: all of its hook ids invoke it with --staged, so under
  # "pre-commit run --all-files", which is what CI runs, it scans an
  # empty staged set and passes
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: detect-secrets (credentials of other systems)
        # the test data of a signing library is private keys by the
        # hundred, published upstream and vendored to be compared against,
        # so three json vector files account for 412 findings on their own.
        # They are recorded in .secrets.baseline as already reviewed rather
        # than excluded from the scan: an exclusion makes a file blind for
        # good, and the difference is not theoretical -- an AWS key planted
        # in one of them is not seen while it is excluded and is seen now.
        # The baseline was generated with the two entropy plugins off, and
        # it is the baseline that decides which plugins run. That is a
        # deliberate limit: with them on this tree yields 36306 findings,
        # and every new hex constant would fail the hook until someone
        # regenerated the file -- in vectors made of 64-character hex
        # strings, a new one is what a legitimate addition looks like, so
        # the check would report the work rather than the risk.
        # Adding a vector to those files means regenerating the baseline;
        # CONTRIBUTING.md has the command
        args: [--baseline, .secrets.baseline]
  # a typo in a comment is cosmetic; the same typo in the README is the
  # shop window, that file being both the btclib.org homepage and the PyPI
  # long description, and in an exception message it is an interface --
  # `invalid type marker lenght` was pinned verbatim by a test, so nothing
  # could correct it without noticing the test too.
  # Configured in pyproject.toml ([tool.codespell]) rather than in args
  # here: the skip list needs a paragraph of justification, and a hook
  # invocation is the wrong place for one
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        name: codespell (prose and comments)
        # the "clear" dictionary alone, where codespell's default is
        # "clear,rare": measured over this tree, the other four builtins add
        # 13 findings and one of them is a typo. "rare" reports "lets" (as
        # in "lets the release workflow gate publication") and "falsy";
        # "usage" is not a spell checker at all, flagging "master" -- 17
        # times here, every one of them a bip32 master key or a github url;
        # "code" and "names" add nothing this code base contains. A hook
        # whose findings are mostly wrong gets an ignore list long enough to
        # hide a real typo, so the one it did find, "fro" for "from", was
        # corrected by hand instead
        args: [--builtin, clear]
  # the second spell checker, and not a replacement for the one above:
  # codespell matches whole words and keeps the hyphen inside the token, so
  # `y-simmetry` and `hex-strin` were invisible to it with every builtin
  # dictionary enabled, while typos splits hyphens, snake_case and
  # camelCase. Between them they found six typos in shipped surfaces, the
  # README's `bitcon` included. pyproject.toml ([tool.typos]) has the whole
  # of the reasoning and the configuration, as for codespell
  - repo: https://github.com/crate-ci/typos
    rev: v1.48.0
    hooks:
      - id: typos
        name: typos (identifiers and hyphenated words, in place fixes)
        # what the hook declares, restated rather than inherited: both
        # flags are choices this repository has to keep making. Dropping
        # --write-changes would make it a report where every other fixing
        # hook here corrects; dropping --force-exclude would make
        # [tool.typos.files] silent, because pre-commit passes filenames
        # and typos honours its own exclude list only under that flag --
        # measured, without it the normative BIP-39 italian wordlist takes
        # 18 corrections into English
        args: [--write-changes, --force-exclude]
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      # --fix: corrects in place, like every other fixing hook here
      - id: markdownlint-cli2
        name: markdownlint-cli2 (in place fixes)
        args: [--fix]
  # the width of a yaml line, which nothing else here measured: the hook
  # above holds markdown to 80 columns and ruff holds python comments and
  # docstrings to the same, and the workflows were the one place prose
  # could grow without a limit -- 117 columns at the worst.
  # Configured in .yamllint.yaml rather than in args here, as codespell
  # and typos are configured in pyproject.toml: the two rules enabled and
  # the two left off need a paragraph each, and the width is not 80 for a
  # reason that has to be written down.
  # No args, and the hook declares none either, so there is nothing here
  # to drop by omission -- unlike zizmor below
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        name: yamllint (line width and document start)
  # .github/dependabot.yml is validated by nothing else here: check-yaml
  # above asks whether it is yaml, and actionlint below reads workflows
  # and not this. A typo in a package-ecosystem or a directory is not an
  # error to GitHub -- it silently updates nothing, and the evidence is a
  # pull request that never arrives. That file is the whole of the answer
  # to issue #158, both ecosystems targeting dev so that bot commits reach
  # master through it, so "it stopped running and said nothing" is exactly
  # the failure to guard against.
  # check-github-workflows is not added beside it: actionlint already
  # reads every workflow and goes further than the schema does, into
  # expressions, contexts and runner labels
  # .readthedocs.yaml is the same argument again: 2.7 KB that check-yaml
  # reads as yaml and nothing reads as a build definition, on a service
  # whose failure mode is a docs build that stops happening
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.35.0
    hooks:
      - id: check-dependabot
      - id: check-readthedocs
  # the workflows are 3, 6 and 8 KB of yaml with expressions in it, and
  # nothing validated them: an unknown key, a typo in a context reference,
  # an action input that does not exist, a job depending on a job that is
  # not there are all things a run discovers by failing.
  # The python packaging of actionlint rather than the upstream hook, whose
  # only non-docker id is language: golang, i.e. a go toolchain on every
  # machine that commits and on pre-commit.ci
  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    # not below actionlint 1.7.12: its list of runner labels is compiled
    # in, and 1.7.9 does not know macos-26-intel, which the test matrix
    # runs on
    rev: v1.7.12.24
    hooks:
      - id: actionlint
        name: actionlint (github workflows)
        # actionlint delegates the body of a run: step to shellcheck, and
        # of a "shell: python" step to pyflakes, if it finds them on the
        # PATH: without them it validates the yaml around a shell script
        # and not the script. Declared here rather than installed by hand,
        # so that every machine and pre-commit.ci check what CI checks --
        # the runner image happens to carry shellcheck, so leaving it to
        # chance meant CI checking more than a commit did.
        # Pinned, unlike the setuptools below, because nothing bumps an
        # additional dependency: pre-commit.ci moves rev, dependabot has no
        # pre-commit ecosystem. That is the point rather than the cost -- a
        # shellcheck release adding a check would otherwise turn a pull
        # request red for having changed nothing
        additional_dependencies:
          - shellcheck-py==0.11.0.1
          - pyflakes==3.4.0
  # actionlint asks whether a workflow is correct, zizmor whether it is
  # safe: a token persisted where a later step can read it, a cache
  # restored into the job that builds what gets published, an expression
  # interpolated into a shell script, a trigger that runs a fork's code
  # with write access. The default persona is the gate; --persona=auditor
  # adds advice (12 notes today, none of them a defect: 8 in release.yml
  # and 4 in test.yml, all of them unnamed jobs) and is worth
  # running by hand rather than on every commit
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.28.0
    hooks:
      - id: zizmor
        # offline is what it does by default, said out loud: it warns about
        # the implicit choice on every run, and the choice is the right one.
        # Two audits can query GitHub for the actions a workflow pins --
        # impostor-commit and known-vulnerable-actions -- which would make
        # the hook want a token and report differently on a machine that
        # has none. Those two therefore stay unrun, here and in CI.
        # --no-progress is repeated rather than added: args replaces what
        # the hook declares, and that flag is the whole of what it declares,
        # so passing --offline alone would drop it. Measured here, piping the
        # output, the two are byte for byte identical: zizmor sees there is
        # no terminal. The hook declares it for the environment where that
        # detection fails and the progress bar lands in the log, which is
        # pre-commit.ci (zizmor issue 582) -- not reproducible from here,
        # and not a reason to drop a flag its author put there
        args: [--offline, --no-progress]
  - repo: https://github.com/leoll2/copyright_notice_precommit
    rev: 0.1.1
    hooks:
      - id: copyright-notice
        args: [--notice=COPYRIGHT, --enforce-all]
        files: \.py$
  # ruff replaces autoflake, bandit, black, docformatter, flake8, isort,
  # pydocstringformatter, pydocstyle, pylint, pyupgrade, and yesqa
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        name: ruff check (in place fixes)
        args: [--fix]
      - id: ruff-format
        name: ruff format (in place fixes)
  # not the mirrors-mypy hook: it injects --ignore-missing-imports, which
  # turns an unresolved (or misspelled) import into Any, the opposite of
  # strict, and it type checks in an isolated environment, where every
  # import of the btclib_libsecp256k1 bindings is exactly that. Declaring
  # them there would mean building libsecp256k1 for the hook, and from
  # PyPI at that, where the version this project requires is not yet
  # published. This is the very command the lint workflow runs, against
  # the project environment and the real pytest.
  # --locked, as everywhere else, and not --frozen, which takes uv.lock
  # as it finds it: a dependency added to pyproject.toml without a re-lock
  # leaves mypy type checking a stale environment and saying nothing about
  # it. The uv-lock hook below catches the stale lock in the same run, but
  # only after this one has already produced a verdict on the wrong
  # environment, and the lint workflow runs this file, so CI inherits that
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict, in the project environment)
        entry: >
          uv run --locked --no-default-groups --group lint --group test
          mypy btclib tests
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.0
    hooks:
      # keep uv.lock in sync with pyproject.toml
      - id: uv-lock
  - repo: https://github.com/mgedmin/check-manifest
    rev: "0.51"
    hooks:
      - id: check-manifest
        description: Check the completeness of MANIFEST.in for Python packages.
        language: python
        pass_filenames: false
        always_run: true
        # check-manifest builds an sdist with "python -m build"; on
        # pre-commit.ci build cannot create its isolated environment (no
        # ensurepip in the interpreter, read-only virtualenv app data), so
        # build the sdist in the hook environment itself, which just needs
        # the build requirements (setuptools) to be available
        args: [--no-build-isolation]
        additional_dependencies: [setuptools]
  - repo: https://github.com/regebro/pyroma
    rev: "5.0.1"
    hooks:
      - id: pyroma
