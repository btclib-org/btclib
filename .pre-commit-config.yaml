# Skip execution of one or more hooks using the SKIP environment variable:
# $ SKIP=mypy git commit -m "foo"
# $ SKIP=mypy,ruff-check pre-commit run --all-files
#
# If want to disable all hooks while committing, use the --no-verify/-n option:
# $ git commit -n -m "foo"

# these hooks are the lint gate: the lint workflow runs this very file, so
# what CI enforces is exactly what a commit enforces, with no second list
# of tools and versions to keep in step. What pre-commit.ci provides on
# top of that, and what it is kept for, is the periodic pull request
# bumping the revisions pinned below
ci:
  # a bot committing to a branch is at odds with the rest of this setup,
  # where no workflow token can write and every action is pinned to a
  # commit SHA: a failing hook is fixed by its author
  autofix_prs: false
  # onto dev, as dependabot does: master only receives merges from it
  autoupdate_branch: dev
  autoupdate_commit_msg: "Update the pinned pre-commit hook revisions"
  autoupdate_schedule: weekly
  # the hooks pre-commit.ci cannot run: they shell out to uv, which is not
  # installed there, and the lint workflow covers them
  skip: [mypy]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-case-conflict
      # - id: check-executables-have-shebangs
      # - id: check-shebang-scripts-are-executable
      # - id: fix-byte-order-marker
      # - id: fix-encoding-pragma
      - id: check-yaml
      - id: check-json
      # - id: pretty-format-json
      - id: check-merge-conflict
      - id: check-vcs-permalinks
      - id: detect-private-key
      - id: debug-statements
      - id: check-docstring-first
      # - id: name-tests-test
      - id: check-toml
  # the credentials of other systems, which is the half of secret scanning
  # GitHub's free plan does not cover: partner and provider tokens are
  # scanned server-side, the generic patterns (PEM keys, connection
  # strings, authentication headers) belong to Secret Protection, and the
  # API accepts that setting with a 200 and leaves it disabled.
  # detect-private-key above covers the PEM case, and the lint workflow
  # runs these hooks on every pull request, a fork's included, so this is
  # not only a local gate.
  # Not gitleaks, which was the first candidate: all of its hook ids
  # invoke it with --staged, so under "pre-commit run --all-files", which
  # is what CI runs, it scans an empty staged set and passes
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: detect-secrets (credentials of other systems)
        # the two entropy plugins are off and three vector files excluded,
        # for one reason: the test data of a signing library is private
        # keys by the hundred, published upstream and vendored to be
        # compared against. With every plugin on, this tree yields 36306
        # findings; with the entropy plugins off, 412, all of them in the
        # three files below; with those excluded, none.
        # What still fails is what should: a planted PEM key, AWS key and
        # password are all caught, while a file of WIF keys and extended
        # private keys, i.e. what this library legitimately carries, is not
        args:
          - --disable-plugin
          - HexHighEntropyString
          - --disable-plugin
          - Base64HighEntropyString
        exclude: |
          (?x)^tests/(
            ecc/_data/ecdsa(_custom_nonce)?_sig|
            script/_data/taproot_test_vector
          )\.json$
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      # the markdownlint-cli2-fix hook is gone: --fix is now an argument
      - id: markdownlint-cli2
        name: markdownlint-cli2 (in place fixes)
        args: [--fix]
  # the workflows are 3, 6 and 8 KB of yaml with expressions in it, and
  # nothing validated them: an unknown key, a typo in a context reference,
  # an action input that does not exist, a job depending on a job that is
  # not there are all things a run discovers by failing.
  # The python packaging of actionlint rather than the upstream hook, whose
  # only non-docker id is language: golang, i.e. a go toolchain on every
  # machine that commits and on pre-commit.ci
  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    # not below actionlint 1.7.12: its list of runner labels is compiled
    # in, and 1.7.9 does not know macos-26-intel, which the test matrix has
    # been running on all along
    rev: v1.7.12.24
    hooks:
      - id: actionlint
        name: actionlint (github workflows)
        # actionlint delegates the body of a run: step to shellcheck, and
        # of a "shell: python" step to pyflakes, if it finds them on the
        # PATH: without them it validates the yaml around a shell script
        # and not the script. Declared here rather than installed by hand,
        # so that every machine and pre-commit.ci check what CI checks --
        # the runner image happens to carry shellcheck, so leaving it to
        # chance meant CI checking more than a commit did.
        # Pinned, unlike the setuptools below, because nothing bumps an
        # additional dependency: pre-commit.ci moves rev, dependabot has no
        # pre-commit ecosystem. That is the point rather than the cost -- a
        # shellcheck release adding a check would otherwise turn a pull
        # request red for having changed nothing
        additional_dependencies:
          - shellcheck-py==0.11.0.1
          - pyflakes==3.4.0
  # actionlint asks whether a workflow is correct, zizmor whether it is
  # safe: a token persisted where a later step can read it, a cache
  # restored into the job that builds what gets published, an expression
  # interpolated into a shell script, a trigger that runs a fork's code
  # with write access. The default persona is the gate; --persona=auditor
  # adds advice (11 notes today, none of them a defect) and is worth
  # running by hand rather than on every commit
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.28.0
    hooks:
      - id: zizmor
  - repo: https://github.com/leoll2/copyright_notice_precommit
    rev: 0.1.1
    hooks:
      - id: copyright-notice
        args: [--notice=COPYRIGHT]
        files: \.py$
  # ruff replaces autoflake, bandit, black, docformatter, flake8, isort,
  # pydocstringformatter, pydocstyle, pylint, pyupgrade, and yesqa
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        name: ruff check (in place fixes)
        args: [--fix]
      - id: ruff-format
        name: ruff format (in place fixes)
  # not the mirrors-mypy hook: it injects --ignore-missing-imports, which
  # turns an unresolved (or misspelled) import into Any, the opposite of
  # strict, and it type checks in an isolated environment, where every
  # import of the btclib_libsecp256k1 bindings is exactly that. Declaring
  # them there would mean building libsecp256k1 for the hook, and from
  # PyPI at that, where the version this project requires is not yet
  # published. This is the very command the lint workflow runs, against
  # the project environment and the real pytest
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict, in the project environment)
        entry: >
          uv run --frozen --no-default-groups --group lint --group test
          mypy btclib tests
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.0
    hooks:
      # keep uv.lock in sync with pyproject.toml
      - id: uv-lock
  - repo: https://github.com/mgedmin/check-manifest
    rev: "0.51"
    hooks:
      - id: check-manifest
        description: Check the completeness of MANIFEST.in for Python packages.
        language: python
        pass_filenames: false
        always_run: true
        # check-manifest builds an sdist with "python -m build"; on
        # pre-commit.ci build cannot create its isolated environment (no
        # ensurepip in the interpreter, read-only virtualenv app data), so
        # build the sdist in the hook environment itself, which just needs
        # the build requirements (setuptools) to be available
        args: [--no-build-isolation]
        additional_dependencies: [setuptools]
  - repo: https://github.com/regebro/pyroma
    rev: "5.0.1"
    hooks:
      - id: pyroma
