[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "btclib"
# the one place the version is declared: btclib.__version__ reads it back
# from the installed metadata, and docs/source/conf.py reads it from this
# file. It used to be the other way round, a literal in btclib/__init__.py
# that setuptools imported and conf.py repeated, which is why the release
# workflow had to compare two declarations before trusting either
version = "2026.8"
description = "A library for 'bitcoin cryptography'"
readme = "README.md"
license = { text = "MIT License" }
authors = [{ name = "The btclib developers", email = "devs@btclib.org" }]
# btclib_libsecp256k1 requires >=3.9, and python 3.8 is end-of-life
requires-python = ">=3.9"
dependencies = ["btclib_libsecp256k1>=0.7.1rc1"]
keywords = [
    "bitcoin",
    "cryptography",
    "elliptic-curves",
    "ecdsa",
    "schnorr",
    "RFC-6979",
    "bip32",
    "bip39",
    "electrum",
    "base58",
    "bech32",
    "segwit",
    "message-signing",
    "bip340",
]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://btclib.org"
Download = "https://github.com/btclib-org/btclib/releases"
Documentation = "https://btclib.readthedocs.io/"
GitHub = "https://github.com/btclib-org/btclib"
Issues = "https://github.com/btclib-org/btclib/issues"
"Pull Requests" = "https://github.com/btclib-org/btclib/pulls"

[dependency-groups]
# packages required to develop, build, and test btclib
# hypothesis generates the input the fixed vectors cannot: the vectors
# are the conformance suite, and a codec library needs the malformed
# bytes nobody thought to write down as well. It caps at 6.141 on
# python 3.9, which the universal lock resolves per interpreter, so the
# matrix needs no exclusion
test = ["coverage", "hypothesis", "pytest", "pytest-cov", "pytest-xdist"]
lint = ["mypy", "pre-commit", "ruff"]
# the distribution files are built and published by uv itself: what this
# group holds is what inspects them, before an upload consumes the version
build = ["check-manifest", "check-wheel-contents", "pyroma", "twine"]
docs = ["myst-parser", "sphinx", "sphinx_rtd_theme"]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "build" },
    { include-group = "docs" },
]

[tool.uv.sources]
# development and CI track the bindings under development, not the
# released ones: this is uv-only metadata, so the published btclib keeps
# depending on plain btclib_libsecp256k1 from PyPI.
# The branch is where a re-lock looks, not something uv.lock follows: a
# lock entry always records the commit it resolved, so tracking the head
# is `uv lock --upgrade-package btclib_libsecp256k1`, deliberately, and
# every CI command passes --locked to get the commit that was tested
btclib_libsecp256k1 = { git = "https://github.com/btclib-org/btclib_libsecp256k1", branch = "dev" }

[tool.setuptools.packages.find]
include = ["btclib*"]
namespaces = true

[tool.pytest.ini_options]
# where the tests are, so a bare "pytest" from the root collects them and
# nothing else, whatever else the tree grows
testpaths = ["tests"]
# -ra summarizes everything that was not a plain pass. On a matrix of 55
# jobs a skip, an xfail or a warning is otherwise invisible: it is not a
# failure, so nobody opens the log to find it.
# --strict-config makes a typo in this very table an error rather than a
# warning that scrolls past a hundred lines of dots, and --strict-markers
# does the same for a marker nobody registered, which is how a misspelled
# skipif silently stops skipping
addopts = "-ra --durations=8 -n auto --strict-config --strict-markers"
# a test that was expected to fail and passed is a fixed bug still marked
# as broken: strict turns it red instead of reporting xpass
xfail_strict = true
# a deprecation warning is the early form of a break, emitted years before
# the removal that will fail the suite: on a 3.9 to 3.14 spread, plus
# pypy, there is time to act on it only if it is not silent.
# The list carries no ignore, and no test silences a warning wholesale:
# the one btclib emits, BTClibUserWarning, is asserted with pytest.warns
# where a test provokes it deliberately, and silenced by category alone at
# the single call in tests/script_engine that provokes it incidentally.
# A blanket simplefilter("ignore") would defeat this table, which is why
# there is none: checked on 3.9, 3.14, 3.14t and pypy3.11. An ignore added
# here should name the warning, not a module, and say what would let it be
# dropped
filterwarnings = ["error"]

[tool.coverage.run]
omit = ["*/site-packages/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 2
# the gate that replaced coveralls.io: a local threshold, with no secret
# and no third party service, enforced on every run instead of only on
# pull requests targeting master.
# The comparison is against the total rounded to precision above, so with
# 12033 statements this allows 18 of them to go uncovered, against the 9
# uncovered today: enough slack not to trip over a line, tight enough
# that a regression cannot hide
fail_under = 99.85

[tool.mypy]
strict = true
show_column_numbers = true
show_error_codes = true
exclude = [
    "build",
]

[tool.ruff]
# target-version is inferred from project.requires-python

[tool.ruff.lint]
select = [
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "D",    # pydocstyle
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "FURB", # refurb
    "I",    # isort
    "ISC",  # flake8-implicit-str-concat
    "PGH",  # pygrep-hooks
    "PIE",  # flake8-pie
    "PL",   # pylint
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "RUF",  # ruff-specific rules
    "S",    # flake8-bandit
    "SIM",  # flake8-simplify
    "TRY",  # tryceratops
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    # docstrings: only modules and public classes/functions are documented
    "D101", # undocumented-public-class
    "D102", # undocumented-public-method
    "D103", # undocumented-public-function
    "D105", # undocumented-magic-method
    "D107", # undocumented-public-init
    "D203", # incorrect-blank-line-before-class (conflicts with D211)
    "D213", # multi-line-summary-second-line (conflicts with D212)
    "D301", # escape-sequence-in-docstring
    "D405", # capitalize-section-name, and the other section rules
    "D406", # new-line-after-section-name
    "D407", # dashed-underline-after-section
    "D413", # blank-line-after-last-section
    # line length is enforced by the formatter
    "E501", # line-too-long
    # uppercase math symbols (M, R, Q, ...) are variables, not constants:
    # ruff mistakes comparisons against them for Yoda conditions
    "SIM300", # yoda-condition
    # ambiguous unicode (−, non-breaking space) in comments is intentional
    "RUF003",
    # rebinding the loop variable is used throughout the code base
    "PLW2901", # redefined-loop-name
    # dataclasses define __eq__ without __hash__ on purpose
    "PLW1641", # eq-without-hash
    # complexity metrics: not enforced on this codebase
    "PLR0904", # too-many-public-methods
    "PLR0911", # too-many-return-statements
    "PLR0912", # too-many-branches
    "PLR0913", # too-many-arguments
    "PLR0914", # too-many-locals
    "PLR0915", # too-many-statements
    "PLR0917", # too-many-positional-arguments
    "PLR2004", # magic-value-comparison
    # exception messages are built inline, on purpose
    "TRY003", # raise-vanilla-args
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"] # re-exported imports
"tests/**" = [
    "D",      # docstrings are not required in tests
    "S101",   # assert
    "S311",   # non-cryptographic random: fine in tests
    "B017",   # assert-raises-exception
    "PT011",  # pytest-raises-too-broad
    "PT012",  # pytest-raises-with-multiple-statements
    "PT018",  # pytest-composite-assertion
    "RUF043", # pytest-raises-ambiguous-pattern
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
