[build-system]
# 77 is the floor for the PEP 639 metadata below, and for both halves of
# it at once: the SPDX string form of `project.license` and
# `project.license-files` arrived in setuptools 77.0.0, which is the
# version the deprecation warning for the old table form names. An
# isolated build resolving anything older fails on the syntax rather than
# ignoring it, which is what the bound is for
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "btclib"
# the one place the version is declared: btclib.__version__ reads it back
# from the installed metadata, and docs/source/conf.py reads it from this
# file. Not a literal in btclib/__init__.py for setuptools to import and
# conf.py to repeat: two declarations are two things a release workflow
# has to compare before trusting either
version = "2026.9"
description = "A library for 'bitcoin cryptography'"
readme = "README.md"
# PEP 639: a SPDX expression and the files it refers to, replacing the
# deprecated license table and the License :: classifier
license = "MIT"
license-files = ["LICENSE", "COPYRIGHT", "AUTHORS.md"]
authors = [{ name = "The btclib developers", email = "devs@btclib.org" }]
requires-python = ">=3.10"
# Required, where the bindings below are an extra, and that asymmetry was
# weighed rather than inherited: a `fetch` extra was considered and
# refused (issue #1126). CONTRIBUTING.md's dependency paragraph carries
# the reasoning, beside the ceiling argument it already makes.
dependencies = [
    "bitcoin-core-rpc>=2026.8.13",
]
keywords = [
    # The GitHub repository topics, in the same order, and the order is by
    # relevance rather than alphabetical: PyPI shows keywords as they are
    # given, and the first few are read as what the package is. GitHub
    # sorts its own alphabetically and takes lowercase only, which is the
    # spelling here too, so the two lists differ in nothing but length.
    "bitcoin",
    "cryptography",
    "elliptic-curves",
    "secp256k1",
    "ecdsa",
    "schnorr",
    "bip340",
    "musig2",
    "bip32",
    "bip39",
    "slip39",
    "electrum",
    "psbt",
    "taproot",
    "segwit",
    "base58",
    "bech32",
    "output-descriptors",
    "hardware-wallet",
    "message-signing",
    # Past the twenty topics GitHub allows, so these are keywords and not
    # topics. Nothing caps this list, and a keyword for a feature the
    # library has costs nothing.
    "rfc-6979",
    "mnemonic",
    "merkle-proof",
    "bip44",
    "bitcoin-script",
]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.optional-dependencies]
# The bindings are the default and the recommended install -- `pip
# install "btclib[secp256k1]"`, quoted because zsh is macOS's login
# shell and answers `no matches found` to the bare form, and it is
# what README.md and the guide tell a reader to run -- and an extra
# rather than a dependency because
# btclib answers without them: every delegation asks a dispatch that
# declines where they are absent, and `btclib._libsecp256k1` is the one
# import that decides it. What that buys is a btclib a distribution can
# package with no C toolchain in reach, and a caller that must not check
# libsecp256k1 with libsecp256k1 (issue #198). What it costs is in
# RELEASE_NOTES.md, because an upgrade that stops installing them is an
# upgrade onto the Python arithmetic, which is tens of times slower and
# is not constant-time -- SECURITY.md publishes both
secp256k1 = [
    # 0.8.0.3 for `xonly.tweak_add_` (btclib-secp256k1#158), which
    # `script.taproot` calls: it tweaks the parsed internal key, where
    # `xonly.tweak_add` parses the x again and that parse is a field square
    # root. The same version for `keys.pubkey_sum`, `xonly.pubkey_verify`
    # and `xonly.to_pubkey` (btclib-secp256k1#171), which `curves.curve`
    # calls -- one sum instead of a combine per term, and the two
    # questions about an x asked as x-only questions. The same version
    # again for `keys.pubkey_tweak_mul_sum` (btclib-secp256k1#182), which
    # is that sum with its terms as well, so that no product of a
    # multi-scalar multiplication crosses the boundary; and for
    # `ssa.Signer` (btclib-secp256k1#154), which `ecc.ssa.Signer` holds so
    # that a keypair is built once per key rather than once per signature;
    # and for `dsa.sign` accepting a caller-owned 32-octet cffi array as
    # `prvkey` and passing it through unconverted (btclib-secp256k1#253),
    # which `ecc.dsa.Signer` now holds so that `wipe` reaches the
    # delegated arm too (issue #1009).
    # 0.8.0.4 for the `musig` module (btclib-secp256k1#282), which
    # `btclib._libsecp256k1` imports and `btclib.ecc.musig2` calls --
    # `KeyAggCache` and `Session`, which is issue #1049's delegation of
    # `partial_sig_verify_`.
    # That last one is why this floor is not decoration.
    # `btclib._libsecp256k1` imports the whole surface in one `try` whose
    # `except ImportError` sets `INSTALLED = False`, so a bindings
    # missing a single name of it costs not that one delegation but every
    # one of them: the install answers on the Python arithmetic,
    # silently, tens of times slower and not in constant time. A floor
    # naming 0.8.0.3 while this tree imports `musig` describes exactly
    # that install, which is issue #1116
    "btclib_secp256k1>=0.8.0.4",
]

[project.urls]
homepage = "https://btclib.org"
documentation = "https://btclib.readthedocs.io/"
download = "https://github.com/btclib-org/btclib/releases"
changelog = "https://github.com/btclib-org/btclib/blob/main/RELEASE_NOTES.md"
repository = "https://github.com/btclib-org/btclib"
issues = "https://github.com/btclib-org/btclib/issues"
pull_requests = "https://github.com/btclib-org/btclib/pulls"

[dependency-groups]
# The extra of `project.optional-dependencies` again, as a group. uv has
# no default extra -- `[tool.uv]` takes `default-groups` and nothing that
# would make an extra one -- so an extra alone would leave `uv sync` and
# every `--group` command of CONTRIBUTING.md resolving a btclib without
# the bindings, which is half a suite: the tests that matter most here
# compare the two implementations against each other.
#
# So the specifier is written twice, and `tests/build_system_test.py`
# refuses the day the two stop agreeing. What the group buys is that no
# documented command had to grow an `--extra`, and that the job of issue
# #991 is those same commands with this group left out
bindings = ["btclib_secp256k1>=0.8.0.4"]
# what runs the suite, without what the suite delegates to: `test` is the
# two together and is what every documented command asks for, while
# `harness` alone is the environment the no-bindings job of test.yml
# builds. Splitting them is what makes that job a `--group` and not a
# second lock file -- uv's `--no-group` suppresses a group that was
# selected, not one another group includes
harness = [
    "coverage",
    "hypothesis",
    "pytest",
    "pytest-cov",
    "pytest-randomly",
    "pytest-xdist",
]
test = [{ include-group = "harness" }, { include-group = "bindings" }]
lint = [{ include-group = "bindings" }, "mypy", "pre-commit", "ruff"]
# the distribution files are built and published by uv itself: what this
# group holds is what inspects them, before an upload consumes the
# version. Named `check`, not `build`, so `--only-group build` means the
# same thing here as in btclib-secp256k1, which already has both names:
# the tools that build a distribution, not the ones that inspect one
check = ["check-manifest", "check-wheel-contents", "pyroma", "twine"]
mutation = ["cosmic-ray"]
docs = [
    { include-group = "bindings" },
    "myst-parser",
    "sphinx",
    "sphinx_rtd_theme",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "check" },
    { include-group = "docs" },
    { include-group = "mutation" },
]

[tool.uv]
# the oldest uv Dependabot's own uv-ecosystem updater bundles: it runs
# `uv lock` with exactly that version regardless of this key, so any
# higher floor fails every update it attempts before it starts. That
# version already understands the lock format the uv-lock hook of
# .pre-commit-config.yaml writes -- the hook pins a newer rev that
# pre-commit.ci moves on its own schedule, and regenerates the committed
# file, so this floor only has to stay low enough for Dependabot rather
# than match the hook. Declared here the floor still holds for every uv
# command, not the hook alone, so an uv older than this refuses rather
# than rewriting the lock in a format a newer one cannot read -- uv is
# pre-1.0 and has changed that format before. It also reaches CI without
# a second pin: setup-uv, given no version input, reads this key, and a
# bare minimum specifier makes it install the latest uv, so the runners
# are never behind the floor and there is nothing here to go stale
required-version = ">=0.11.31"

[tool.setuptools.packages.find]
include = ["btclib*"]
namespaces = true

[tool.check-wheel-contents]
# the wheel's `btclib/` diffed against this checkout's, file for file and
# in both directions (W101 missing, W102 extra). With no `package` given
# check-wheel-contents reads the wheel's own RECORD and asks nothing
# about the tree the wheel was supposed to carry, so a `py.typed` or a
# `_data/*.json` dropped by a packaging change builds, installs and
# imports cleanly and is reported clean.
#
# It was left unconfigured here on purpose until now, and the reason was
# redundancy rather than inapplicability: `check-manifest` below gates
# this tree against the sdist and `verify_dist_contents.py` gates the
# sdist against the wheel, so chained they imply tree == sdist == wheel.
# The organization standard's section 12 no longer accepts that trade
# (btclib-org/.github#51, issue #1200): some other check implying the
# same diff does not stand in for the flag where the flag applies,
# because the implication is the same assertion bought with code to
# maintain, and the two hops here sit in different workflows -- a
# pre-commit hook under the lint gate, and `test.yml`'s `dist` job -- so
# the chain holds only while both run.
#
# No `ignore`: nothing ships outside `btclib/`, so neither W003 nor W009
# can fire, unlike btclib-secp256k1, whose dynamic wheel carries a shared
# object beside the package on purpose.
package = ["btclib"]

[tool.check-manifest]
# the website, not the package. btclib.org is served from this repository's
# root, so the Jekyll sources sit beside the library: they are tracked, they
# have no business in an sdist, and a tracked file the sdist omits is
# exactly what check-manifest reports. Naming them here says that in the
# configuration of the tool that asks the question, not as MANIFEST.in
# exclude rules, which read as packaging decisions while matching nothing
# any include has added
ignore = [
    # the editor's workspace: tracked, so that a checkout is told what the
    # gate enforces, and no more part of a distribution than the website
    # below is
    ".vscode/*",
    # Claude Code's own workspace config, same argument as .vscode/* above.
    # A tree rather than a flat directory -- the settings sit beside a
    # commands/ directory -- so the pattern is the one _layouts/** below
    # uses and not .vscode/*'s single level
    ".claude/**",
    "CNAME",
    "Gemfile",
    "_config.yml",
    "_layouts/**",
    "assets/**",
    # configuration of the links workflow, and check-manifest already
    # ignores .github by default: an sdist that carries no workflow has no
    # use for the ignore list of one. Unlike .pre-commit-config.yaml and
    # .secrets.baseline, which it does carry, because the lint gate is
    # runnable from an unpacked sdist
    ".lycheeignore",
    # the tests of what .github/scripts holds, whose subject is under
    # .github and therefore not shipped either. The suite an sdist carries
    # has to be runnable from it, and a test whose subject is absent is not
    # a test but a fixture error; MANIFEST.in excludes them and says the same
    "tests/check_python_arm_authority_test.py",
    "tests/check_vendored_vectors_test.py",
    "tests/generate_sbom_test.py",
    "tests/mutation_counts_test.py",
    "tests/verify_dist_contents_test.py",
]

[tool.pytest.ini_options]
# where the tests are, so a bare "pytest" from the root collects them and
# nothing else, whatever else the tree grows
testpaths = ["tests"]
# -ra summarizes everything that was not a plain pass. Across a matrix of
# interpreters and platforms a skip, an xfail or a warning is otherwise
# invisible: it is not a failure, so nobody opens the log to find it.
# --strict-config makes a typo in this very table an error rather than a
# warning that scrolls past a hundred lines of dots, and --strict-markers
# does the same for a marker nobody registered, which is how a misspelled
# skipif silently stops skipping
# -n auto pays here, and the number is worth writing down because a local
# run says the opposite: on ten cores this suite is 18 seconds either way,
# six alternating pairs splitting three to three, so a laptop cannot decide
# this. CI can, and does. One dispatch per configuration of each platform
# sweep, the `Run pytest` step compared cell by cell across the three of
# them and the coverage job:
# the pool wins in every single cell, 189s against 87s at the median, 2.2x,
# which over a full sweep is better than an hour of compute. The ratio
# rises where the runner is slowest: about 2.9x on the arm images against
# 1.9x on the x86 ones, which is the shape of a
# fixed startup cost amortised over more work. bitcoin-core-rpc measured the
# same question and removed the flag, its 298 socket-free tests finishing
# before ten workers start; the criterion the two share is in checksig's
# docs/test-parallelism.md, and it is the length of a cell rather than the
# count of its tests. To re-derive:
#
#     for w in ubuntu macos windows; do
#         gh workflow run $w.yml --ref <a branch with the flag removed>
#         gh workflow run $w.yml --ref main
#     done
#     gh api repos/$GITHUB_REPOSITORY/actions/runs/<id>/jobs?per_page=100
#
# --dist worksteal rather than xdist's default `load`, because the cost
# here is lopsided: the taproot vectors of
# tests/script_engine/python_path_test.py carry most of the suite's slowest
# cases and a large part of its work, orders of magnitude above a median
# test that --durations rounds to zero. `load` hands out the queue in
# chunks and a worker that draws several of those finishes long after the
# others; worksteal lets an idle worker take back what is queued behind a
# busy one. Measured on the tree, best of three:
# tests/README.md carries the two things that do *not* help -- reordering
# the slow module first, and any -n other than auto -- and the commands
# that measure all three again, no wall clock here surviving the suite it
# was taken on.
#
# pytest-randomly is in the test group and needs no flag here: installed,
# it shuffles the order and prints the seed, and `-p no:randomly` puts the
# file order back when a failure has to be reproduced against it. What it
# guards is the one thing a green suite cannot tell you about itself --
# whether a test passes because of what ran before it. That is not
# hypothetical here: issues #139, #140 and #165 were all one object's
# mutation reaching another, and the answer to them was frozen
# dataclasses, a tuple witness stack and per-call defaults, which this
# re-checks on every run instead of at the tests written for each. Three
# seeds were measured green before it went in
addopts = "-ra --cov --durations=8 -n auto --dist worksteal --strict-config --strict-markers"
# --cov is here so that the ratchet below is what a bare `uv run pytest`
# measures: it cost nothing to move (the suite is the same 37 seconds
# either way on 3.14, coverage.py using sys.monitoring there), and a gate
# only the coverage job runs is one a change meets after it is pushed.
# What it does cost is that `fail_under` applies to a partial report too,
# so a run of one file would fail on the tree's coverage rather than on
# its own: tests/conftest.py's `coverage_fail_under` is where that is
# answered, and why it is answered there.
#
# Its position is load-bearing, and this is the one line where that is
# said: --cov takes an *optional* value, so as the last token here it
# swallows the first argument the command line goes on to give. `pytest
# tests/ecc/dsa_test.py` became `--cov=tests/ecc/dsa_test.py` with no
# path left to select on -- the whole suite ran, measured a directory
# that is in `omit` below, and reported 0.00% against a fail_under of
# 100. Green under `pytest -q tests/...`, which is what hid it: a token
# starting with `-` is not consumed. Anywhere but last is safe, and
# --durations=8 after it is what keeps it that way
# a test that was expected to fail and passed is a fixed bug still marked
# as broken: strict turns it red instead of reporting xpass
xfail_strict = true
# --strict-markers is on, so a marker is declared here or it is a typo.
# `integration` is what needs something this repository does not ship: a
# bitcoind to talk to, an HWI to run. Those tests skip themselves without
# BTCLIB_INTEGRATION in the environment, so the marker is for selecting
# them (`-m integration`) and for excluding them from a run that has the
# variable set for other reasons
markers = [
    "integration: needs an external program, opt-in via BTCLIB_INTEGRATION",
    "bindings: compares against btclib_secp256k1, so it needs it installed",
]
# a deprecation warning is the early form of a break, emitted years before
# the removal that will fail the suite: on a 3.10 to 3.14 spread, plus
# pypy, there is time to act on it only if it is not silent.
# The list carries no ignore, and no test silences a warning wholesale:
# the one btclib emits, BTClibUserWarning, is asserted with pytest.warns
# where a test provokes it deliberately, and silenced by category alone
# where tests/script_engine provokes it incidentally.
# A blanket simplefilter("ignore") would defeat this table, which is why
# there is none: checked on 3.10, 3.14, 3.14t and pypy3.11. An ignore added
# here should name the warning, not a module, and say what would let it be
# dropped
filterwarnings = ["error"]

[tool.codespell]
# the vendored data is skipped rather than corrected, and the distinction
# matters in both directions. The BIP39 wordlists are normative: "sting"
# is word 1712 of the English list, and correcting it to "string" changes
# every mnemonic ever derived from it. The test vectors have to stay byte
# for byte what upstream published, so a typo inside a Bitcoin Core
# comment or a signed message is part of the vector; tests/_data/README.md
# pins them, and this list is what keeps a spell checker from unpinning
# them. _generated_files holds committed output, rewritten by the tests
# themselves, and .secrets.baseline and uv.lock are hashes
# by extension rather than by directory, so that tests/_data/README.md --
# which records where each of those files came from -- is still spell
# checked, being prose about the data and not the data
skip = "*/_data/*.json,*/_data/*.csv,*/_data/*.txt,*/_data/*.bin,*/_generated_files/*,.secrets.baseline,uv.lock"
# identifiers, not misspellings: "wit" is a transaction's witness and
# "nd" is the Neutered Derivation the bip32 docstrings spell out. Both
# are real words to codespell's dictionary, so neither can be fixed by
# writing it differently -- unlike the rest of what this hook found,
# which was corrected instead of listed here
# "ser" and "unser" join them for a reason of this file's own rather than
# of the prose: `[tool.typos.default.extend-identifiers]` below has to
# carry Core's `Ser` and `Unser` as bare TOML keys, and a key cannot be
# written in the backticks the rule below hides a deliberate misspelling
# in. Every *prose* mention of either is backticked and already invisible
# to this hook; what these two entries cover is the two lines that
# configure the other one
ignore-words-list = "wit,nd,ser,unser"
# a misspelling written on purpose goes in backticks, and that is a
# convention of this repository rather than a preference: prose that
# documents a spell checker has to name what it catches, and the prose
# below costs codespell a finding for every one of them without the rule.
# codespell has no per-file configuration, so it holds everywhere
# it reads; what the rule hides from it is what is written inside
# backticks, i.e. identifiers, which are typos' half of the work and not
# this hook's -- the two hook names say as much. typos honours the same
# convention where it needs to, in [tool.typos.type.verbatim] below
ignore-regex = '`[^`]*`'

# the second spell checker, and the pair is deliberate: the two are blind
# in different places, so neither subsumes the other.
# codespell matches whole words against a curated list of misspellings,
# and its word regex keeps the hyphen inside the token: `y-simmetry` and
# `hex-strin` are one word each, in no dictionary, and therefore silent --
# measured, with every builtin enabled it reported nothing on the typos
# this hook found, while reporting a free-standing `simmetry` in the same
# run. That is the blindness the #161 entry in CHANGELOG.md records and
# worked around by splitting identifiers by hand; typos splits
# hyphens, snake_case and camelCase itself. Its dictionary also has
# entries codespell's lacks, `bitcon` -- in README.md, which is both the
# btclib.org homepage and the PyPI long description -- and `threshould`.
# One thing typos does not read is this file: measured, pyproject.toml is
# skipped even under --isolated, its own configuration not being something
# a spell checker can sensibly check. Everything below is therefore
# codespell's to keep honest
[tool.typos.files]
# the vendored data [tool.codespell] skips above, for the reasons given
# there, and the list has to be written again rather than shared because
# the glob syntax differs: "*/_data/*.json" matches at any depth for
# codespell and one directory deep for typos. Spelled codespell's way it
# left the normative BIP39 italian wordlist in the scan, where 18 words
# are "corrected" into English -- `tabacco` to tobacco, `normale` to
# normal --
# and the hook runs with --write-changes, so that is a rewrite of every
# mnemonic derived from that list, not a report
extend-exclude = [
    "**/_data/*.json",
    "**/_data/*.csv",
    "**/_data/*.txt",
    "**/_data/*.bin",
    "**/_generated_files/*",
    ".secrets.baseline",
    "uv.lock",
]

[tool.typos.default]
# addresses, keys and signatures written inline in the test sources, which
# splitting into words turns into a spell checker's worst input: `SHS`
# inside a base58 address, `Owrk` inside a base64 psbt. The rule is what
# keeps a vector byte for byte -- this hook fixes in place, so with the
# rule off it rewrites the sources it reads, an extended key's `ThmBZ`
# becoming `ThemBZ`.
# Ignored by shape rather than by file, unlike the vendored data above --
# these literals sit next to prose that has to stay checked, and a skipped
# tests/*.py would take the prose with it.
# One rule and not four: a pattern per encoding (base58, bech32, hex,
# base64) was written first and measured to be three rules of decoration,
# because an unanchored base58 class matches inside a bech32 address and
# inside a hash just as well. What is actually being said is "an unbroken
# run of 26 characters or more is a literal, not a word", 26 being the
# length of the shortest possible base58 address; the trailing = covers
# base64 padding, and no English word comes close
extend-ignore-re = ['[0-9A-Za-z+/]{26,}={0,2}']

[tool.typos.default.extend-identifiers]
# BIP342 spells it so, and the x is the placeholder for the opcode number
OP_SUCCESSx = "OP_SUCCESSx"
# HWI's own spelling of error code -4, refuse included: tests/hwi_test.py
# transcribes its error table, and a transcription that corrects its
# source is not one -- the name a caller reads in HWI's own output would
# then be one this repository never mentions. Fixed upstream or not, the
# pinned revision in tests/_data/README.md is what this has to match
UNKNWON_DEVICE_TYPE = "UNKNWON_DEVICE_TYPE"
# GitHub Pages' name-with-owner variable, read by the Jekyll layout, and
# the environment variable website.yml passes the same value in. The hook
# runs with --write-changes, so without these two lines it rewrites `NWO`
# as `NOW` and the build loses the repository whose metadata it was
# resolving
repository_nwo = "repository_nwo"
PAGES_REPO_NWO = "PAGES_REPO_NWO"
# Bitcoin Core's own name for the serialization parameters of an address,
# `Ser` for serialize where the dictionary reads a misspelt `Set`
# (src/protocol.h). btclib/p2p/address.py cites it, the hook runs with
# --write-changes, and a citation a spell checker rewrote names a symbol
# that is not in the source it points at -- which is worse than no
# citation, being one a reader would go and fail to find
SerParams = "SerParams"
# Core's writer for a 256-bit hash, `Ser` for serialize again
# (src/serialize.h). tests/p2p/block_filters_test.py cites it as the one
# function every BIP157 hash field is written with, and a citation the
# spell checker turned into `set_uint256` names nothing
ser_uint256 = "ser_uint256"
# Core's two halves of a serializer, `Ser` for serialize a third time and
# `Unser` for the reverse (src/serialize.h, and src/blockencodings.h's
# `DifferenceFormatter`, which is where BIP152's differential index
# encoding is written and read). btclib/p2p/compact_blocks.py cites both
# methods by name as the place each of its two overflow refusals is
# spelled in Core; the hook runs with --write-changes and turns them into
# `Set` and one of four guesses, and a citation a spell checker rewrote
# names a symbol that is not in the source it points at
Ser = "Ser"
Unser = "Unser"

[tool.typos.default.extend-words]
# "nd" is the Neutered Derivation of the bip32 docstrings, as for codespell
# above; "ands" is the verb, mult's further condition anded onto the
# bindings predicate. Neither can be written differently
nd = "nd"
ands = "ands"
# BIP322's prefix for the full variant of a signature, three characters
# as the other two are. The hook runs with --write-changes, so without
# this line it turns `ful` into `full` in btclib/bip322.py -- which is a
# signature every other implementation refuses, written by a spell
# checker into a wire format
ful = "ful"
# ruff's own name for flake8-copyright, in the comment above
# [tool.ruff.lint.flake8-copyright] explaining why it is selected
CPY = "CPY"

[tool.typos.type.verbatim]
# the three files that quote a word rather than use it: CHANGELOG.md names
# the `certifi` a dependency would have pulled in, an extended key's
# `ThmBZ`, the mypy message that offers `digest` for `digets`, and the
# singular `addopt` of a pytest option -- each right where it stands, and
# each one this hook's dictionary offers to correct; .pre-commit-config.yaml
# quotes the misspellings the two spell checkers found, and the exception
# message a test pins. This is the backtick convention of
# [tool.codespell] above, honoured on the files that need it rather than
# on all of them: outside these three a backticked word is an identifier,
# and identifiers are what this hook is here for.
# Not a preference either: with --write-changes and without this section,
# the hook corrects those quotations into nonsense -- prose saying
# `lenght` is now `length` reads as prose saying nothing, and a key or a
# message quoted from elsewhere stops being the thing quoted. Narrow enough
# that `y-simmetry`, unquoted in RELEASE_NOTES.md, was still found and
# fixed with the rule already in place
extend-glob = ["CHANGELOG.md", "RELEASE_NOTES.md", ".pre-commit-config.yaml"]
extend-ignore-re = ['`[^`]*`']

[tool.typos.type.mixed-case-vectors]
# electrum's seed-type table quotes several of its mnemonics a second time
# in mIxEd CaSe, that being exactly the normalization under test, and a
# checker that splits camelCase reads the halves as words: `SqUeEzE` is an
# `Ue` it offers to correct to "Use". With --write-changes that is a
# rewrite of a vector electrum published, and the test would then be
# measuring btclib against btclib.
# Ignored by shape and not by file, as [tool.typos.default]'s literal rule
# above is: a lower-case letter followed by an upper-case one inside one
# word is the shape, so the prose and the identifiers of the same file stay
# checked. Some of those words trip it today, and the rule covers the class
# because which of them trips it is a fact about a dictionary that updates
extend-glob = ["electrum_test.py"]
extend-ignore-re = ['\w*[a-z][A-Z]\w*']

[tool.coverage.run]
# what the ratchet measures, named here rather than on the command line
# that starts it. Unnamed, `--cov` measures every file the run imports,
# and that reaches .github/scripts/mutation_counts.py through the test
# importing it by path: the script's `main()` then reads as uncovered,
# nothing running it but a test spawning it as a subprocess, and
# subprocess coverage is not collected. So a bare `uv run pytest --cov`
# fails on a pristine checkout while the coverage-py job passes -- a
# local gate stricter than the one it exists to reproduce, which is the
# worse of the two directions: it asks for a fix that CI does not want.
# Named, the job and the local run are the same command, and the scripts
# lose nothing by it, mypy taking them as CONTRIBUTING.md's command says.
# Covering that `main()` instead would mean either coverage's subprocess
# handshake for one script, or a test calling it in-process for the sake
# of the measurement
source = ["btclib", "tests"]
# tests/integration is omitted because the ratchet measures what an
# ordinary run executes, and those tests skip themselves without
# BTCLIB_INTEGRATION: their bodies would be uncovered lines of tests/ at
# every commit, which is the ratchet reporting the switch rather than a
# defect. What covers them is the opt-in run, and the module docstrings
# carry the command
omit = ["*/site-packages/*", "tests/integration/*"]
# statement coverage alone calls a half-tested `if` fully covered: the
# line ran, one of its two ways out never did, and the ways out that go
# unexercised here are exactly the ones the library exists to get right
# -- a validation that refuses, a curve special case, a serialization
# path a shorter input takes. Measuring branches costs the ratchet
# nothing where a test already drives both sides, and where it does not
# the miss is a real one: it is either a test to write or a branch no
# input can reach, and the second carries its reason beside it. Not left
# at statements on the grounds that the total already reads 100.00%: a
# total that cannot fall is a total that measures less than it says
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 2
# a local threshold rather than a coveralls.io upload: no secret, no
# third party service, and enforced on every run instead of only on
# pull requests.
# 100 is not the same rule with the bar raised: coverage special-cases
# it, so `round(total, precision) < fail_under` does not apply and
# nothing short of an exact 100.00% passes -- 99.999% is a red build,
# where 99.99 passed everything above 99.985%. The statements it allows
# to go uncovered are therefore zero, and that is the whole of why. Any
# threshold below 100 allows some; how many is a division by a total
# that moves with every commit, so the gate cannot be read off the
# setting, and 99.9 -- ten times as wide -- is a whole handful.
# It also makes the report say what the exit code says, which 99.99 did
# not: pytest-cov prints `FAIL Required test coverage ... not reached`
# on `total < fail_under`, *unrounded*, while the exit code comes from
# the rounded comparison, so a run inside the rounding step printed FAIL
# and exited 0 -- 99.9891% said FAIL and passed, and only 99.98% turned
# the code 1. Both conditions are now "not exactly 100", so FAIL again
# means failed.
# The price is that a line no ordinary run reaches -- a fallback for a
# library that is installed, a guard the shipped data cannot trip --
# no longer disappears into a rounding step. It is covered by patching
# what stands in the way, which is what hashes_test and electrum_test
# already do and say, or it carries a `pragma: no cover` with the reason
# beside it, as borromean, bms and musig2 do for a branch arithmetic
# rules out. Neither of those is a build left red.
# Measured on one interpreter, 3.14, and that is still enough at 100:
# btclib has no sys.version_info and no sys.platform branch, so every
# job walks the same lines and a tree at 100.00% there is at 100.00%
# anywhere -- which a percentage below 100 could not promise, the
# statement count moving between versions. 3.14 because it is what
# .python-version pins, so a bare `uv run pytest --cov` locally measures
# what CI does; the job names the version too, and the two have to move
# together
fail_under = 100.0

[tool.mypy]
strict = true
show_column_numbers = true
show_error_codes = true
# the optional error codes strict does not turn on, surveyed one by one
# over btclib and tests. ignore-without-code makes every "type: ignore"
# name the rule it silences, so a blanket one cannot creep in, and
# deprecated reports a stdlib API on its way out, which on a 3.10 to 3.14
# spread is the same early warning filterwarnings = ["error"] buys at
# runtime.
#
# redundant-expr and possibly-undefined are the two more --enable-error-code
# adds beyond what a first pass found clean, and warn_unreachable below is
# the flag mypy exposes the third one through rather than through this
# list. All three found something: a runtime isinstance guard on a value
# whose static type promises more than an untrusted source -- unvalidated
# json in network.py's from_dict, a caller ignoring an annotation in
# bip21.py, an operator's own dispatch protocol in script.py's __add__ --
# can guarantee. Each of those sites carries its own
# `# type: ignore[...]` naming the code rather than a second global
# exemption: the check is worth having everywhere else, and a blanket
# ignore-list entry would have silenced it there too
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "ignore-without-code",
    "mutable-override",
    "narrowed-type-not-subtype",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unimported-reveal",
]
warn_unreachable = true
# the oldest interpreter this package supports, and also the oldest mypy
# can be aimed at -- "Python 3.9 is not supported (must be 3.10 or
# higher)" is its answer to anything lower. The two agree, so this key
# says exactly what requires-python says.
#
# Keep the key. Without it mypy targets whatever runs it, i.e. the 3.14 of
# .python-version, and a typing construct missing from the floor is then
# invisible. Ruff needs no equivalent, inferring py310 from
# requires-python.
#
# What the agreement buys is a whole class of bug moving from the matrix to
# the type checker. An annotation is not evaluated under "from __future__
# import annotations", but a type *alias* is an ordinary assignment, so
# "ScriptList | None" at module level was a TypeError on 3.9 that no static
# check could see: d284d0b7 was found by a 3.9 runner dying at collection,
# nothing else. Aimed at the floor rather than above it, mypy reports
# that itself. When mypy drops 3.10 in turn this pin will fail with the same
# clear message, and the answer will be to raise the floor -- not to
# reopen the gap.
#
# One run, not two. A second pass at 3.14 would check the same code: there
# is no sys.version_info branch anywhere in btclib or tests, so no source
# is conditional on the interpreter, and what differs between the two
# targets is only stdlib stub semantics. An stdlib API removed in 3.14 is a
# runtime failure the matrix reports, at 100% statement coverage
python_version = "3.10"
exclude = [
    "build",
]

[tool.ruff]
# target-version is inferred from project.requires-python

[tool.ruff.lint]
# preview and explicit-preview-rules only make sense as a pair. Naming a
# rule in `ignore` below, instead of coding it, is itself a preview
# feature, so the first line is what buys the second -- and alone it
# would also turn on every rule ruff is still designing. The second
# takes that back off: a preview rule then runs only where this file
# names it exactly, and a family name reaches none of them, which is why
# `extend-select` below exists at all. The rule set stays the stable one
# it already was, plus what that key spells out one rule at a time
preview = true
explicit-preview-rules = true
# A, BLE, C90, FA, FIX, FLY, RSE, SLOT, T10, T20 and TID are here by
# measurement: every unselected rule set was run over btclib and tests,
# and these are the ones that either find nothing today
# -- a ratchet, costing no cleanup -- or find something worth removing.
# PTH is the same case with a wider cleanup: every os.path and bare open()
# call in the library and its tests, replaced by pathlib. Two of the
# library sites are the module-level `datadir` of btclib.curves.curve and
# btclib.network, each a path a caller can read directly, so its type
# changes from str to Path there too -- a breaking change, recorded in
# RELEASE_NOTES.md, and not one this rule set finds on its own: ruff has no
# opinion on what a module chooses to expose.
#
# What the same survey rejected, with the reason it was rejected rather
# than the count it reached -- `uv run ruff check --select N --no-cache
# btclib tests` re-derives any of these in a second, and a number here
# rots with the next test file: N (uppercase math symbols are the
# convention here, as the magic-value-comparison note below already
# says), COM (COM812, which ruff's own documentation recommends against
# alongside the formatter), EM, FBT, EXE (all EXE001, i.e. the
# shebang-not-executable finding that .pre-commit-config.yaml records
# the same decision about), TC, ARG, ANN (all ANN401, the explicit Any
# of the vector loaders), SLF (all SLF001, tests reaching into private
# members on purpose), PERF (all PERF203, try/except in a retry loop).
# ERA is selected despite what it found on that survey: about half was
# genuine dead code and the other half prose that ERA read as code, and the
# half did not need a single noqa -- a reworded comment reads as prose to
# it, and a diagram belongs in the docstring, which it does not inspect.
# The zero-finding sets not taken are the ones for constructs this code
# base does not contain -- DTZ without datetime, G and LOG without
# logging, ASYNC, NPY -- because a rule that can never fire reads as an
# enforced invariant while enforcing nothing. TD is the other zero-finding
# set left out on purpose rather than for want of a construct: it and FIX
# both watch TODO-style comments, TD disciplining their format and FIX
# refusing them outright, and a codebase that finishes what it starts
# wants the second
select = [
    "A",   # flake8-builtins: a name that shadows a builtin
    "B",   # flake8-bugbear
    "BLE", # flake8-blind-except
    "C4",  # flake8-comprehensions
    "C90", # mccabe, at ruff's default with noqa'd exceptions: see below
    # flake8-copyright, replacing the copyright-notice pre-commit hook:
    # ed6e8014 found that hook checking only staged files unless given
    # --enforce-all, so "pre-commit run --all-files" -- what the lint
    # workflow actually runs -- silently checked nothing until that flag
    # was added by hand. A rule living inside ruff's own file-selection
    # logic has no separate flag to forget, checking whatever files it is
    # given the same way whoever is asking
    "CPY",
    "D",    # pydocstyle
    "E",    # pycodestyle errors
    "ERA",  # eradicate: code that was commented out instead of deleted
    "F",    # pyflakes
    "FA",   # flake8-future-annotations
    "FIX",  # flake8-fixme: a TODO left behind is a thing not finished
    "FLY",  # flynt: string concatenation ruff can turn into an f-string
    "FURB", # refurb
    "I",    # isort
    "ISC",  # flake8-implicit-str-concat
    "PGH",  # pygrep-hooks
    "PIE",  # flake8-pie
    "PL",   # pylint
    "PT",   # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "RSE",  # flake8-raise
    "RUF",  # ruff-specific rules
    "S",    # flake8-bandit
    "SIM",  # flake8-simplify
    "SLOT", # flake8-slots: a tuple/NamedTuple subclass without __slots__
    "T10",  # flake8-debugger: a breakpoint() left in
    "T20",  # flake8-print: a library writes to no stream of its own
    "TID",  # flake8-tidy-imports: absolute, so the layering is readable
    "TRY",  # tryceratops
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
# a rule and not a family, so it is here rather than in `select` above,
# which holds families and reaches no preview rule through any of them --
# pylint's unspecified-encoding is PLW1514 and preview is where ruff
# keeps it.
# It asks that `open`, `Path.open`, `read_text`, `write_text` and the
# tempfile factories name an encoding, because a call that omits it takes
# the locale's: UTF-8 wherever this suite is usually read, cp1252 on
# Windows, where a typographic quote in a docstring is a byte that maps
# to nothing and the module holding it fails to load rather than fails a
# test. windows.yml answers weekly and before a release, so nothing else
# asks in between.
# Zero findings when it was selected, which makes it a ratchet and not a
# cleanup. .pre-commit-config.yaml carries the other half, `text=True`
# being the same locale-dependent decode one layer out
extend-select = ["unspecified-encoding"]
# named rather than coded, here and in per-file-ignores below: `select`
# above has no choice, a family having no name of its own, but an entry
# that suppresses a single rule can say which -- so the reason sits in
# the comment and the rule sits in the entry, with no code left to look
# up between them
ignore = [
    # docstrings: every public module, class, method and function must
    # carry one -- D100/D104 and the D101/D102/D103 left out of this
    # list enforce exactly that (issue #290). The two still ignored are
    # the ones pep257 does not ask for: __init__ is documented by its
    # class, and a magic method by the data model it implements
    "undocumented-magic-method",
    "undocumented-public-init",
    # pydocstyle offers each of these as a mutually exclusive alternative
    # to a rule the "D" family above already selects -- D211
    # (blank-line-before-class) and D212 (multi-line-summary-first-line)
    # in order -- so no docstring can satisfy both sides of either pair
    # and disabling one is permanent, not a count that a future cleanup
    # could shrink
    "incorrect-blank-line-before-class",
    "multi-line-summary-second-line",
    # code length is enforced by the formatter, which reflows to its 88
    # columns everything it is allowed to rewrite. What is left for this
    # rule to find is what no width can break, almost all of it a test
    # vector, an extended key or a base64 signature on one line. The
    # prose the formatter never touches is measured instead by
    # max-doc-length below
    "line-too-long",
    # complexity metrics this codebase does not bound globally: measured
    # one at a time, too-many-arguments and too-many-positional-arguments
    # find many functions with several parameters and too-many-statements
    # finds several long ones too, none of it a short, nameable list of
    # exceptions the way too-many-public-methods, too-many-return-
    # statements, too-many-branches and too-many-locals were -- those
    # four are gone from this list now, the first and last for finding
    # nothing, the middle two carrying a `# noqa` at each of their sites
    # instead
    "too-many-arguments",
    "too-many-statements",
    "too-many-positional-arguments",
    # not a complexity metric, and measured widely on its own: what is
    # compared is almost always the size of a cryptographic object -- 32
    # or 33 for a key, 64 or 65 for a signature, 20 for a hash160 -- or an
    # index into a standardized algorithm's own constants, as
    # _ripemd160.py's 2, 3 and 4 are. The size *is* the domain, not a
    # value this code chose and could have named instead
    "magic-value-comparison",
    # measured widely too, and every one on purpose: the message is built
    # where the exception is raised because that is the only place holding
    # what went wrong -- the value refused, the length found instead of the
    # one expected -- and a shared exception class could not say that
    # without every raise site passing it back in anyway
    "raise-vanilla-args",
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"] # re-exported imports
# preview mode's undefined-export does not special-case a module-level
# __getattr__ (astral-sh/ruff#18504, open): these modules publish this
# way, as each docstring says, and F822 sees no import to bind the name
# to. btclib and btclib.script publish submodules; btclib.p2p publishes
# three functions, so that a codec does not import the rpc package the
# message start comes from. tests/all_test.py already walks `__all__`
# with getattr and fails on the same drift this rule would catch, so
# nothing here goes unchecked while the upstream rule does not know the
# pattern
"btclib/__init__.py" = ["F822"]
"btclib/p2p/__init__.py" = ["F822"]
"btclib/script/__init__.py" = ["F822"]
# collecting entropy from dice is a conversation: the module prompts with
# input() and prints how many rolls it needs and which ones count, so its
# prints are the interface, not a debugging leftover -- unlike a print
# anywhere else in the library, which is deleted rather than ignored
"btclib/mnemonic/entropy.py" = ["T201"]
# the mutation counter's one line of output is what the workflow step
# exists to put in the log. T20 is selected for the library, which writes
# to no stream of its own; a script whose caller is a workflow step is the
# case it is not about
".github/scripts/mutation_counts.py" = ["T201"]
# and the vendored-vector checker: BEHIND, SKIPPED and the all-clear line
# are what a weekly run's log says happened, the issue it opens or
# closes being the same report a second way
".github/scripts/check_vendored_vectors.py" = ["T201"]
# and the device wait, whose whole output is one line for the log of the
# job that started an emulator: what it saw and how long it took, or the
# ::error:: annotation naming what it saw instead
".github/scripts/wait_for_hwi_device.py" = ["T201"]
# and the Python-arm authority re-derivation: which module it is
# measuring, one line per disagreement found, and the all-clear or count
# at the end are what a weekly run's log says happened
".github/scripts/check_python_arm_authority.py" = ["T201"]
# the D rules are not here: a public test function, fixture or method
# states what it verifies -- the property, the vector, the failure
# mode -- under the same docstring gate as the library's public
# interface (issue #290). D102/D103 stop at that boundary, so a
# private or nested helper is held to the same convention every
# private helper in the library already is: undocumented unless the
# name alone does not say what it does (issue #349)
"tests/**" = [
    "S101",   # assert
    "S311",   # non-cryptographic random: fine in tests
    "B017",   # assert-raises-exception
    "PT011",  # pytest-raises-too-broad
    "PT012",  # pytest-raises-with-multiple-statements
    "PT018",  # pytest-composite-assertion
    "RUF043", # pytest-raises-ambiguous-pattern
]

[tool.ruff.lint.mccabe]
# ruff's default, and the functions over it each carry a noqa whose
# reason is the comment above the def -- ruff reads the code, the prose
# after it is for the reader, and a line of its own keeps both inside 80
# columns (issue #184). Not a global bound at the tree's worst, which
# keeps the worst from growing but lets any new function reach it
# unremarked; not per-file-ignores, which exempts the file: no file holds
# more than one of them, so exempting one would unguard every function
# beside it and buy the exemption nothing.
# The reasons carry no complexity number: nothing checks a number in a
# comment, and it would drift into a false claim. No exemption is
# permanent: RUF100 (unused-noqa, selected above) fails a noqa as unused
# the moment a refactor brings its function under the line, so the list
# can only shrink
max-complexity = 10

[tool.ruff.lint.pycodestyle]
# 80 columns on the prose, where the code keeps the formatter's 88. Not a
# compromise between two numbers: ruff-format reflows code and never a
# comment or a docstring, so 88 is what it can enforce and this is the
# rest -- the half of a file that carries the reasoning, held to the width
# every markdown file here is already held to by MD013.
# W505 is in the "W" set selected above and is inert without this line,
# ruff having no default doc length; setting it is the whole of the
# switch. A comment that ends in a URL is exempt, which is the amnesty
# MD013 gives an unbreakable link: the comments still over 80 columns are
# every one of them a link, and none is a defect
max-doc-length = 80

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.flake8-pytest-style]
# matching the bindings' own choice, and its reason: the names of a
# parametrize are a signature, and the comma-separated string is how
# pytest's own documentation writes one. Ruff's default, tuple, was never
# a decision this file made -- every other setting in it carries the
# measurement or the reason that chose it, and this one had neither
parametrize-names-type = "csv"

[tool.ruff.lint.flake8-copyright]
# COPYRIGHT is still the one place the notice text is written down; this
# is all three of its lines as one regex, not only the holder line --
# a file keeping the first and dropping the licence/text lines below it
# would have passed the single-line version and does not pass this one.
# Escaped literally rather than searched loosely, so the dated holder
# variants ed6e8014 found and reverted (2017-2021, 2017-2022,
# 2020-2022) would not have matched either.
# Anchored with ^ for the same reason: unanchored, CPY001 is a search
# over the first 4096 bytes and not a check that the notice opens the
# file, so an import or a docstring placed above it would still pass.
# No file here opens with a shebang, so nothing legitimate sits between
# byte zero and the notice for the anchor to exclude
notice-rgx = "^# Copyright \\(c\\) The btclib developers\\n# Distributed under the MIT software license, see the accompanying\\n# LICENSE file or https://opensource\\.org/license/mit for the full text\\."

# what keeps the docstrings of the public surface complete, ruff having
# no rule for a missing argument: the D family below asks that a
# docstring exists, and this asks that it says what the call takes and
# what it hands back. Run as a hook over btclib/ only; the comment on
# the hook has why that is the scope
[tool.pydoclint]
# napoleon renders it, which is what docs/source/conf.py enables, so the
# sections asked for here are the ones sphinx already understands
style = "google"
# the types are in the signature, and mypy is strict: repeating them in
# the docstring is a second place to be wrong, and the one nothing checks
arg-type-hints-in-docstring = false
check-return-types = false
# the default, and not the false sibling btclib-secp256k1 sets. There it
# is right: every docstring of a wrapper is a line, so switching the skip
# off is what makes the check reach any of them at all. Here what it
# reaches is `Args` and `Returns` sections that do not exist rather than
# sections that disagree with a signature, which is a rewrite of the
# whole package's prose and not a lint fix. Left at the default, this
# gates the docstrings that do carry sections, which is where the silent
# drift is: a signature grows a parameter and the section above it still
# lists the old ones. Issue #1178 is the stricter setting, how many
# findings it reaches, and the command that counts them -- no figure is
# repeated here, a count beside no way of re-measuring it being a line
# every change to the package can falsify in silence
skip-checking-short-docstrings = true
# pep257 -- ruff's convention here -- neither asks for a docstring on
# __init__ nor forbids one, and this package writes its constructors out
# by hand wherever a frozen dataclass validates itself. So a constructor
# that has something of its own to say keeps it, rather than folding it
# into a class docstring that is about the class
allow-init-docstring = true
# and this one is off, deliberately. It compares the Raises section with
# the `raise` statements of the body, and a btclib call refuses mostly
# through what it delegates to -- bytes_from_octets, assert_valid, the
# curve and network lookups -- so what a caller catches is not what this
# body raises. Kept on, every docstring would document its own body
# instead of its contract, which is the opposite of what these sections
# are for; the hierarchy a caller does catch is btclib/exceptions.py's,
# written down once there
skip-checking-raises = true
