---
# The btclib.org website, served by GitHub Pages from main's root.
#
#   $ gh api repos/btclib-org/btclib/pages
#   {"cname": "btclib.org", "build_type": "legacy",
#    "source": {"branch": "main", "path": "/"}}
#
# So this file, CNAME, Gemfile, _layouts/ and assets/ are website sources
# and not Jekyll leftovers, and every other file in main's root is a URL
# under btclib.org whether it was meant to be one or not. CONTRIBUTING.md
# has the section that says so.
title: btclib
description: A Python library for 'bitcoin cryptography'
logo: assets/img/btclib-logo.jpg

show_downloads: false
github:
  # the organization, which is where the repository, the PyPI project and
  # every URL in pyproject.toml live. This was a personal account, so the
  # site footer read "Maintained by" one developer while everything it
  # links to is owned by the org
  owner_url: https://github.com/btclib-org
  owner_name: The btclib developers

google_analytics:

theme: jekyll-theme-minimal

# There is no index.md, so Jekyll renders README.md as the homepage: a
# README edit is a website deploy. Everything else in main's root is
# published too unless this list stops it, the package itself included:
# drop the src/ and pyproject.toml entries below and /pyproject.toml
# and /src/btclib/alias.py answer with their own contents.
#
# The first block repeats Jekyll's own default exclude, because this key
# replaces that default rather than adding to it: without those entries
# back, declaring this list would *publish* the Gemfile, which is excluded
# today -- btclib.org/Gemfile is a 404, which is how the default was
# confirmed to be in effect.
#
# Not excluded, deliberately: README.md is the homepage; assets/ and
# _layouts/ are the site; CNAME is what Pages reads for the custom domain;
# LICENSE, CONTRIBUTING.md, REVIEWING.md, SECURITY.md, AUTHORS.md,
# RELEASE_NOTES.md and CHANGELOG.md are documents a visitor may
# reasonably want. REVIEWING.md is published for the reason
# CONTRIBUTING.md is, being its other half: what a pull request is
# answered against is something to read before opening one, not
# repository process kept back with CLAUDE.md and REPOSITORY.md below.
exclude:
  # Jekyll's defaults, restored
  - .sass-cache
  - .jekyll-cache
  - gemfiles
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  # the library and its tests: on the website by accident
  - src/
  - tests/
  - docs/
  # the atheris harnesses and their seed corpus, likewise: `.clusterfuzzlite/`
  # needs no entry here, Jekyll's own EntryFilter already skipping anything
  # starting with `.`
  - fuzz/
  # packaging and tooling, likewise
  - pyproject.toml
  - uv.lock
  - COPYRIGHT
  # repository process rather than pages for a visitor: agent instructions,
  # the branch rules and settings, and the release procedure
  - CLAUDE.md
  - REPOSITORY.md
  - RELEASING.md
